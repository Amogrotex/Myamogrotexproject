# =====================================================================
# FGI Fleet - RDP cockpit + persistent worker CMD sessions  (FIXED)
# Direct Tailscale discovery - NO GitHub worker registration
# ---------------------------------------------------------------------
# REQUIRED repository secret (Settings -> Secrets and variables -> Actions):
#   TAILSCALE_AUTHKEY
#       Reusable auth key from https://login.tailscale.com/admin/settings/keys
#       An EPHEMERAL + REUSABLE key is recommended: one run joins
#       1 cockpit + up to 18 workers, and ephemeral nodes clean
#       themselves up when the run ends.
#
# OPTIONAL repository secrets (auto-generated per run when omitted):
#   RDP_PASSWORD
#       Windows password for 'runneradmin' and 'CynetAdmin'.
#       If omitted, a strong random password is generated and printed
#       in the cockpit log + step summary. Auto-display is meant for
#       PRIVATE repos (public repo logs are readable by anyone).
#   FGI_TOKEN
#       Shared token between the cockpit client and worker agents.
#       If omitted, a random per-run token is generated automatically.
#
# Notes:
#  - One fleet at a time: a second run stays QUEUED until the live one
#    finishes (duplicate 'mainy-w*' hostnames would break discovery).
#  - GitHub-hosted jobs hard-stop at 6 h; keepalive is capped at 340
#    minutes to leave room for setup. Windows runners burn minutes 2x.
#  - FGI commands (from any CMD, cockpit or over RDP):
#      FGI refresh | FGI status | FGI list
#      FGI "cd work && py start.py"
# =====================================================================

name: FGI Fleet

env:
  RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
  TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}

on:
  workflow_dispatch:
    inputs:
      shards:
        description: 'Worker VMs (0-18)'
        required: false
        default: '3'
      keepalive_minutes:
        description: 'Session minutes (max 340)'
        required: false
        default: '340'
      boot_command:
        description: 'Optional command run on every worker at boot'
        required: false
        default: ''

concurrency:
  group: fgi-fleet
  cancel-in-progress: false

permissions:
  contents: read

jobs:

  # ================================================================
  # SETUP
  # ================================================================
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
      count: ${{ steps.mk.outputs.count }}
    steps:
      - name: Build worker matrix
        id: mk
        shell: bash
        env:
          SHARDS_IN: ${{ inputs.shards }}
        run: |
          n="$(printf '%s' "$SHARDS_IN" | tr -cd '0-9')"
          if [ -z "$n" ]; then n=3; fi
          n=$(( 10#$n ))
          if [ "$n" -lt 0 ]; then n=0; fi
          if [ "$n" -gt 18 ]; then n=18; fi

          if [ "$n" -eq 0 ]; then
            list='[]'
          else
            list=$(python3 -c "import json; print(json.dumps(list(range($n))))")
          fi

          echo "matrix=$list" >> "$GITHUB_OUTPUT"
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "Fleet: cockpit + $n worker(s)"

  # ================================================================
  # COCKPIT
  # ================================================================
  cockpit:
    needs: setup
    runs-on: windows-2025
    timeout-minutes: 355

    env:
      WORKERS_EXPECTED: ${{ needs.setup.outputs.count }}
      FGI_TOKEN_SECRET: ${{ secrets.FGI_TOKEN }}

    steps:

      - name: Preflight - check Tailscale auth key
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
            throw 'ROOT-CAUSE: TAILSCALE_AUTHKEY repository secret is not set. Create a reusable/ephemeral auth key at https://login.tailscale.com/admin/settings/keys and add it as a repo secret.'
          }

          Write-Host 'Tailscale auth key present.'

      - name: Cockpit 0 - resolve fleet token
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $t = [string]$env:FGI_TOKEN_SECRET
          $src = 'repository secret FGI_TOKEN'

          if ([string]::IsNullOrWhiteSpace($t) -or $t -eq 'CHANGE_ME_TO_RANDOM_TOKEN') {
            # No usable secret -> derive the same per-run token that the
            # workers derives, locally. No cross-job handoff involved.
            if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
              throw 'ROOT-CAUSE: no FGI_TOKEN secret and TAILSCALE_AUTHKEY is empty - cannot derive a fleet token. Set the TAILSCALE_AUTHKEY repo secret (or your own FGI_TOKEN).'
            }

            $salt = "fgi-v1|$($env:TAILSCALE_AUTHKEY)|$($env:GITHUB_RUN_ID)|$($env:GITHUB_RUN_ATTEMPT)"

            $sha = [System.Security.Cryptography.SHA256]::Create()
            try {
              $h = $sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($salt))
            } finally {
              $sha.Dispose()
            }

            $t = ([System.BitConverter]::ToString($h)) -replace '-', ''
            $src = 'derived per-run from TAILSCALE_AUTHKEY (set an FGI_TOKEN secret to pin your own)'
          }

          Write-Output "::add-mask::$t"

          Add-Content -Path $env:GITHUB_ENV -Value "FGI_TOKEN=$t"

          Write-Host "Fleet token resolved. Source: $src" -ForegroundColor Green

      - name: Cockpit 1 - connect Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          use-cache: 'true'

      - name: Cockpit 2 - resolve Tailscale IP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $tsExe = 'C:\Program Files\Tailscale\tailscale.exe'
          if (-not (Test-Path $tsExe)) {
            throw "Tailscale executable not found: $tsExe"
          }

          $ip = $null

          for ($i = 0; $i -lt 240; $i++) {
            $cand = ([string](& $tsExe ip -4 2>$null | Select-Object -First 1)).Trim()

            if ($cand -match '^100\.') {
              $ip = $cand
              break
            }

            Start-Sleep -Seconds 1
          }

          if (-not $ip) {
            throw 'ROOT-CAUSE: cockpit did not receive a Tailscale IPv4 address.'
          }

          & $tsExe set '--hostname=mainy' 2>$null

          Write-Host "Cockpit Tailscale IP: $ip" -ForegroundColor Green

      - name: Cockpit 3 - enable and tune RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          # --- resolve RDP password: secret or strong random fallback ---
          $pw = [string]$env:RDP_PASSWORD
          $generated = $false

          if ([string]::IsNullOrWhiteSpace($pw) -or $pw -eq 'CHANGE_ME') {
            $generated = $true

            $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()
            $bytes = New-Object byte[] 18
            $rng.GetBytes($bytes)
            $rng.Dispose()

            $pw = 'Fg!' + (([Convert]::ToBase64String($bytes)) -replace '[^A-Za-z0-9]', 'x')

            Add-Content -Path $env:GITHUB_ENV -Value "RDP_PW=$pw"
            Add-Content -Path $env:GITHUB_ENV -Value 'RDP_PW_GENERATED=1'

            Write-Host 'RDP_PASSWORD secret not set -> generated a strong random password (printed in the next steps).' -ForegroundColor Yellow
          }

          # --- relax local password policy so ANY password is accepted ---
          # (VM is ephemeral and RDP is firewalled to the Tailscale range.)
          $cfg = Join-Path $env:TEMP 'secpol.cfg'

          secedit /export /cfg $cfg | Out-Null

          if (Test-Path $cfg) {
            (Get-Content $cfg) |
              ForEach-Object { $_ -replace 'PasswordComplexity\s*=\s*1', 'PasswordComplexity = 0' } |
              ForEach-Object { $_ -replace 'MinimumPasswordLength\s*=\s*\d+', 'MinimumPasswordLength = 0' } |
              Set-Content -Path $cfg -Encoding ascii

            secedit /configure /db "$env:windir\security\local.sdb" /cfg $cfg /areas SECURITYPOLICY | Out-Null
            gpupdate /force | Out-Null
          }

          net accounts /minpwlen:0 | Out-Null

          # --- enable RDP and tune the session ---
          $ts  = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server'
          $rdp = "$ts\WinStations\RDP-Tcp"
          $pol = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'

          New-Item -Path $pol -Force | Out-Null

          Set-ItemProperty -Path $ts  -Name fDenyTSConnections -Value 0
          Set-ItemProperty -Path $rdp -Name UserAuthentication  -Value 0 -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $pol -Name fCompressionEnabled -Type DWord -Value 1 -Force

          foreach ($n in 'fDisableWallpaper','fDisableFullWindowDrag','fDisableMenuAnims','fDisableThemes') {
            Set-ItemProperty -Path $rdp -Name $n -Value 1 -ErrorAction SilentlyContinue
          }

          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
          powercfg /change monitor-timeout-ac 0
          powercfg /change standby-timeout-ac 0
          powercfg /change hibernate-timeout-ac 0

          # --- (re)create the logon accounts ---
          $secure = ConvertTo-SecureString $pw -AsPlainText -Force

          foreach ($name in 'runneradmin','CynetAdmin') {
            try {
              if (Get-LocalUser -Name $name -ErrorAction SilentlyContinue) {
                Set-LocalUser -Name $name -Password $secure -ErrorAction Stop
                Set-LocalUser -Name $name -PasswordNeverExpires $true -ErrorAction SilentlyContinue
              } else {
                New-LocalUser -Name $name -Password $secure -PasswordNeverExpires -AccountNeverExpires -Description 'FGI RDP account' -ErrorAction Stop
              }
            } catch {
              throw ("ROOT-CAUSE: Windows rejected the password for '{0}': {1}" -f $name, $_.Exception.Message)
            }

            Enable-LocalUser -Name $name -ErrorAction SilentlyContinue

            net user $name /active:yes | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "ROOT-CAUSE: net user $name /active:yes failed (exit $LASTEXITCODE)"
            }

            Add-LocalGroupMember -Group 'Administrators' -Member $name -ErrorAction SilentlyContinue
            Add-LocalGroupMember -Group 'Remote Desktop Users' -Member $name -ErrorAction SilentlyContinue
          }

          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop' -ErrorAction SilentlyContinue

          foreach ($proto in 'TCP','UDP') {
            $display = "FGI cockpit RDP $proto 3389"

            Remove-NetFirewallRule -DisplayName $display -ErrorAction SilentlyContinue

            $rule = @{
              DisplayName   = $display
              Direction     = 'Inbound'
              Protocol      = $proto
              LocalPort     = 3389
              RemoteAddress = '100.64.0.0/10'
              Action        = 'Allow'
              Profile       = 'Any'
            }

            New-NetFirewallRule @rule -ErrorAction SilentlyContinue | Out-Null
          }

          Set-Service -Name TermService -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service -Name TermService -ErrorAction SilentlyContinue

          $deny = (Get-ItemProperty $ts -Name fDenyTSConnections -ErrorAction SilentlyContinue).fDenyTSConnections
          if ($deny -ne 0) {
            throw "ROOT-CAUSE: RDP not enabled (fDenyTSConnections=$deny)"
          }

          $u1 = Get-LocalUser -Name 'runneradmin' -ErrorAction SilentlyContinue
          $u2 = Get-LocalUser -Name 'CynetAdmin' -ErrorAction SilentlyContinue

          if (-not $u1 -or -not $u2) {
            throw 'ROOT-CAUSE: RDP accounts missing after setup (runneradmin / CynetAdmin).'
          }

          Write-Host 'Cockpit RDP ready.' -ForegroundColor Green

      - name: Cockpit 4 - install FGI client
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:FGI_TOKEN)) {
            throw 'ROOT-CAUSE: fleet token missing in cockpit environment (token resolve step failed).'
          }

          New-Item -ItemType Directory -Path 'C:\FGI' -Force | Out-Null

          @'
          @echo off
          setlocal
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "C:\FGI\fgi.ps1" %*
          exit /b %errorlevel%
          '@ | Set-Content -Path 'C:\FGI\fgi.cmd' -Encoding ascii

          @'
          param(
            [Parameter(ValueFromRemainingArguments = $true)]
            [string[]]$Rest
          )

          $ErrorActionPreference = 'Continue'

          $dir = 'C:\FGI'
          $tokenFile = Join-Path $dir 'token.txt'
          $workersFile = Join-Path $dir 'workers.txt'
          $tsExe = 'C:\Program Files\Tailscale\tailscale.exe'

          $token = ''
          if (Test-Path $tokenFile) {
            $token = ((Get-Content $tokenFile -Raw).Trim())
          }

          function Get-FgiWorkers {
            if (-not (Test-Path $workersFile)) {
              return @()
            }

            return @(
              Get-Content $workersFile |
                ForEach-Object { $_.Trim() } |
                Where-Object { $_ -match '^100\.' } |
                Select-Object -Unique
            )
          }

          function Save-FgiWorkers([string[]]$ips) {
            @($ips | Where-Object { $_ -match '^100\.' } | Select-Object -Unique) |
              Set-Content -Path $workersFile -Encoding ascii
          }

          function Discover-FgiWorkers {
            $found = @()

            if (-not (Test-Path $tsExe)) {
              Write-Host "Tailscale not found: $tsExe" -ForegroundColor Red
              return @()
            }

            try {
              $obj = & $tsExe status --json 2>$null | ConvertFrom-Json

              if ($obj.Peer) {
                foreach ($property in $obj.Peer.PSObject.Properties) {
                  $peer = $property.Value

                  $name = ''
                  if ($peer.HostName) {
                    $name = [string]$peer.HostName
                  } elseif ($peer.DNSName) {
                    $name = [string]$peer.DNSName
                  }

                  if ($name -match '^mainy-w\d+(\.|$)') {
                    $ip = @($peer.TailscaleIPs) |
                      Where-Object { $_ -match '^100\.' } |
                      Select-Object -First 1

                    if ($ip) {
                      $found += $ip
                    }
                  }
                }
              }
            } catch {
              Write-Host ('Tailscale JSON discovery failed: ' + $_.Exception.Message) -ForegroundColor Yellow
            }

            $found = @($found | Select-Object -Unique)
            Save-FgiWorkers $found

            Write-Host ("Discovered worker(s): " + $found.Count) -ForegroundColor Green
            foreach ($ip in $found) {
              Write-Host ("  -> " + $ip)
            }

            return $found
          }

          function Test-FgiWorker([string]$ip) {
            try {
              $null = Invoke-WebRequest -Uri ("http://{0}:8442/ping" -f $ip) -Headers @{ 'X-FGI-Token' = $token } -TimeoutSec 5 -UseBasicParsing
              return $true
            } catch {
              return $false
            }
          }

          function Refresh-FgiWorkers {
            # Always rediscover first. Worker discovery no longer
            # depends on GitHub commits.
            $all = @(Discover-FgiWorkers)

            if ($all.Count -eq 0) {
              Save-FgiWorkers @()
              Write-Host 'No mainy-w* workers discovered on Tailscale.' -ForegroundColor Yellow
              return @()
            }

            $alive = @()

            foreach ($ip in $all) {
              if (Test-FgiWorker $ip) {
                $alive += $ip
              } else {
                Write-Host ("Worker offline/unreachable: " + $ip) -ForegroundColor Yellow
              }
            }

            Save-FgiWorkers $alive

            Write-Host ('Alive workers: ' + $alive.Count + ' -> ' + ($alive -join ', ')) -ForegroundColor Green

            return $alive
          }

          $cmd = ''

          if ($Rest) {
            $cmd = ($Rest -join ' ').Trim()

            if (
              $cmd.Length -ge 2 -and
              $cmd.StartsWith('"') -and
              $cmd.EndsWith('"')
            ) {
              $cmd = $cmd.Substring(1, $cmd.Length - 2)
            }
          }

          if ($cmd -eq '' -or $cmd -eq 'help') {
            Write-Host 'FGI - fleet command runner'
            Write-Host ''
            Write-Host '  FGI status'
            Write-Host '  FGI list'
            Write-Host '  FGI refresh'
            Write-Host '  FGI cd desktop'
            Write-Host '  FGI "cd work && py start.py"'
            Write-Host ''
            Write-Host 'Quote commands containing &, &&, ||, |, > or <.'
            exit 0
          }

          if ($cmd -eq 'refresh') {
            [void](Refresh-FgiWorkers)
            exit 0
          }

          if ($cmd -eq 'list') {
            $w = @(Get-FgiWorkers)

            if ($w.Count -eq 0) {
              Write-Host 'No workers known. Running discovery...           exit 0
            }

            foreach ($ip in $w) {
              try {
                $r = Invoke-WebRequest -Uri ("http://{0}:8442/ping" -f $ip) -Headers @{ 'X-FGI-Token' = $token } -TimeoutSec 8 -UseBasicParsing

                Write-Host ("[{0}] ONLINE {1}" -f $ip, $r.Content) -ForegroundColor Green
              } catch {
                Write-Host ("[{0}] OFFLINE {1}" -f $ip, $_.Exception.Message) -ForegroundColor Red
              }
            }

            exit 0
          }

          $w = @(Get-FgiWorkers)

          if ($w.Count -eq 0) {
            $w = @(Refresh-FgiWorkers)
          }

          if ($w.Count -eq 0) {
            Write-Host 'No workers available.' -ForegroundColor Red
            exit 1
          }

          $fail = 0
          $i = 0

          foreach ($ip in $w) {
            $i++

            Write-Host ("=== [{0}/{1}] {2} ===" -f $i, $w.Count, $ip) -ForegroundColor Cyan

            try {
              $r = Invoke-WebRequest -Uri ("http://{0}:8442/exec" -f $ip) -Method Post -Body $cmd -ContentType 'text/plain; charset=utf-8' -Headers @{ 'X-FGI-Token' = $token } -TimeoutSec 150 -UseBasicParsing

              Write-Host $r.Content

              if ($r.Content -match 'FGI_EXIT=(\d+)') {
                if ([int]$Matches[1] -ne 0) {
                  $fail++
                }
              }
            } catch {
              Write-Host ('OFFLINE/ERROR: ' + $_.Exception.Message) -ForegroundColor Red
              $fail++
            }
          }

          if ($fail -eq 0) {
            Write-Host ('--- done: ' + $w.Count + ' ok ---') -ForegroundColor Green
            exit 0
          }

          Write-Host ('--- done: ' + ($w.Count - $fail) + ' ok, ' + $fail + ' failed ---') -ForegroundColor Yellow
          exit 1
          '@ | Set-Content -Path 'C:\FGI\fgi.ps1' -Encoding ascii

          Set-Content -Path 'C:\FGI\token.txt' -Value $env:FGI_TOKEN -Encoding ascii
          Set-Content -Path 'C:\FGI\workers.txt' -Value '' -Encoding ascii

          $machinePath = [Environment]::GetEnvironmentVariable('Path','Machine')
          if ($machinePath -notlike '*C:\FGI*') {
            [Environment]::SetEnvironmentVariable('Path', $machinePath + ';C:\FGI', 'Machine')
          }

          New-Item -ItemType Directory -Path 'C:\Users\CynetAdmin\Desktop' -Force | Out-Null
          Copy-Item 'C:\FGI\fgi.cmd' 'C:\Users\CynetAdmin\Desktop\FGI.cmd' -Force -ErrorAction SilentlyContinue

          Write-Host 'FGI client installed.' -ForegroundColor Green

      - name: Cockpit 5 - wait for workers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $tsExe = 'C:\Program Files\Tailscale\tailscale.exe'
          $expected = [int]$env:WORKERS_EXPECTED

          Write-Host "Waiting for $expected worker(s)..."

          # Phase 1: wait until the expected number of mainy-w* peers
          # shows up on the tailnet.
          for ($attempt = 1; $attempt -le 200; $attempt++) {
            try {
              $obj = & $tsExe status --json 2>$null | ConvertFrom-Json
              $count = 0

              if ($obj.Peer) {
                foreach ($property in $obj.Peer.PSObject.Properties) {
                  $peer = $property.Value

                  $name = ''
                  if ($peer.HostName) {
                    $name = [string]$peer.HostName
                  } elseif ($peer.DNSName) {
                    $name = [string]$peer.DNSName
                  }

                  if ($name -match '^mainy-w\d+(\.|$)') {
                    $ip = @($peer.TailscaleIPs) |
                      Where-Object { $_ -match '^100\.' } |
                      Select-Object -First 1

                    if ($ip) {
                      $count++
                    }
                  }
                }
              }

              Write-Host "[$attempt/200] discovered workers: $count / $expected"

              if ($expected -eq 0 -or $count -ge $expected) {
                break
              }
            } catch {
              Write-Host ('Discovery error: ' + $_.Exception.Message) -ForegroundColor Yellow
            }

            Start-Sleep -Seconds 3
          }

          # Phase 2: confirm the worker agents actually answer /ping.
          # Guards against stale mainy-w* devices from older runs.
          if ($expected -gt 0) {
            Write-Host 'Confirming worker agents answer /ping...'

            for ($p = 1; $p -le 60; $p++) {
              $ips = @()

              try {
                $obj = & $tsExe status --json 2>$null | ConvertFrom-Json

                if ($obj.Peer) {
                  foreach ($property in $obj.Peer.PSObject.Properties) {
                    $peer = $property.Value

                    $name = ''
                    if ($peer.HostName) {
                      $name = [string]$peer.HostName
                    } elseif ($peer.DNSName) {
                      $name = [string]$peer.DNSName
                    }

                    if ($name -match '^mainy-w\d+(\.|$)') {
                      $ip = @($peer.TailscaleIPs) |
                        Where-Object { $_ -match '^100\.' } |
                        Select-Object -First 1

                      if ($ip) {
                        $ips += $ip
                      }
                    }
                  }
                }
              } catch {}

              $ips = @($ips | Select-Object -Unique)
              $alive = 0

              foreach ($ip in $ips) {
                try {
                  $null = Invoke-WebRequest -Uri ("http://{0}:8442/ping" -f $ip) -Headers @{ 'X-FGI-Token' = $env:FGI_TOKEN } -TimeoutSec 4 -UseBasicParsing
                  $alive++
                } catch {}
              }

              Write-Host ("[confirm {0}/60] agents alive: {1} / {2}" -f $p, $alive, $expected)

              if ($alive -ge $expected) {
                break
              }

              Start-Sleep -Seconds 5
            }

            if ($alive -lt $expected) {
              Write-Host ("Only $alive of $expected worker agent(s) answered. Continuing anyway - FGI refresh/status will show live state.") -ForegroundColor Yellow
            }
          }

          Write-Host 'Worker discovery wait finished.' -ForegroundColor Green

      - name: Cockpit 6 - publish connection info
        shell: pwsh
        run: |
          $tsExe = 'C:\Program Files\Tailscale\tailscale.exe'
          $ip = ([string](& $tsExe ip -4 2>$null | Select-Object -First 1)).Trim()

          if ($ip -notmatch '^100\.') {
            throw 'Could not resolve cockpit Tailscale IP.'
          }

          $user = 'CynetAdmin'
          $pwLine = ''
          $pwSummary = ''

          if ($env:RDP_PW_GENERATED -eq '1') {
            $pwLine = "# PASSWORD:    $($env:RDP_PW)   (auto-generated - RDP_PASSWORD secret was not set)"
            $pwSummary = "| **PASSWORD** | ``$($env:RDP_PW)`` *(auto-generated)* |"
          }

          Write-Host '################################################' -ForegroundColor Magenta
          Write-Host "# RDP ADDRESS: $ip" -ForegroundColor Magenta
          Write-Host "# COMMAND:     mstsc /v:$ip" -ForegroundColor Magenta
          Write-Host "# USER:        $user" -ForegroundColor Magenta
          if ($pwLine) { Write-Host $pwLine -ForegroundColor Magenta }
          Write-Host '################################################' -ForegroundColor Magenta

          $lines = @(
            '### FGI Fleet online',
            '',
            "| **RDP ADDRESS** | ``$ip`` |",
            "| **Connect** | ``mstsc /v:$ip`` |",
            "| **User** | ``$user`` |"
          )

          if ($pwSummary) { $lines += $pwSummary }

          $lines += @(
            '| **FGI** | ``C:\FGI\fgi.cmd`` |',
            '',
            'Test:',
            '',
            '```cmd',
            'FGI refresh',
            'FGI status',
            'FGI "cd work && py start.py"',
            '```'
          )

          ($lines -join "`n") | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Cockpit 7 - keep session alive
        shell: pwsh
        env:
          KEEPALIVE_MIN: ${{ inputs.keepalive_minutes }}
        run: |
          $total = 340

          try { $total = [int]$env:KEEPALIVE_MIN } catch {}

          if ($total -le 0) { $total = 340 }
          if ($total -gt 340) { $total = 340 }

          Write-Host "Cockpit online for $total minutes." -ForegroundColor Green

          for ($i = 1; $i -le $total; $i++) {
            Start-Sleep -Seconds 60

            if (($i % 5) -eq 0) {
              Write-Host "[$i/$total min] cockpit running" -ForegroundColor Green
            }

            # Re-run discovery every 10 minutes so late-joining or
            # restarted workers are picked up automatically.
            if (($i % 10) -eq 0) {
              try { $null = & 'C:\FGI\fgi.cmd' refresh } catch {}
            }
          }

  # ================================================================
  # WORKERS
  # ================================================================
  workers:
    if: ${{ needs.setup.outputs.count != '0' }}
    needs: setup
    runs-on: windows-2025
    timeout-minutes: 355

    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        shard: ${{ fromJson(needs.setup.outputs.matrix) }}

    env:
      SHARD_INDEX: ${{ matrix.shard }}
      FGI_TOKEN_SECRET: ${{ secrets.FGI_TOKEN }}

    steps:

      - name: Preflight - check Tailscale auth key
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
            throw 'ROOT-CAUSE: TAILSCALE_AUTHKEY repository secret is not set. Create a reusable/ephemeral auth key at https://login.tailscale.com/admin/settings/keys and add it as a repo secret.'
          }

          Write-Host 'Tailscale auth key present.'

      - name: Worker - resolve fleet token
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $t = [string]$env:FGI_TOKEN_SECRET
          $src = 'repository secret FGI_TOKEN'

          if ([string]::IsNullOrWhiteSpace($t) -or $t -eq 'CHANGE_ME_TO_RANDOM_TOKEN') {
            # No usable secret -> derive the same per-run token that the
            # cockpit derives, locally. No cross-job handoff involved.
            if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
              throw 'ROOT-CAUSE: no FGI_TOKEN secret and TAILSCALE_AUTHKEY is empty - cannot derive a fleet token. Set the TAILSCALE_AUTHKEY repo secret (or your own FGI_TOKEN).'
            }

            $salt = "fgi-v1|$($env:TAILSCALE_AUTHKEY)|$($env:GITHUB_RUN_ID)|$($env:GITHUB_RUN_ATTEMPT)"

            $sha = [System.Security.Cryptography.SHA256]::Create()
            try {
              $h = $sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($salt))
            } finally {
              $sha.Dispose()
            }

            $t = ([System.BitConverter]::ToString($h)) -replace '-', ''
            $src = 'derived per-run from TAILSCALE_AUTHKEY (set an FGI_TOKEN secret to pin your own)'
          }

          Write-Output "::add-mask::$t"

          Add-Content -Path $env:GITHUB_ENV -Value "FGI_TOKEN=$t"

          Write-Host "Fleet token resolved. Source: $src" -ForegroundColor Green

      - name: Worker - connect Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          use-cache: 'true'

      - name: Worker - configure hostname
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $tsExe = 'C:\Program Files\Tailscale\tailscale.exe'

          if (-not (Test-Path $tsExe)) {
            throw "Tailscale executable not found: $tsExe"
          }

          $ip = $null

          for ($i = 0; $i -lt 240; $i++) {
            $cand = ([string](& $tsExe ip -4 2>$null | Select-Object -First 1)).Trim()

            if ($cand -match '^100\.') {
              $ip = $cand
              break
            }

            Start-Sleep -Seconds 1
          }

          if (-not $ip) {
            throw 'ROOT-CAUSE: worker did not get a Tailscale IPv4 address.'
          }

          $hostname = "mainy-w$env:SHARD_INDEX"

          & $tsExe set "--hostname=$hostname" 2>$null

          Write-Host "Worker $env:SHARD_INDEX -> $hostname -> $ip" -ForegroundColor Green

      - name: Worker - install FGI agent
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          New-Item -ItemType Directory -Path 'C:\FGI' -Force | Out-Null

          $rule = @{
            DisplayName   = 'FGI Agent 8442'
            Direction     = 'Inbound'
            Protocol      = 'TCP'
            LocalPort     = 8442
            RemoteAddress = '100.64.0.0/10'
            Action        = 'Allow'
            Profile       = 'Any'
          }

          Remove-NetFirewallRule -DisplayName 'FGI Agent 8442' -ErrorAction SilentlyContinue
          New-NetFirewallRule @rule | Out-Null

          netsh http add urlacl url=http://+:8442/ sddl='D:(A;;GX;;;WD)' 2>$null | Out-Null

          @'
          param(
            [string]$Token = '',
            [int]$Port = 8442
          )

          $ErrorActionPreference = 'Continue'

          $listener = New-Object System.Net.HttpListener
          $listener.Prefixes.Add(("http://+:{0}/" -f $Port))

          try {
            $listener.Start()
          } catch {
            netsh http add urlacl url=("http://+:{0}/" -f $Port) sddl='D:(A;;GX;;;WD)' 2>$null | Out-Null
            Start-Sleep -Seconds 1

            $listener = New-Object System.Net.HttpListener
            $listener.Prefixes.Add(("http://+:{0}/" -f $Port))
            $listener.Start()
          }

          Write-Host ("FGI agent listening on port {0}" -f $Port)

          # One persistent cmd.exe for the lifetime of the worker.
          $script:proc = $null
          $script:outQ = New-Object System.Collections.Concurrent.ConcurrentQueue[string]
          $script:errQ = New-Object System.Collections.Concurrent.ConcurrentQueue[string]

          $readerScript = {
            param($proc, $queue, $which)

            $reader = if ($which -eq 'out') {
              $proc.StandardOutput
            } else {
              $proc.StandardError
            }

            try {
              while ($null -ne ($line = $reader.ReadLine())) {
                $queue.Enqueue($line)
              }
            } catch {}
          }

          function Start-FgiShell {
            if ($script:proc -and (-not $script:proc.HasExited)) { return }

            $script:outQ = New-Object System.Collections.Concurrent.ConcurrentQueue[string]
            $script:errQ = New-Object System.Collections.Concurrent.ConcurrentQueue[string]

            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = $env:ComSpec
            $psi.Arguments = '/q'
            $psi.UseShellExecute = $false
            $psi.CreateNoWindow = $true
            $psi.RedirectStandardInput = $true
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $psi.WorkingDirectory = $env:USERPROFILE

            $script:proc = [System.Diagnostics.Process]::Start($psi)

            [void]$script:proc.StandardInput.WriteLine('@echo off')

            foreach ($which in @('out','err')) {
              $rs = [runspacefactory]::CreateRunspace()
              $rs.Open()

              $ps = [powershell]::Create()
              $ps.Runspace = $rs

              $target = $script:outQ
              if ($which -eq 'err') {
                $target = $script:errQ
              }

              [void]$ps.AddScript($readerScript).AddArgument($script:proc).AddArgument($target).AddArgument($which)
              [void]$ps.BeginInvoke()
            }

            Write-Host 'FGI shell (cmd.exe) started.'
          }

          Start-FgiShell

          function Invoke-FgiCommand([string]$userCmd) {
            Start-FgiShell

            $id = [guid]::NewGuid().ToString('N')
            $marker = "__FGI_DONE_${id}_"

            $send = {
              [void]$script:proc.StandardInput.WriteLine($userCmd)
              [void]$script:proc.StandardInput.WriteLine("echo $marker%errorlevel%__")
            }

            try {
              & $send
            } catch {
              # Shell died (e.g. someone ran "exit") -> respawn and retry once.
              $script:proc = $null
              Start-FgiShell
              & $send
            }

            $deadline = [DateTime]::UtcNow.AddSeconds(145)
            $lines = New-Object System.Collections.Generic.List[string]
            $code = 'timeout'
            $done = $false

            while ((-not $done) -and ([DateTime]::UtcNow -lt $deadline)) {
              $m = $null

              while ($script:outQ.TryDequeue([ref]$m)) {
                if ($m.Contains($marker)) {
                  if ($m -match "${id}_([0-9]+)__\s*$") {
                    $code = $Matches[1]
                  }

                  $done = $true
                  break
                }

                if ($m -match '__FGI_DONE_[0-9a-f]{32}_\d+__') {
                  # Stale marker from an earlier command that timed out.
                  continue
                }

                [void]$lines.Add($m)
              }

              if ($done) {
                break
              }

              $e = $null

              while ($script:errQ.TryDequeue([ref]$e)) {
                [void]$lines.Add('[stderr] ' + $e)
              }

              Start-Sleep -Milliseconds 50
            }

            $body = $lines -join [Environment]::NewLine

            if ($body.Length -gt 60000) {
              $body = '... (truncated) ...' + $body.Substring($body.Length - 60000)
            }

            return (
              '=== output ===' +
              [Environment]::NewLine +
              $body +
              [Environment]::NewLine +
              "=== FGI_EXIT=$code ==="
            )
          }

          while ($listener.IsListening) {
            $ctx = $listener.GetContext()
            $res = $ctx.Response

            try {
              $req = $ctx.Request
              $tok = $req.Headers['X-FGI-Token']

              if ($Token -and ($tok -ne $Token)) {
                $res.StatusCode = 401
                $res.StatusDescription = 'bad token'
              }
              elseif ($req.HttpMethod -eq 'GET' -and $req.Url.AbsolutePath -eq '/ping') {
                $res.StatusCode = 200

                $body = 'host=' + $env:COMPUTERNAME + ' agent=ok port=' + $Port
                $bytes = [Text.Encoding]::UTF8.GetBytes($body)

                $res.ContentLength64 = $bytes.Length
                $res.OutputStream.Write($bytes, 0, $bytes.Length)
              }
              elseif ($req.HttpMethod -eq 'POST' -and $req.Url.AbsolutePath -eq '/exec') {
                $reader = New-Object IO.StreamReader(
                  $req.InputStream,
                  [Text.Encoding]::UTF8
                )

                $userCmd = $reader.ReadToEnd()
                $out = Invoke-FgiCommand $userCmd
                $bytes = [Text.Encoding]::UTF8.GetBytes($out)

                $res.StatusCode = 200
                $res.ContentLength64 = $bytes.Length
                $res.OutputStream.Write($bytes, 0, $bytes.Length)
              }
              else {
                $res.StatusCode = 404
                $res.StatusDescription = 'not found'
              }
            }
            catch {
              try {
                $res.StatusCode = 500
                $msg = [Text.Encoding]::UTF8.GetBytes(
                  'agent error: ' + $_.Exception.Message
                )
                $res.ContentLength64 = $msg.Length
                $res.OutputStream.Write($msg, 0, $msg.Length)
              } catch {}
            }
            finally {
              try { $res.Close() } catch {}
            }
          }
          '@ | Set-Content -Path 'C:\FGI\agent.ps1' -Encoding ascii

          @'
          param([string]$Token)

          $ErrorActionPreference = 'Continue'

          $old = Get-CimInstance Win32_Process -Filter "Name='powershell.exe'" |
            Where-Object {
              ($_.CommandLine -match 'FGI\\agent\.ps1') -and ($_.ProcessId -ne $PID)
            }

          foreach ($o in $old) {
            try { Stop-Process -Id $o.ProcessId -Force -ErrorAction SilentlyContinue } catch {}
          }

          Start-Sleep -Milliseconds 300

          Start-Process -FilePath 'powershell.exe' -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File','C:\FGI\agent.ps1','-Token',$Token) -WindowStyle Hidden -RedirectStandardOutput 'C:\FGI\agent.log' -RedirectStandardError 'C:\FGI\agent.err.log'
          '@ | Set-Content -Path 'C:\FGI\start-agent.ps1' -Encoding ascii

          if ([string]::IsNullOrWhiteSpace($env:FGI_TOKEN)) {
            throw 'ROOT-CAUSE: fleet token missing on worker (token resolve step failed).'
          }

          & 'C:\FGI\start-agent.ps1' -Token $env:FGI_TOKEN

          $ok = $false

          for ($i = 0; $i -lt 30; $i++) {
            try {
              $r = Invoke-WebRequest -Uri 'http://127.0.0.1:8442/ping' -Headers @{ 'X-FGI-Token' = $env:FGI_TOKEN } -TimeoutSec 3 -UseBasicParsing

              if ($r.StatusCode -eq 200) {
                $ok = $true
                break
              }
            } catch {
              Start-Sleep -Seconds 2
            }
          }

          if (-not $ok) {
            Write-Host '--- agent.log ---'
            Get-Content 'C:\FGI\agent.log' -ErrorAction SilentlyContinue

            Write-Host '--- agent.err.log ---'
            Get-Content 'C:\FGI\agent.err.log' -ErrorAction SilentlyContinue

            throw 'ROOT-CAUSE: FGI agent did not come up on port 8442.'
          }

          Write-Host 'FGI agent online.' -ForegroundColor Green

      - name: Worker - optional boot command
        if: ${{ inputs.boot_command != '' }}
        shell: pwsh
        env:
          BOOT_CMD: ${{ inputs.boot_command }}
        run: |
          $cmd = [string]$env:BOOT_CMD

          try {
            $r = Invoke-WebRequest -Uri 'http://127.0.0.1:8442/exec' -Method Post -Body $cmd -ContentType 'text/plain; charset=utf-8' -Headers @{ 'X-FGI-Token' = $env:FGI_TOKEN } -TimeoutSec 150 -UseBasicParsing

            Write-Host $r.Content
          } catch {
            Write-Host ("boot command failed: " + $_.Exception.Message) -ForegroundColor Yellow
          }

      - name: Worker - stay alive
        shell: pwsh
        env:
          KEEPALIVE_MIN: ${{ inputs.keepalive_minutes }}
        run: |
          $total = 340

          try { $total = [int]$env:KEEPALIVE_MIN } catch {}

          if ($total -le 0) { $total = 340 }
          if ($total -gt 340) { $total = 340 }

          Write-Host "Worker $env:SHARD_INDEX online for $total minutes." -ForegroundColor Green

          for ($i = 1; $i -le $total; $i++) {
            Start-Sleep -Seconds 60

            if (($i % 5) -eq 0) {
              Write-Host "[$i/$total min] worker $env:SHARD_INDEX alive" -ForegroundColor Green

              # Watchdog: if the local agent died, restart it.
              $alive = $false
              try {
                $r = Invoke-WebRequest -Uri 'http://127.0.0.1:8442/ping' -Headers @{ 'X-FGI-Token' = $env:FGI_TOKEN } -TimeoutSec 5 -UseBasicParsing
                $alive = ($r.StatusCode -eq 200)
              } catch {}

              if (-not $alive) {
                Write-Host 'FGI agent down -> restarting.' -ForegroundColor Yellow
                try { & 'C:\FGI\start-agent.ps1' -Token $env:FGI_TOKEN } catch {}
                Start-Sleep -Seconds 5
              }
            }
          }
