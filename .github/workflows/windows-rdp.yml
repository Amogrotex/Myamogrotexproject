name: Windows Cloud RDP (localtonet)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      # ------------------------------------------------------------------
      # 1) روشن کردن Remote Desktop و باز کردن فایروال
      # ------------------------------------------------------------------
      - name: 1. Enable Remote Desktop & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

      # ------------------------------------------------------------------
      # 2) ساخت کاربر ادمین
      # ------------------------------------------------------------------
      - name: 2. Create Admin Account
        run: |
          $Password = ConvertTo-SecureString "Cynet@2026" -AsPlainText -Force
          New-LocalUser -Name "CynetAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "CynetAdmin" -ErrorAction SilentlyContinue

      # ------------------------------------------------------------------
      # 3) نصب localtonet + اتصال به تونل TCP از پیش ساخته‌شده
      #    (تونل باید از قبل توی داشبورد ساخته شده باشه: TCP -> 127.0.0.1:3389)
      # ------------------------------------------------------------------
      - name: 3. Install localtonet & connect
        env:
          LOCALTONET_AUTHTOKEN: ${{ secrets.LOCALTONET_AUTHTOKEN }}
        run: |
          # دانلود و استخراج باینری ویندوز ۶۴ بیتی
          Invoke-WebRequest "https://localtonet.com/download/localtonet-win-64.zip" -OutFile "C:\localtonet.zip"
          Expand-Archive "C:\localtonet.zip" -DestinationPath "C:\localtonet" -Force

          # احراز هویت کلاینت با AuthToken (که در Secret ذخیره شده)
          & "C:\localtonet\localtonet.exe" --authtoken "$Env:LOCALTONET_AUTHTOKEN"

          # اجرای کلاینت در پس‌زمینه تا به تونلِ از پیش ساخته‌شده وصل بشه
          $log = "C:\localtonet\tunnel.log"
          Start-Process -FilePath "C:\localtonet\localtonet.exe" `
            -RedirectStandardOutput $log -RedirectStandardError $log -NoNewWindow

          Start-Sleep -Seconds 15

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "  >>> RDP SERVER IS READY <<<" -ForegroundColor Cyan
          Write-Host "  Username : CynetAdmin" -ForegroundColor Yellow
          Write-Host "  Password : Cynet@2026" -ForegroundColor Yellow
          Write-Host "  >>> Open your localtonet DASHBOARD to get the" -ForegroundColor Magenta
          Write-Host "      public address (e.g. us1.localtonet.com:23XXX)." -ForegroundColor Magenta
          Write-Host "      Then run:  mstsc  ->  that address" -ForegroundColor Magenta
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host ""
          Write-Host "--- localtonet client log ---"
          Get-Content $log -ErrorAction SilentlyContinue

      # ------------------------------------------------------------------
      # 4) زنده نگه‌داشتن سرور
      #    (توجه: پلن رایگان localtonet بعد از ۳۰ دقیقه تونل رو قطع می‌کنه)
      # ------------------------------------------------------------------
      - name: 4. Keep Server Alive
        run: |
          for ($i = 1; $i -le 999; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "[$i] Server running..."
          }
