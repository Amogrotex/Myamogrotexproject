- name: 3. Diagnose Ngrok startup
  shell: pwsh
  env:
    NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
  run: |
    $ErrorActionPreference = "Stop"

    if ([string]::IsNullOrWhiteSpace($Env:NGROK_AUTHTOKEN)) {
      throw "NGROK_AUTHTOKEN GitHub secret is missing"
    }

    Write-Output "::add-mask::$Env:NGROK_AUTHTOKEN"

    $ngrokDir = "C:\ngrok"
    $ngrokExe = "$ngrokDir\ngrok.exe"
    $ngrokLog = "$ngrokDir\ngrok.log"
    $stdoutLog = "$ngrokDir\stdout.log"
    $stderrLog = "$ngrokDir\stderr.log"

    New-Item -ItemType Directory -Path $ngrokDir -Force | Out-Null

    Invoke-WebRequest `
      "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" `
      -OutFile "C:\ngrok.zip"

    Expand-Archive "C:\ngrok.zip" -DestinationPath $ngrokDir -Force

    & $ngrokExe config add-authtoken $Env:NGROK_AUTHTOKEN
    if ($LASTEXITCODE -ne 0) {
      throw "Could not configure ngrok authtoken"
    }

    $ngrokArgs = @(
      "tcp",
      "3389",
      "--log=$ngrokLog",
      "--log-format=json"
    )

    $process = Start-Process `
      -FilePath $ngrokExe `
      -ArgumentList $ngrokArgs `
      -PassThru `
      -WindowStyle Hidden `
      -RedirectStandardOutput $stdoutLog `
      -RedirectStandardError $stderrLog

    for ($attempt = 1; $attempt -le 30; $attempt++) {
      Start-Sleep -Seconds 2
      $process.Refresh()

      if ($process.HasExited) {
        Write-Host "ngrok exited with code $($process.ExitCode)" -ForegroundColor Red

        foreach ($file in @($ngrokLog, $stdoutLog, $stderrLog)) {
          if (Test-Path $file) {
            Write-Host "=== $file ==="
            Get-Content $file
          }
        }

        throw "ngrok failed during startup"
      }

      try {
        $response = Invoke-RestMethod `
          "http://localhost:4040/api/tunnels" `
          -ErrorAction Stop

        $tunnel = $response.tunnels | Select-Object -First 1

        if ($tunnel) {
          $address = $tunnel.public_url -replace "^tcp://", ""
          Write-Host "Ngrok tunnel started: $address" -ForegroundColor Green
          exit 0
        }
      } catch {
        Write-Host "Waiting for ngrok API ($attempt/30)..."
      }
    }

    if (Test-Path $ngrokLog) {
      Get-Content $ngrokLog
    }

    Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
    throw "ngrok remained running but did not create a tunnel"
