name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Enable RDP, Firewall, UDP Transport & Performance Tuning
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Enable-NetFirewallRule -Name "RemoteDesktop-UserMode-In-UDP" -ErrorAction SilentlyContinue
          Enable-NetFirewallRule -Name "RemoteDesktop-UserMode-In-TCP" -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

          $tsPol = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          New-Item -Path $tsPol -Force | Out-Null
          Set-ItemProperty -Path $tsPol -Name "SelectTransport" -Value 1 -Type DWord -Force
          Set-ItemProperty -Path $tsPol -Name "ColorDepth" -Value 24 -Type DWord -Force
          Set-ItemProperty -Path $tsPol -Name "fCompressionEnabled" -Value 1 -Type DWord -Force

          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c 2>$null

          Write-Host ">>> RDP enabled (UDP transport) + High Performance power plan." -ForegroundColor Green

      - name: 2. Create Admin Account
        run: |
          $Password = ConvertTo-SecureString "Cynet@2026" -AsPlainText -Force
          New-LocalUser -Name "CynetAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "CynetAdmin" -ErrorAction SilentlyContinue
          net user runneradmin Cynet@2026

      - name: 3. Install bore
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $boreDir = "C:\bore"
          New-Item -ItemType Directory -Path $boreDir -Force | Out-Null
          $boreExe = "$boreDir\bore.exe"

          if (-not (Test-Path $boreExe)) {
            Write-Host ">>> Downloading bore..." -ForegroundColor Cyan
            $release = Invoke-RestMethod "https://api.github.com/repos/ekzhang/bore/releases/latest"
            $asset = $release.assets | Where-Object { $_.name -match "windows-x86_64\.zip" } | Select-Object -First 1
            $zipPath = "$boreDir\bore.zip"
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zipPath
            Expand-Archive -Path $zipPath -DestinationPath $boreDir -Force
            Remove-Item $zipPath -Force
          }

          [Environment]::SetEnvironmentVariable("Path", $env:Path + ";$boreDir", "Machine")
          $env:Path += ";$boreDir"
          Write-Host ">>> bore installed: $(& $boreExe --version)" -ForegroundColor Green

      - name: 4. Start bore tunnel for RDP (port 3389)
        run: |
          $boreDir = "C:\bore"
          $boreExe = "$boreDir\bore.exe"
          $logPath = "C:\bore.log"

          # Start bore in background, redirect output
          $proc = Start-Process -FilePath $boreExe `
                                -ArgumentList "local","3389","--to","bore.pub" `
                                -RedirectStandardOutput $logPath `
                                -RedirectStandardError "$logPath.err" `
                                -WindowStyle Hidden `
                                -PassThru

          Write-Host ">>> bore started (PID: $($proc.Id)). Waiting for tunnel..." -ForegroundColor Cyan

          # Poll the log until we get the port (bore prints "Listening at bore.pub:PORT")
          $publicAddr = $null
          for ($i = 1; $i -le 30; $i++) {
            Start-Sleep -Seconds 2
            if (Test-Path $logPath) {
              $content = Get-Content $logPath -Raw -ErrorAction SilentlyContinue
              if ($content -match "Listening at bore\.pub:(\d+)") {
                $port = $Matches[1]
                $publicAddr = "bore.pub:${port}"
                break
              }
            }
          }

          if (-not $publicAddr) {
            Write-Host ">>> bore did not start. Logs:" -ForegroundColor Red
            if (Test-Path $logPath)     { Get-Content $logPath }
            if (Test-Path "$logPath.err") { Get-Content "$logPath.err" }
            throw "bore tunnel failed to start."
          }

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "  >>> RDP SERVER IS READY! <<<" -ForegroundColor Cyan
          Write-Host "  Public Address: $publicAddr" -ForegroundColor Yellow
          Write-Host "  Username      : CynetAdmin" -ForegroundColor Yellow
          Write-Host "  Password      : Cynet@2026" -ForegroundColor Yellow
          Write-Host "  >> Open mstsc and connect to: $publicAddr" -ForegroundColor Magenta
          Write-Host "==================================================" -ForegroundColor Green

          # Persist the address to a file so the next step can read it
          $publicAddr | Out-File -FilePath "C:\rdp_address.txt" -Encoding ASCII -NoNewline

      - name: 5. Keep Server Alive (6 Hours)
        run: |
          $addr = Get-Content "C:\rdp_address.txt" -Raw
          Write-Host ""
          Write-Host "RDP Address: $addr" -ForegroundColor Cyan
          Write-Host "Username   : CynetAdmin" -ForegroundColor Cyan
          Write-Host "Password   : Cynet@2026" -ForegroundColor Cyan

          for ($i = 1; $i -le 360; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "[$i/360] Server running... ($addr)"
          }
