# =====================================================================
# Windows Cloud RDP (Tailscale + Python + Java)
# =====================================================================
name: Windows Cloud RDP

on:
  workflow_dispatch:

env:
  KEEPALIVE_MINUTES: 340

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 355

    steps:

      # ---------------------------------------------------------------
      # 1. Enable RDP correctly
      # ---------------------------------------------------------------
      - name: 1. Enable RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ">>> Enabling Remote Desktop..." -ForegroundColor Cyan

          # Enable RDP
          Set-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0

          # Allow RDP through Windows Firewall
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue

          # Explicit TCP 3389 rule
          if (-not (Get-NetFirewallRule -DisplayName "Tailscale RDP 3389" -ErrorAction SilentlyContinue)) {
            New-NetFirewallRule `
              -DisplayName "Tailscale RDP 3389" `
              -Direction Inbound `
              -Protocol TCP `
              -LocalPort 3389 `
              -Action Allow `
              -Profile Any
          }

          # Explicit UDP 3389 rule
          if (-not (Get-NetFirewallRule -DisplayName "Tailscale RDP UDP 3389" -ErrorAction SilentlyContinue)) {
            New-NetFirewallRule `
              -DisplayName "Tailscale RDP UDP 3389" `
              -Direction Inbound `
              -Protocol UDP `
              -LocalPort 3389 `
              -Action Allow `
              -Profile Any
          }

          # Keep NLA disabled as in your original workflow
          $rdpPath = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'

          Set-ItemProperty `
            -Path $rdpPath `
            -Name 'UserAuthentication' `
            -Value 0

          Set-ItemProperty `
            -Path $rdpPath `
            -Name 'fInheritMaxIdleTime' `
            -Value 1

          # Make sure the RDP service is running
          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService -ErrorAction SilentlyContinue

          # Restart service so registry changes are applied
          Restart-Service -Name TermService -Force
          Start-Sleep -Seconds 3

          Write-Host ">>> RDP service status:" -ForegroundColor Green
          Get-Service TermService | Format-Table Name, Status, StartType

          Write-Host ">>> RDP listeners:" -ForegroundColor Green
          Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue

      # ---------------------------------------------------------------
      # 2. Create RDP user
      # ---------------------------------------------------------------
      - name: 2. Create Admin Account
        shell: powershell
        run: |
          $Password = ConvertTo-SecureString "Cynet@2026" -AsPlainText -Force

          Write-Host ">>> Creating / updating CynetAdmin..." -ForegroundColor Cyan

          $user = Get-LocalUser -Name "CynetAdmin" -ErrorAction SilentlyContinue

          if (-not $user) {
            New-LocalUser `
              -Name "CynetAdmin" `
              -Password $Password `
              -PasswordNeverExpires `
              -AccountNeverExpires
          }
          else {
            Set-LocalUser `
              -Name "CynetAdmin" `
              -Password $Password
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "CynetAdmin" `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "CynetAdmin" `
            -ErrorAction SilentlyContinue

          # GitHub runner account
          net user runneradmin "Cynet@2026"
          net user runneradmin /active:yes

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "runneradmin" `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "runneradmin" `
            -ErrorAction SilentlyContinue

          Write-Host ">>> Users configured." -ForegroundColor Green

      # ---------------------------------------------------------------
      # 3. Install Tailscale
      # ---------------------------------------------------------------
      - name: 3. Install & Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          Write-Host ">>> Downloading Tailscale..." -ForegroundColor Cyan

          if (-not (Test-Path "C:\tailscale.msi")) {
            curl.exe `
              -L `
              --retry 5 `
              --retry-delay 2 `
              -o "C:\tailscale.msi" `
              "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          }

          Write-Host ">>> Installing Tailscale..." -ForegroundColor Cyan

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i C:\tailscale.msi /quiet /norestart" `
            -Wait

          $ts = "C:\Program Files\Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {
            throw "Tailscale executable was not installed."
          }

          # Make Tailscale run independently of interactive login
          Write-Host ">>> Enabling unattended mode..." -ForegroundColor Cyan

          & $ts up `
            --authkey="$env:TAILSCALE_AUTHKEY" `
            --hostname="github-rdp-server" `
            --reset `
            --ssh=false `
            --accept-dns=false `
            --unattended=true

          if ($LASTEXITCODE -ne 0) {
            throw "tailscale up failed with exit code $LASTEXITCODE"
          }

          Start-Sleep -Seconds 5

          # Get IPv4
          $ts_ip = $null

          for ($i = 1; $i -le 30; $i++) {
            $raw = (& $ts ip -4 2>$null | Select-Object -First 1)

            if ($raw) {
              $ts_ip = ([string]$raw).Trim()

              if ($ts_ip -match '^100\.') {
                break
              }
            }

            Start-Sleep -Seconds 1
          }

          if (-not $ts_ip) {
            throw "Could not obtain Tailscale IPv4 address."
          }

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "       WINDOWS RDP SERVER READY" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host "RDP Port     : 3389" -ForegroundColor Yellow
          Write-Host "Username     : runneradmin" -ForegroundColor Yellow
          Write-Host "Alt Username : CynetAdmin" -ForegroundColor Yellow
          Write-Host "Password     : Cynet@2026" -ForegroundColor Yellow
          Write-Host ""
          Write-Host "Connect using:" -ForegroundColor Magenta
          Write-Host "mstsc /v:$ts_ip" -ForegroundColor Magenta
          Write-Host "==================================================" -ForegroundColor Green

          # Show Tailscale status
          Write-Host ""
          Write-Host ">>> Tailscale status:" -ForegroundColor Cyan
          & $ts status

      # ---------------------------------------------------------------
      # 4. Verify RDP locally
      # ---------------------------------------------------------------
      - name: 4. Verify RDP
        shell: powershell
        run: |
          Write-Host ">>> Checking TermService..." -ForegroundColor Cyan
          $svc = Get-Service TermService
          $svc | Format-List Name, Status, StartType

          if ($svc.Status -ne "Running") {
            throw "Remote Desktop service is not running."
          }

          Write-Host ">>> Checking TCP 3389..." -ForegroundColor Cyan

          $listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $listener) {
            throw "Nothing is listening on TCP 3389."
          }

          $listener | Format-Table LocalAddress, LocalPort, State, OwningProcess

          Write-Host ">>> Testing local RDP port..." -ForegroundColor Cyan

          $test = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $test.TcpTestSucceeded) {
            throw "TCP 3389 local test failed."
          }

          Write-Host ">>> TCP 3389 is OPEN." -ForegroundColor Green

          Write-Host ""
          Write-Host ">>> Network adapters:" -ForegroundColor Cyan
          Get-NetAdapter |
            Where-Object {$_.Status -eq "Up"} |
            Format-Table Name, InterfaceDescription, Status, LinkSpeed

      # ---------------------------------------------------------------
      # 5. Install Python + Java
      # ---------------------------------------------------------------
      - name: 5. Install Python & Java
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'

          Write-Host ">>> Installing Python 3.12..." -ForegroundColor Cyan

          Invoke-WebRequest `
            "https://www.python.org/ftp/python/3.12.3/python-3.12.3-amd64.exe" `
            -OutFile "C:\python-installer.exe"

          Start-Process `
            "C:\python-installer.exe" `
            -ArgumentList "/quiet InstallAllUsers=1 PrependPath=1 Include_pip=1" `
            -Wait

          Remove-Item "C:\python-installer.exe" -Force -ErrorAction SilentlyContinue

          Write-Host ">>> Installing Temurin Java 21..." -ForegroundColor Cyan

          Invoke-WebRequest `
            "https://api.adoptium.net/v3/binary/latest/21/ga/windows/x64/jdk/hotspot/normal/eclipse" `
            -OutFile "C:\jdk.msi"

          Start-Process `
            msiexec.exe `
            -ArgumentList '/i C:\jdk.msi /quiet ADDLOCAL=FeatureMain,FeatureEnvironment,FeatureJarFileRunWith,FeatureJavaHome /norestart' `
            -Wait

          Remove-Item "C:\jdk.msi" -Force -ErrorAction SilentlyContinue

          $env:Path = `
            [Environment]::GetEnvironmentVariable("Path","Machine") + ";" +
            [Environment]::GetEnvironmentVariable("Path","User")

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "TOOLCHAIN" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Green

          python --version
          java -version

      # ---------------------------------------------------------------
      # 6. Keep alive
      # ---------------------------------------------------------------
      - name: 6. Keep Server Alive
        shell: powershell
        run: |
          $total = [int]$env:KEEPALIVE_MINUTES

          for ($i = 1; $i -le $total; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "[$i/$total] Server running..."
          }
