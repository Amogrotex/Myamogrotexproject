# =====================================================================
# Windows Cloud RDP
# Optimized RDP + Tailscale + Python 3.12 + Java 21
# =====================================================================

name: Windows Cloud RDP

on:
  workflow_dispatch:

env:
  KEEPALIVE_MINUTES: 340

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 355

    steps:

      # ===============================================================
      # 1. RDP + PERFORMANCE + PYTHON + JAVA
      # ===============================================================
      - name: 1. Configure Fast RDP and Install Toolchains
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host " WINDOWS RDP PERFORMANCE SETUP" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Cyan

          # -----------------------------------------------------------
          # Enable Remote Desktop
          # -----------------------------------------------------------
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          $rdp = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp"

          # Keep your original NLA setting
          Set-ItemProperty `
            -Path $rdp `
            -Name "UserAuthentication" `
            -Value 0

          # -----------------------------------------------------------
          # RDP transport / performance
          # -----------------------------------------------------------
          $policy = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"

          New-Item `
            -Path $policy `
            -Force | Out-Null

          # 2 = allow UDP or TCP
          # Lets RDP use UDP when available.
          Set-ItemProperty `
            -Path $policy `
            -Name "SelectTransport" `
            -Type DWord `
            -Value 2 `
            -Force

          # Enable RDP compression
          Set-ItemProperty `
            -Path $policy `
            -Name "fCompressionEnabled" `
            -Type DWord `
            -Value 1 `
            -Force

          # Lower graphical bandwidth
          Set-ItemProperty `
            -Path $policy `
            -Name "ColorDepth" `
            -Type DWord `
            -Value 2 `
            -Force

          # -----------------------------------------------------------
          # Disable expensive visual effects
          # -----------------------------------------------------------
          Set-ItemProperty `
            -Path $rdp `
            -Name "fDisableWallpaper" `
            -Value 1 `
            -ErrorAction SilentlyContinue

          Set-ItemProperty `
            -Path $rdp `
            -Name "fDisableFullWindowDrag" `
            -Value 1 `
            -ErrorAction SilentlyContinue

          Set-ItemProperty `
            -Path $rdp `
            -Name "fDisableMenuAnims" `
            -Value 1 `
            -ErrorAction SilentlyContinue

          Set-ItemProperty `
            -Path $rdp `
            -Name "fDisableThemes" `
            -Value 1 `
            -ErrorAction SilentlyContinue

          # -----------------------------------------------------------
          # Disable unnecessary RDP redirection
          # -----------------------------------------------------------
          Set-ItemProperty `
            -Path $policy `
            -Name "fDisableAudioCapture" `
            -Type DWord `
            -Value 1 `
            -Force

          Set-ItemProperty `
            -Path $policy `
            -Name "fDisableCdm" `
            -Type DWord `
            -Value 1 `
            -Force

          # -----------------------------------------------------------
          # High Performance power plan
          # -----------------------------------------------------------
          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c

          # Prevent idle power saving while the job is alive
          powercfg /change monitor-timeout-ac 0
          powercfg /change standby-timeout-ac 0
          powercfg /change hibernate-timeout-ac 0

          # -----------------------------------------------------------
          # Firewall
          # -----------------------------------------------------------
          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          # TCP 3389
          Remove-NetFirewallRule `
            -DisplayName "Optimized RDP TCP" `
            -ErrorAction SilentlyContinue

          New-NetFirewallRule `
            -DisplayName "Optimized RDP TCP" `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 3389 `
            -Action Allow `
            -Profile Any

          # UDP 3389
          Remove-NetFirewallRule `
            -DisplayName "Optimized RDP UDP" `
            -ErrorAction SilentlyContinue

          New-NetFirewallRule `
            -DisplayName "Optimized RDP UDP" `
            -Direction Inbound `
            -Protocol UDP `
            -LocalPort 3389 `
            -Action Allow `
            -Profile Any

          # -----------------------------------------------------------
          # RDP service
          # -----------------------------------------------------------
          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          Restart-Service `
            -Name "TermService" `
            -Force

          Start-Sleep -Seconds 2

          Write-Host ">>> RDP configured." -ForegroundColor Green

          # ===========================================================
          # PYTHON
          # ===========================================================
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host " INSTALLING PYTHON 3.12" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Cyan

          $pythonInstaller = "C:\python-installer.exe"

          Invoke-WebRequest `
            "https://www.python.org/ftp/python/3.12.3/python-3.12.3-amd64.exe" `
            -OutFile $pythonInstaller

          Start-Process `
            $pythonInstaller `
            -ArgumentList "/quiet InstallAllUsers=1 PrependPath=1 Include_pip=1" `
            -Wait

          Remove-Item `
            $pythonInstaller `
            -Force `
            -ErrorAction SilentlyContinue

          # ===========================================================
          # JAVA 21
          # ===========================================================
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host " INSTALLING JAVA 21" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Cyan

          $jdk = "C:\jdk.msi"

          Invoke-WebRequest `
            "https://api.adoptium.net/v3/binary/latest/21/ga/windows/x64/jdk/hotspot/normal/eclipse" `
            -OutFile $jdk

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i `"$jdk`" /quiet ADDLOCAL=FeatureMain,FeatureEnvironment,FeatureJarFileRunWith,FeatureJavaHome /norestart" `
            -Wait

          Remove-Item `
            $jdk `
            -Force `
            -ErrorAction SilentlyContinue

          # Refresh PATH for this job
          $env:Path =
            [Environment]::GetEnvironmentVariable("Path","Machine") +
            ";" +
            [Environment]::GetEnvironmentVariable("Path","User")

          Write-Host ""
          Write-Host ">>> TOOLCHAINS INSTALLED" -ForegroundColor Green
          Write-Host "Python:" -ForegroundColor Yellow
          python --version

          Write-Host "Java:" -ForegroundColor Yellow
          java -version


      # ===============================================================
      # 2. USERS
      # ===============================================================
      - name: 2. Configure RDP Users
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          # Keep hardcoded password exactly as requested
          $Password = ConvertTo-SecureString "Cynet@2026" -AsPlainText -Force

          # -----------------------------------------------------------
          # CynetAdmin
          # -----------------------------------------------------------
          $user = Get-LocalUser `
            -Name "CynetAdmin" `
            -ErrorAction SilentlyContinue

          if (-not $user) {

            New-LocalUser `
              -Name "CynetAdmin" `
              -Password $Password `
              -PasswordNeverExpires `
              -AccountNeverExpires

          }
          else {

            Set-LocalUser `
              -Name "CynetAdmin" `
              -Password $Password

          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "CynetAdmin" `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "CynetAdmin" `
            -ErrorAction SilentlyContinue


          # -----------------------------------------------------------
          # runneradmin
          # -----------------------------------------------------------
          net user runneradmin "Cynet@2026" /active:yes

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "runneradmin" `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "runneradmin" `
            -ErrorAction SilentlyContinue

          Write-Host ">>> RDP users configured." -ForegroundColor Green


      # ===============================================================
      # 3.
