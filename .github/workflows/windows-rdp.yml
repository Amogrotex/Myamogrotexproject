# =====================================================================
#  Linux Cloud RDP  (Ubuntu + XFCE + xrdp + Tailscale + persistent /mnt)
# ---------------------------------------------------------------------
#  WARNING: GitHub-hosted runners are for CI only. Using one as a remote
#  desktop violates the GitHub Actions Terms of Service and can get the
#  account suspended. Use a self-hosted runner or a real VPS instead.
# ---------------------------------------------------------------------
#  Required secret : TAILSCALE_AUTHKEY   (reusable; ephemeral recommended)
#  Optional secrets: RDP_PASSWORD        (defaults to the value below)
#                    TAILSCALE_APIKEY    (only needed for the static IP)
# =====================================================================
name: Linux Cloud RDP

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to keep the desktop alive (max ~340)"
        required: false
        default: "340"

env:
  RDP_USER: rdpuser
  TS_HOSTNAME: github-rdp-server
  # Anything that must survive between sessions lives here.
  # /mnt is the runner's big scratch disk (~65 GB free); / only has ~20 GB.
  PERSIST_DIR: /mnt/persist
  BACKUP_DIR: /mnt/_backup
  BACKUP_FILE: /mnt/_backup/dstate.tar.zst
  SNAPSHOT_EVERY_MIN: 15
  # >>> STATIC TAILSCALE IP <<< must be inside your tailnet's range.
  # Leave as-is or change; the pin step is skipped if TAILSCALE_APIKEY
  # is not set. See https://tailscale.com/blog/choose-your-ip
  TAILSCALE_STATIC_IP: 100.64.0.50

jobs:
  rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      # Job-level so that `if: env.X != ''` works (secrets aren't visible in `if`).
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      TAILSCALE_APIKEY: ${{ secrets.TAILSCALE_APIKEY }}
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD || 'Cynet@2026' }}

    steps:
      # ---------------------------------------------------------------
      #  /mnt is root-owned on hosted runners, so claim it before
      #  actions/cache tries to write the archive there.
      # ---------------------------------------------------------------
      - name: 0. Prepare scratch disk
        run: |
          set -euo pipefail
          sudo mkdir -p "$PERSIST_DIR" "$BACKUP_DIR"
          sudo chown -R "$USER:$USER" /mnt/persist /mnt/_backup
          df -h / /mnt

      # ---------------------------------------------------------------
      - name: 1. Install XFCE desktop + xrdp
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            xrdp xorgxrdp \
            xfce4-session xfwm4 xfdesktop4 xfce4-panel xfce4-settings \
            xfce4-terminal xfce4-appfinder thunar mousepad \
            dbus-x11 x11-xserver-utils xauth xfonts-base fonts-dejavu-core \
            zstd jq
          # Screen lockers are useless here and just lock you out of your own session
          sudo apt-get purge -y -qq xfce4-screensaver light-locker xscreensaver 2>/dev/null || true

          # xrdp needs to read the TLS key
          sudo adduser xrdp ssl-cert >/dev/null

          # Session script: XFCE, with the two vars that break xrdp unset
          sudo tee /etc/xrdp/startwm.sh >/dev/null <<'EOF'
          #!/bin/sh
          if [ -r /etc/default/locale ]; then
            . /etc/default/locale
            export LANG LANGUAGE
          fi
          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR
          exec /usr/bin/startxfce4
          EOF
          sudo chmod +x /etc/xrdp/startwm.sh

          # Kill the "Authentication is required to create a color managed device" popups
          sudo mkdir -p /etc/polkit-1/rules.d /etc/polkit-1/localauthority/50-local.d
          sudo tee /etc/polkit-1/rules.d/49-allow-colord.rules >/dev/null <<'EOF'
          polkit.addRule(function(action, subject) {
            if (action.id.indexOf("org.freedesktop.color-manager.") === 0 ||
                action.id.indexOf("org.freedesktop.packagekit.")    === 0) {
              return polkit.Result.YES;
            }
          });
          EOF
          sudo tee /etc/polkit-1/localauthority/50-local.d/45-allow-colord.pkla >/dev/null <<'EOF'
          [Allow colord for all users]
          Identity=unix-user:*
          Action=org.freedesktop.color-manager.*
          ResultAny=yes
          ResultInactive=yes
          ResultActive=yes
          EOF

          # Perf: 24-bit colour, no fancy cursors, low latency
          sudo sed -i 's/^new_cursors=true/new_cursors=false/'   /etc/xrdp/xrdp.ini
          sudo sed -i 's/^max_bpp=.*/max_bpp=24/'                /etc/xrdp/xrdp.ini
          sudo sed -i 's/^#\?tcp_nodelay=.*/tcp_nodelay=true/'   /etc/xrdp/xrdp.ini
          sudo sed -i 's/^#\?tcp_keepalive=.*/tcp_keepalive=true/' /etc/xrdp/xrdp.ini

          sudo systemctl enable --now xrdp xrdp-sesman
          sudo systemctl restart xrdp
          systemctl is-active xrdp && echo ">>> xrdp listening on 3389"

      # ---------------------------------------------------------------
      - name: 2. Create desktop user
        run: |
          set -euo pipefail
          sudo useradd -m -s /bin/bash "$RDP_USER" 2>/dev/null || true
          echo "$RDP_USER:$RDP_PASSWORD" | sudo chpasswd
          sudo usermod -aG sudo,ssl-cert "$RDP_USER"
          echo "$RDP_USER ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/90-rdpuser >/dev/null
          echo "xfce4-session" | sudo tee "/home/$RDP_USER/.xsession" >/dev/null
          sudo chown "$RDP_USER:$RDP_USER" "/home/$RDP_USER/.xsession"
          sudo chmod +x "/home/$RDP_USER/.xsession"

      # ---------------------------------------------------------------
      #  RESTORE the data saved by the PREVIOUS session. The key never
      #  hits (unique per run) -> restore-keys picks the newest "dstate-"
      #  entry, i.e. the last session's backup.
      #  NOTE: GitHub caches are capped at 10 GB per repo and evicted
      #  after 7 days of no use.
      # ---------------------------------------------------------------
      - name: 3. Restore previous session data
        uses: actions/cache/restore@v4
        with:
          path: /mnt/_backup/dstate.tar.zst
          key: dstate-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dstate-

      - name: 3b. Unpack persistent data
        run: |
          set -euo pipefail
          if [ -f "$BACKUP_FILE" ]; then
            echo ">>> Found backup ($(du -h "$BACKUP_FILE" | cut -f1)) - restoring ..."
            sudo tar -I zstd -xf "$BACKUP_FILE" -C /mnt
            echo ">>> Restore complete."
          else
            echo ">>> No previous backup - starting fresh."
          fi
          sudo chown -R "$RDP_USER:$RDP_USER" "$PERSIST_DIR"
          # Handy shortcut on the desktop user's home
          sudo -u "$RDP_USER" ln -sfn "$PERSIST_DIR" "/home/$RDP_USER/Persist"
          ls -la "$PERSIST_DIR"
          df -h / /mnt

      # ---------------------------------------------------------------
      #  Use an EPHEMERAL + reusable auth key: the node deletes itself
      #  shortly after the job ends, so no stale machines pile up.
      # ---------------------------------------------------------------
      - name: 4. Install & connect Tailscale
        run: |
          set -euo pipefail
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up \
            --authkey="$TAILSCALE_AUTHKEY" \
            --hostname="$TS_HOSTNAME" \
            --accept-dns=false \
            --ssh \
            --reset
          for _ in $(seq 40); do
            TS_IP="$(tailscale ip -4 2>/dev/null | head -n1 || true)"
            [ -n "${TS_IP:-}" ] && break
            sleep 0.5
          done
          echo "TS_IP=${TS_IP:-unknown}" >> "$GITHUB_ENV"
          echo "=================================================="
          echo "  >>> RDP SERVER IS READY! <<<"
          echo "  Tailscale IP : ${TS_IP:-<not assigned>}"
          echo "  Username     : $RDP_USER"
          echo "  Password     : $RDP_PASSWORD"
          echo "  Connect with : mstsc / Remmina  ->  ${TS_IP:-?}:3389"
          echo "  Or SSH       : ssh $RDP_USER@$TS_HOSTNAME  (Tailscale SSH)"
          echo "=================================================="
          tailscale status || true

      # ---------------------------------------------------------------
      #  Optional: always come up on the SAME address. Skipped unless
      #  TAILSCALE_APIKEY is set (admin console -> Settings -> Keys ->
      #  Generate API key, Devices: Read+Write).
      # ---------------------------------------------------------------
      - name: 4b. Pin static Tailscale IP
        if: env.TAILSCALE_APIKEY != ''
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $TAILSCALE_APIKEY"
          SELF="$(tailscale status --json | jq -r '.Self.ID')"
          # Free the IP by dropping stale nodes from earlier sessions
          curl -fsSL -H "$AUTH" "https://api.tailscale.com/api/v2/tailnet/-/devices" \
            | jq -r --arg self "$SELF" --arg hn "$TS_HOSTNAME" \
                '.devices[] | select(.hostname | startswith($hn)) | select(.nodeId != $self) | .nodeId' \
            | while read -r dev; do
                echo "    removing stale node: $dev"
                curl -fsSL -X DELETE -H "$AUTH" "https://api.tailscale.com/api/v2/device/$dev" >/dev/null || true
              done
          echo ">>> Pinning $TAILSCALE_STATIC_IP onto $SELF ..."
          if curl -fsSL -X POST -H "$AUTH" -H "Content-Type: application/json" \
               -d "{\"ipv4\":\"$TAILSCALE_STATIC_IP\"}" \
               "https://api.tailscale.com/api/v2/device/$SELF/ip" >/dev/null; then
            sleep 3
            echo ">>> Static IP applied. Now answering on: $(tailscale ip -4 | head -n1)"
          else
            echo ">>> Failed to pin IP. Check: API key valid? IP inside your tailnet range? IP free?"
          fi

      # ---------------------------------------------------------------
      #  Keep alive + rolling snapshot, so a cancelled/timed-out job
      #  still leaves a recent archive for the save step to upload.
      # ---------------------------------------------------------------
      - name: 5. Keep alive + periodic snapshot
        run: |
          set -uo pipefail
          total="${{ inputs.minutes }}"
          every="$SNAPSHOT_EVERY_MIN"
          for i in $(seq 1 "$total"); do
            sleep 60
            if [ $(( i % every )) -eq 0 ] || [ "$i" -eq "$total" ]; then
              tmp="$BACKUP_DIR/dstate.tmp.tar.zst"
              sudo tar -I 'zstd -3 -T0' -cf "$tmp" -C /mnt \
                --warning=no-file-changed \
                --exclude='*.log' --exclude='Cache' --exclude='.cache' \
                persist 2>/dev/null || true
              if [ -f "$tmp" ]; then
                sudo chown "$USER:$USER" "$tmp"     # cache/save must be able to read it
                mv -f "$tmp" "$BACKUP_FILE"
                echo "[$i/$total] snapshot updated ($(du -h "$BACKUP_FILE" | cut -f1))"
              fi
            else
              echo "[$i/$total] server running ... ${TS_IP:-}"
            fi
          done

      # ---------------------------------------------------------------
      - name: 6. Save data for the next session
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /mnt/_backup/dstate.tar.zst
          key: dstate-${{ github.run_id }}-${{ github.run_attempt }}
