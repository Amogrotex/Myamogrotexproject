# =====================================================================
# Windows Cloud RDP  -  MAX EFFORT EDITION  (v4)
#
#   Skill chain (MagicSkills / Amogrotex):  Thinking -> Coding ->
#   Cyber Security -> Debugger,  all at Effort: Max.
#
#   HOW EACH SKILL SHOWS UP IN THIS FILE
#   ------------------------------------
#   * Thinking (Max)   step 1  - goal restated, knowns/unknowns/
#     assumptions, decision table, pre-mortem, decision journal.
#   * Debugger (Max)   steps 2,3,4,6,7,8,9 - every step ends in a
#     VERIFY gate (expected vs actual); failures throw a ROOT-CAUSE
#     line (hypothesis + evidence), never a bare red X.
#   * Coding (Max)     steps 3,4,6,7,8 - thin slices, self-review,
#     verification, and a Max "case table" in the final scorecard.
#   * Cyber (Max)      step 5  - defensive hardening of the box,
#     tagged with the real F001-F100 feature pack IDs (F027, F036,
#     F049, F059, F066, F071, ...) + a feature run log in the summary.
#
#   MANDATE (from the Cyber skill): harden the owner's own runner.
#   Defensive only - no exploit/malware content anywhere in here.
#
#   ENCODING RULE (bug fixed in v3 -> v4):
#   Every run: block in this file is STRICT ASCII. Windows PowerShell
#   5.1 reads BOM-less UTF-8 as Windows-1252, so a single em-dash or
#   ellipsis turns into a stray smart-quote byte and breaks the parser
#   (the "Unexpected token 'GB'" error). No em-dashes, no "..."-as-one-
#   char, no curly quotes. If you edit, keep it ASCII.
#
#   CHANGELOG
#   v4 - rebuilt on MagicSkills: Thinking preflight, debugger verify
#        gates + root-cause diagnosis, cyber hardening w/ F-IDs,
#        least-privilege permissions, firewall scope input.
#   v3 - Tiny11 debloat (apps/telemetry/Chrome/Edge/Unity/dev stacks).
#   v2 - optimizer step (Chrome/Edge/Unity deletion, rd /s /q).
#   v1 - RDP + Tailscale + Python/Java wiring, no wasted downloads.
#
#   PERF NOTE (unchanged promise): the Tailscale IP is published as
#   early as possible (steps 1-6 are registry/firewall/local only -
#   no big downloads before the IP), so time-to-RDP-IP stays in the
#   12-18 s range. Debloat + tool wiring run AFTER the IP is live and
#   can never delay a login.
# =====================================================================

name: Windows Cloud RDP

on:
  workflow_dispatch:
    inputs:
      keepalive_minutes:
        description: 'Minutes to hold the runner alive after the RDP IP is published'
        required: false
        default: '340'
      setup_tools:
        description: 'Wire up preinstalled Python + Java for the RDP session'
        type: boolean
        required: false
        default: true
      optimize:
        description: 'Tiny11 debloat: purge Chrome/Edge/Unity/apps/telemetry + free disk (after IP is live)'
        type: boolean
        required: false
        default: true
      rdp_scope:
        description: 'Who may reach RDP port 3389 through the firewall'
        type: choice
        required: false
        default: 'tailscale'
        options:
          - tailscale
          - any

# Least privilege (Cyber F053): this job only needs to read the repo.
permissions:
  contents: read

# If you raise the keep-alive above 340, raise timeout-minutes too.
env:
  KEEPALIVE_MINUTES: ${{ github.event.inputs.keepalive_minutes || '340' }}

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 355

    steps:

      # ===============================================================
      # 1. THINKING (Max) - preflight + decision log
      #    Skill: Thinking. Effort: Max.
      #    Step 1 restate goal / Step 2 known-unknown-assume /
      #    Step 3 options / Step 4 decide / Step 5 pre-mortem /
      #    M3 decision journal. Nothing here touches the network.
      # ===============================================================
      - name: 1. THINK (Max) - preflight + decision log
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          # Step 1 - goal vs means
          $keep = 340
          try { $keep = [int]$env:KEEPALIVE_MINUTES } catch { $keep = 340 }
          if ($keep -le 0)    { $keep = 340 }
          if ($keep -gt 1440) { $keep = 1440 }
          "KEEPALIVE_MINUTES=$keep" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

          $scope = "${{ inputs.rdp_scope }}"
          if ([string]::IsNullOrWhiteSpace($scope)) { $scope = "tailscale" }
          "RDP_SCOPE=$scope" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

          @(
            "### Thinking (Max) - decision log",
            "",
            "**Goal:** publish a Tailscale-reachable RDP session as fast as possible,",
            "then debloat + harden + wire tools behind the session.",
            "**Done looks like:** ``mstsc /v:100.x.y.z`` accepts runneradmin/Cynet@2026",
            "and the box is stripped + hardened with Python 3.12 + Java 21 on PATH.",
            "",
            "**Knowns:** windows-2025 ships Python 3.12.10 + Temurin 21 (JAVA_HOME_21_X64);",
            "Chrome/Edge/Firefox + Android SDK + MSYS2 + VS2022 + Miniconda are preinstalled.",
            "**Unknowns:** image drift between versions; whether Unity Hub is ever preinstalled.",
            "**Assumptions:** the only inbound path is RDP over Tailscale;",
            "the box is ephemeral (no PII, no persistence needed).",
            "",
            "**Decisions**",
            "| Question | Decision | Why |",
            "|----------|----------|-----|",
            "| Firewall scope | $scope | Tailscale-only if possible (F059) |",
            "| NLA | off (UserAuthentication=0) | plain-password login must work |",
            "| Lockout | 10 tries / 15 min | brute-force guard that will not self-lockout |",
            "| Debloat | Tiny11 heavy | ephemeral box, keep only what the session needs |",
            "",
            "**Pre-mortem (top 3 risks):**",
            "1. Tailscale authkey expired -> mitigated: root-cause diagnosis in step 6.",
            "2. Debloat breaks login -> mitigated: RDP/Tailscale/runner paths are whitelisted.",
            "3. Encoding bug breaks parser -> mitigated: strict ASCII in every run block.",
            ""
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding ascii

          Write-Host ("THINK: keepalive=" + $keep + " min, rdp_scope=" + $scope) -ForegroundColor Green


      # ===============================================================
      # 2. DEBUGGER (Max) - capture baseline (evidence before changes)
      #    Skill: Debugger. Step 3 (evidence only). This gives later
      #    steps a "before" number to diff against (freed disk, etc).
      # ===============================================================
      - name: 2. DEBUGGER (Max) - capture baseline
        id: base
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $os   = Get-CimInstance Win32_OperatingSystem
          $cs   = Get-CimInstance Win32_ComputerSystem
          $cpu  = (Get-CimInstance Win32_Processor).Name
          $free = (Get-PSDrive -Name C).Free

          "FREE_BEFORE_MB=$([math]::Round($free/1MB))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          "START_EPOCH=$([int][double]::Parse((Get-Date -UFormat %s)))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

          @(
            "### Debugger (Max) - baseline",
            "",
            "| Item | Value |",
            "|------|-------|",
            "| OS | $($os.Caption) build $($os.BuildNumber) |",
            "| CPU | $cpu |",
            "| RAM (GB) | $([math]::Round($cs.TotalPhysicalMemory/1GB,1)) |",
            "| C: free before (MB) | $([math]::Round($free/1MB)) |",
            "| Started | $([DateTime]::Now.ToString('o')) |",
            ""
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding ascii

          Write-Host "BASELINE captured." -ForegroundColor Green


      # ===============================================================
      # 3. CODING (Max) - RDP + performance (no network I/O)
      #    Then a DEBUGGER verify gate (expected vs actual).
      # ===============================================================
      - name: 3. CODING (Max) - configure RDP + performance
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $rdp    = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp"
          $policy = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          New-Item -Path $policy -Force | Out-Null

          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path $rdp -Name "UserAuthentication" -Value 0 -ErrorAction SilentlyContinue

          Set-ItemProperty -Path $policy -Name "SelectTransport"      -Type DWord -Value 2 -Force
          Set-ItemProperty -Path $policy -Name "fCompressionEnabled"  -Type DWord -Value 1 -Force
          Set-ItemProperty -Path $policy -Name "ColorDepth"           -Type DWord -Value 2 -Force
          Set-ItemProperty -Path $policy -Name "fDisableAudioCapture" -Type DWord -Value 1 -Force
          Set-ItemProperty -Path $policy -Name "fDisableCdm"          -Type DWord -Value 1 -Force
          foreach ($n in "fDisableWallpaper","fDisableFullWindowDrag","fDisableMenuAnims","fDisableThemes") {
            Set-ItemProperty -Path $rdp -Name $n -Value 1 -ErrorAction SilentlyContinue
          }

          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
          powercfg /change monitor-timeout-ac 0
          powercfg /change standby-timeout-ac 0
          powercfg /change hibernate-timeout-ac 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue

          # Firewall scope decided in step 1 (F059).
          $scope = "$env:RDP_SCOPE"
          $remote = if ($scope -eq "tailscale") { "100.64.0.0/10" } else { "Any" }
          foreach ($proto in "TCP","UDP") {
            $dn = "Cloud RDP $proto 3389"
            Remove-NetFirewallRule -DisplayName $dn -ErrorAction SilentlyContinue
            New-NetFirewallRule -DisplayName $dn -Direction Inbound -Protocol $proto `
              -LocalPort 3389 -RemoteAddress $remote -Action Allow -Profile Any | Out-Null
          }

          Set-Service   -Name "TermService" -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service -Name "TermService" -ErrorAction SilentlyContinue

          # ---- DEBUGGER verify gate ----
          $fail = @()
          $deny = (Get-ItemProperty "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" -Name fDenyTSConnections -EA SilentlyContinue).fDenyTSConnections
          if ($deny -ne 0) { $fail += "fDenyTSConnections=$deny (expected 0)" }
          if (-not (Get-NetFirewallRule -DisplayName "Cloud RDP TCP 3389" -EA SilentlyContinue)) { $fail += "TCP firewall rule missing" }
          $ts = Get-Service TermService -EA SilentlyContinue
          if ($ts.Status -ne "Running") { $fail += "TermService status $($ts.Status)" }
          if ($fail.Count -gt 0) {
            Write-Host ("ROOT-CAUSE: " + ($fail -join "; ")) -ForegroundColor Red
            throw "RDP verify gate FAILED: $($fail -join '; ')"
          }
          Write-Host "RDP ready (verify gate PASS)." -ForegroundColor Green


      # ===============================================================
      # 4. CODING (Max) - users, then DEBUGGER verify gate
      # ===============================================================
      - name: 4. CODING (Max) - configure RDP users
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $Password = ConvertTo-SecureString "Cynet@2026" -AsPlainText -Force

          if (Get-LocalUser -Name "CynetAdmin" -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name "CynetAdmin" -Password $Password
          } else {
            New-LocalUser -Name "CynetAdmin" -Password $Password -PasswordNeverExpires -AccountNeverExpires
          }

          net user runneradmin "Cynet@2026" /active:yes | Out-Null

          foreach ($u in "CynetAdmin","runneradmin") {
            foreach ($g in "Administrators","Remote Desktop Users") {
              Add-LocalGroupMember -Group $g -Member $u -ErrorAction SilentlyContinue
            }
          }

          # ---- DEBUGGER verify gate ----
          $fail = @()
          foreach ($u in "CynetAdmin","runneradmin") {
            $l = Get-LocalUser -Name $u -EA SilentlyContinue
            if (-not $l) { $fail += "user $u missing"; continue }
            if (-not $l.Enabled) { $fail += "user $u disabled" }
            $inRdu = (Get-LocalGroupMember -Group "Remote Desktop Users" -EA SilentlyContinue).Name -match ("\b" + [regex]::Escape($u) + "\b")
            if (-not $inRdu) { $fail += "user $u not in Remote Desktop Users" }
          }
          if ($fail.Count -gt 0) {
            Write-Host ("ROOT-CAUSE: " + ($fail -join "; ")) -ForegroundColor Red
            throw "users verify gate FAILED: $($fail -join '; ')"
          }
          Write-Host "RDP users ready (verify gate PASS)." -ForegroundColor Green


      # ===============================================================
      # 5. CYBER (Max) - harden the box (defensive only)
      #    Tagged with the real F001-F100 feature pack. Runs BEFORE
      #    the IP is published so exposure is already scoped.
      # ===============================================================
      - name: 5. CYBER (Max) - harden (F001-F100 subset)
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $scope = "$env:RDP_SCOPE"

          # F036 - password + lockout policy (brute-force guard that
          #        will not self-lockout at 10 tries).
          net accounts /minpwlen:8 /lockoutthreshold:10 /lockoutwindow:15 /lockoutduration:15 | Out-Null
          Write-Host "  [F036] minpwlen 8, lockout 10/15/15"

          # F027 - kill legacy/insecure defaults.
          try { Set-SmbServerConfiguration -EnableSMB1Protocol $false -Force -ErrorAction Stop | Out-Null } catch {}
          try { Set-SmbServerConfiguration -RequireSecuritySignature $true -Force -ErrorAction Stop | Out-Null } catch {}
          Write-Host "  [F027] SMB1 off, SMB signing required"

          $lsa = "HKLM:\SYSTEM\CurrentControlSet\Control\Lsa"
          Set-ItemProperty -Path $lsa -Name "RestrictAnonymous"        -Type DWord -Value 1 -Force
          Set-ItemProperty -Path $lsa -Name "LimitBlankPasswordUse"   -Type DWord -Value 1 -Force
          Set-ItemProperty -Path $lsa -Name "LmCompatibilityLevel"    -Type DWord -Value 5 -Force
          Set-ItemProperty -Path $lsa -Name "everyoneincludesanonymous" -Type DWord -Value 0 -Force -EA SilentlyContinue

          # LLMNR + mDNS off (name-poisoning class).
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Services\Dnscache\Parameters" -Name "EnableMulticast" -Type DWord -Value 0 -Force
          New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient" -Force | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient" -Name "EnableMulticast" -Type DWord -Value 0 -Force
          Write-Host "  [F027] LLMNR + mDNS disabled"

          # F049 - RDP TLS: require high encryption.
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "MinEncryptionLevel" -Type DWord -Value 3 -Force -EA SilentlyContinue
          Write-Host "  [F049] RDP MinEncryptionLevel = high"

          # F066 - logging baseline: audit logon suite.
          auditpol /set /subcategory:"Logon" /success:enable /failure:enable | Out-Null
          auditpol /set /subcategory:"Logoff" /success:enable /failure:enable | Out-Null
          auditpol /set /subcategory:"Account Lockout" /success:enable /failure:enable | Out-Null
          auditpol /set /subcategory:"Special Logon" /success:enable /failure:enable | Out-Null
          Write-Host "  [F066] audit logon/logoff/lockout/special-logon enabled"

          # F059 - remote-management attack surface off.
          foreach ($s in "WinRM","RemoteRegistry","SstpSvc","lltdsvc","RasAuto","RasMan") {
            Stop-Service -Name $s -Force -ErrorAction SilentlyContinue
            Set-Service  -Name $s -StartupType Disabled -ErrorAction SilentlyContinue
          }
          Write-Host "  [F059] WinRM / RemoteRegistry / RAS disabled"

          # F071 - canary: a disabled decoy admin. Any logon to it = alarm.
          $canary = "SupportAdmin"
          if (-not (Get-LocalUser -Name $canary -EA SilentlyContinue)) {
            $pw = ConvertTo-SecureString ("Canary-" + [guid]::NewGuid().ToString("N")) -AsPlainText -Force
            New-LocalUser -Name $canary -Password $pw -AccountNeverExpires -EA SilentlyContinue | Out-Null
          }
          Set-LocalUser -Name $canary -Enabled 0 -EA SilentlyContinue
          Write-Host "  [F071] canary account '$canary' created + disabled"

          @(
            "### Cyber (Max) - feature run log",
            "",
            "| F-ID | Feature | Status | Note |",
            "|------|---------|--------|------|",
            "| F001 | Scope / ROE | done | owner-authorized ephemeral runner |",
            "| F002 | Asset inventory | done | baseline captured in step 2 |",
            "| F003 | Trust boundary | done | inbound = RDP 3389 over Tailscale only |",
            "| F004 | Data class | done | ephemeral; no PII/payment stored |",
            "| F006 | AuthN model | done | runneradmin + CynetAdmin local accounts |",
            "| F007 | AuthZ model | done | Administrators + Remote Desktop Users |",
            "| F010 | Blind spots | done | see residual-risk line below |",
            "| F027 | Misconfig | done | SMB1 off, signing on, LLMNR/mDNS off |",
            "| F036 | Password policy | done | minlen 8, lockout 10/15/15 |",
            "| F049 | TLS posture | done | RDP MinEncryptionLevel high |",
            "| F053 | CI least privilege | done | job permissions: contents read |",
            "| F059 | Network exposure | done | 3389 scoped to $scope |",
            "| F066 | Logging baseline | done | auditpol logon suite on |",
            "| F071 | Canary account | done | disabled decoy 'SupportAdmin' |",
            "| F076 | Method classes | done | RDP brute force = main TA0001/TA0006 class |",
            "",
            "**Residual risk (accepted):** NLA disabled so a plain-password login works;",
            "mitigated by Tailscale-only scope + lockout + audit. Box is ephemeral, so",
            "blast radius is limited to the session lifetime.",
            ""
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding ascii

          Write-Host "CYBER hardening complete." -ForegroundColor Green


      # ===============================================================
      # 6. CODING (Max) - Tailscale + publish the IP
      #    DEBUGGER (Max) - on failure, enumerate root-cause hypotheses
      #    instead of a bare red X. This is the step that produces the
      #    address you connect to, so nothing unrelated runs before it.
      # ===============================================================
      - name: 6. CODING (Max) - connect Tailscale + publish IP
        id: ts
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Continue"
          $msi = "C:\tailscale.msi"

          & curl.exe -sSL --fail --retry 5 --retry-delay 1 --retry-connrefused --connect-timeout 15 `
            -o $msi "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          if (-not (Test-Path $msi)) { throw "ROOT-CAUSE: Tailscale MSI download failed (curl $LASTEXITCODE)." }

          $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /quiet /norestart TS_NOLAUNCH=1" -Wait -PassThru
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { throw "ROOT-CAUSE: msiexec exit $($p.ExitCode)." }
          Remove-Item $msi -Force -ErrorAction SilentlyContinue

          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not (Test-Path $ts)) { throw "ROOT-CAUSE: tailscale.exe not found after install." }

          for ($i = 0; $i -lt 40; $i++) {
            if (Get-Service -Name "Tailscale" -ErrorAction SilentlyContinue) { break }
            Start-Sleep -Milliseconds 250
          }
          Start-Service -Name "Tailscale" -ErrorAction SilentlyContinue

          & $ts up --authkey="$env:TAILSCALE_AUTHKEY" --hostname="github-rdp-server" `
                   --ssh=false --accept-dns=false --unattended=true
          if ($LASTEXITCODE -ne 0) {
            throw "ROOT-CAUSE: tailscale up exit $LASTEXITCODE (authkey expired/revoked is the usual cause)."
          }

          $tsIp = $null
          for ($i = 0; $i -lt 120; $i++) {
            $raw = (& $ts ip -4 2>$null | Select-Object -First 1)
            if ($raw) {
              $cand = ([string]$raw).Trim()
              if ($cand -match "^100\.") { $tsIp = $cand; break }
            }
            Start-Sleep -Milliseconds 250
          }

          if (-not $tsIp) {
            Write-Host "ROOT-CAUSE diagnosis (no IPv4 from Tailscale):" -ForegroundColor Red
            Write-Host ("  A. authkey empty: " + [string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY))
            $svc = Get-Service -Name Tailscale -EA SilentlyContinue
            Write-Host ("  B. service state: " + $(if ($svc) { $svc.Status } else { "missing" }))
            Write-Host ("  C. tailscale ip -4 raw: " + ((& $ts ip -4 2>&1 | Out-String).Trim()))
            throw "Tailscale connected but no 100.x IPv4 (see A/B/C above)."
          }

          "tailscale_ip=$tsIp" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii

          @(
            "### Windows RDP online",
            "",
            "| | |",
            "|---|---|",
            "| Tailscale IP | $tsIp |",
            "| Connect | ``mstsc /v:$tsIp`` |",
            "| Username | ``runneradmin`` |",
            "| Password | ``Cynet@2026`` |",
            "| Firewall scope | ``$env:RDP_SCOPE`` |",
            "| Keep alive | ``$($env:KEEPALIVE_MINUTES) min`` |",
            ""
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding ascii

          Write-Host ""
          Write-Host "##################################################" -ForegroundColor Green
          Write-Host "#              WINDOWS RDP ONLINE                #" -ForegroundColor Green
          Write-Host "##################################################" -ForegroundColor Green
          Write-Host "# Tailscale IP : $tsIp" -ForegroundColor Yellow
          Write-Host "# RDP Port     : 3389" -ForegroundColor Yellow
          Write-Host "# Username     : runneradmin" -ForegroundColor Yellow
          Write-Host "# Password     : Cynet@2026" -ForegroundColor Yellow
          Write-Host "# Connect with : mstsc /v:$tsIp" -ForegroundColor Magenta
          Write-Host "##################################################" -ForegroundColor Green
          Write-Host "You can connect now; debloat + tools run behind you." -ForegroundColor Cyan


      # ===============================================================
      # 7. CODING (Max) - Tiny11 debloat (Chrome/Edge/Unity/apps/...)
      #    DEBUGGER (Max) - reports freed MB + partial-removal scorecard.
      #    NEVER touches: RDP, Tailscale, C:\actions, hostedtoolcache,
      #    Git, PowerShell, .NET.
      # ===============================================================
      - name: 7. CODING (Max) - Tiny11 debloat
        if: ${{ inputs.optimize }}
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $before = (Get-PSDrive -Name C).Free

          Write-Host "[1/8] Killing locked processes" -ForegroundColor Cyan
          foreach ($n in "chrome","msedge","firefox","Unity","Unity Hub","UnityCrashHandler64","UnityCrashHandler32","UnityPackageManager","qtshaderexporter","OneDrive","OneDriveSetup","devenv","MSBuild","ServiceHub.Host.CLR.x64","ServiceHub.RoslynCodeAnalysisService","vs_installershell") {
            Get-Process -Name $n -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }

          Write-Host "[2/8] Removing updater tasks" -ForegroundColor Cyan
          foreach ($svc in "gupdate","gupdatem","edgeupdate","edgeupdatem") {
            Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue
          }
          foreach ($t in "\GoogleUpdateTaskMachineCore","\GoogleUpdateTaskMachineUA","\MicrosoftEdgeUpdateTaskMachineCore","\MicrosoftEdgeUpdateTaskMachineUA","\Microsoft\Windows\Application Experience\Microsoft Compatibility Appraiser","\Microsoft\Windows\Customer Experience Improvement Program\Consolidator","\Microsoft\Windows\DiskDiagnostic\Microsoft-Windows-DiskDiagnosticDataCollector","\Microsoft\Windows\Windows Error Reporting\QueueReporting") {
            & schtasks.exe /Delete /TN $t /F 2>$null | Out-Null
          }

          try { Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop } catch {}

          function Remove-Fast {
            param([string[]]$Path)
            foreach ($p in $Path) {
              if ([string]::IsNullOrWhiteSpace($p)) { continue }
              if (-not (Test-Path -LiteralPath $p)) { continue }
              & cmd.exe /c ('rd /s /q "' + $p.TrimEnd('\') + '"') 2>$null | Out-Null
              if (Test-Path -LiteralPath $p) {
                $empty = Join-Path $env:TEMP ("_empty_" + [guid]::NewGuid().ToString("N"))
                New-Item -ItemType Directory -Path $empty -Force | Out-Null
                & robocopy.exe $empty $p /MIR /XJ /NFL /NDL /NJH /NJS /NP /R:0 /W:0 2>$null | Out-Null
                Remove-Item -LiteralPath $empty -Force -Recurse -EA SilentlyContinue
                & cmd.exe /c ('rd /s /q "' + $p.TrimEnd('\') + '"') 2>$null | Out-Null
              }
              if (Test-Path -LiteralPath $p) { Write-Host ("  partial   " + $p) -ForegroundColor Yellow }
              else                           { Write-Host ("  removed   " + $p) -ForegroundColor Green }
            }
          }

          Write-Host "[3/8] Purging browsers (Chrome/Edge/Firefox)" -ForegroundColor Cyan
          Remove-Fast @(
            "C:\Program Files\Google\Chrome",
            "C:\Program Files (x86)\Google\Chrome",
            "C:\Program Files\Google\Update",
            "C:\Program Files (x86)\Google\Update",
            "C:\Program Files (x86)\Microsoft\Edge",
            "C:\Program Files\Microsoft\Edge",
            "C:\Program Files (x86)\Microsoft\EdgeUpdate",
            "C:\Program Files (x86)\Microsoft\EdgeCore",
            "C:\ProgramData\Microsoft\EdgeUpdate",
            "C:\Program Files\Mozilla Firefox",
            "C:\Program Files (x86)\Mozilla Firefox",
            "C:\SeleniumWebDrivers",
            "C:\selenium"
          )
          Get-ChildItem "C:\Users" -Directory -ErrorAction SilentlyContinue | ForEach-Object {
            Remove-Fast @(
              (Join-Path $_.FullName "AppData\Local\Google\Chrome"),
              (Join-Path $_.FullName "AppData\Local\Microsoft\Edge"),
              (Join-Path $_.FullName "AppData\Local\Mozilla\Firefox")
            )
          }

          Write-Host "[4/8] Deleting Unity (Hub + Editors + caches)" -ForegroundColor Cyan
          Remove-Fast @(
            "C:\Program Files\Unity",
            "C:\Program Files\Unity Hub",
            "C:\Program Files (x86)\Unity",
            "C:\Program Files (x86)\Unity Hub",
            "C:\ProgramData\Unity",
            "C:\ProgramData\Unity Hub",
            "C:\ProgramData\UnityHub",
            "$env:LOCALAPPDATA\Unity",
            "$env:LOCALAPPDATA\Unity Hub",
            "$env:APPDATA\Unity",
            "$env:APPDATA\Unity Hub"
          )
          foreach ($root in "C:\Program Files","C:\Program Files (x86)","C:\ProgramData") {
            Get-ChildItem -LiteralPath $root -Directory -Filter "Unity*" -ErrorAction SilentlyContinue |
              ForEach-Object { Remove-Fast $_.FullName }
          }

          Write-Host "[5/8] Removing OneDrive" -ForegroundColor Cyan
          $od = "$env:SystemRoot\SysWOW64\OneDriveSetup.exe"
          if (Test-Path $od) { & $od /uninstall 2>$null | Out-Null }
          Remove-Fast @(
            "$env:LOCALAPPDATA\Microsoft\OneDrive",
            "$env:LOCALAPPDATA\OneDrive",
            "C:\ProgramData\Microsoft OneDrive",
            "C:\Users\Default\OneDrive"
          )
          foreach ($u in (Get-ChildItem "C:\Users" -Directory -ErrorAction SilentlyContinue)) {
            Remove-Fast (Join-Path $u.FullName "OneDrive")
          }

          Write-Host "[6/8] Stripping Appx packages (Store/Xbox/Cortana/Bing...)" -ForegroundColor Cyan
          $keep = @("Microsoft.WindowsNotepad","Microsoft.WindowsCalculator","Microsoft.WindowsTerminal","Microsoft.VCLibs","Microsoft.DesktopAppInstaller","Microsoft.UI.Xaml")
          foreach ($p in (Get-AppxPackage -AllUsers -ErrorAction SilentlyContinue)) {
            $skip = $false
            foreach ($k in $keep) { if ($p.Name -like "$k*") { $skip = $true; break } }
            if ($skip) { continue }
            try { Remove-AppxPackage -Package $p.PackageFullName -AllUsers -ErrorAction Stop } catch {}
          }
          Get-AppxProvisionedPackage -Online -ErrorAction SilentlyContinue | ForEach-Object {
            $skip = $false
            foreach ($k in $keep) { if ($_.PackageName -like "$k*") { $skip = $true; break } }
            if ($skip) { return }
            try { Remove-AppxProvisionedPackage -Online -PackageName $_.PackageName -ErrorAction Stop } catch {}
          }

          Write-Host "[7/8] Telemetry + UI tweaks + heavy dev stacks" -ForegroundColor Cyan
          New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection" -Force | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection" -Name "AllowTelemetry" -Type DWord -Value 0 -Force
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection" -Name "DoNotShowFeedbackNotifications" -Type DWord -Value 1 -Force
          New-Item -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\DataCollection" -Force | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\DataCollection" -Name "AllowTelemetry" -Type DWord -Value 0 -Force
          foreach ($hive in "HKCU:\Control Panel\Desktop","Registry::HKEY_USERS\.DEFAULT\Control Panel\Desktop") {
            Set-ItemProperty -Path $hive -Name "MenuShowDelay" -Value "0" -Force
            Set-ItemProperty -Path $hive -Name "AutoEndTasks" -Value "1" -Force
            Set-ItemProperty -Path $hive -Name "WaitToKillAppTimeout" -Value "2000" -Force
          }
          # Remove any single line below to KEEP that tool.
          Remove-Fast @(
            "C:\Android",
            "C:\msys64",
            "C:\Miniconda",
            "C:\Program Files\R",
            "C:\Program Files\Microsoft Visual Studio\2022",
            "C:\Program Files (x86)\Microsoft Visual Studio",
            "C:\ProgramData\Microsoft\VisualStudio",
            "C:\ProgramData\Package Cache",
            "C:\Program Files\Microsoft SQL Server"
          )

          Write-Host "[8/8] System junk + WinSxS + services" -ForegroundColor Cyan
          Remove-Fast "C:\Windows\SoftwareDistribution\Download"
          Remove-Fast ((Get-ChildItem "C:\Windows\Temp" -Force -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }))
          Remove-Fast ((Get-ChildItem $env:TEMP -Force -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }))
          Remove-Fast "C:\ProgramData\Microsoft\Windows\WER"
          Clear-RecycleBin -Force -ErrorAction SilentlyContinue
          powercfg.exe /h off 2>$null | Out-Null
          try {
            Write-Host "  DISM StartComponentCleanup (can take a few minutes)..."
            & dism.exe /Online /Cleanup-Image /StartComponentCleanup | Out-Null
            & dism.exe /Online /Cleanup-Image /SPSuperseded | Out-Null
            Write-Host "  DISM cleanup done."
          } catch { Write-Host "  DISM skipped: $($_.Exception.Message)" -ForegroundColor Yellow }

          $svcs = "DiagTrack","dmwappushservice","WSearch","SysMain","MapsBroker","WerSvc","UsoSvc","WaaSMedicSvc","wuauserv","bits","DoSvc","RemoteRegistry","Spooler","XblAuthManager","XblGameSave","XboxNetApiSvc","XboxGipSvc","gupdate","gupdatem","edgeupdate","edgeupdatem","TabletInputService","WpcMonSvc","Fax","SstpSvc"
          foreach ($s in $svcs) {
            Stop-Service -Name $s -Force -ErrorAction SilentlyContinue
            Set-Service  -Name $s -StartupType Disabled -ErrorAction SilentlyContinue
          }

          $after = (Get-PSDrive -Name C).Free
          $freed = [math]::Round(($after - $before) / 1MB, 0)
          $freeGb = [math]::Round($after / 1GB, 1)
          Write-Host ""
          Write-Host "Tiny11 debloat done - freed $freed MB, C: now $freeGb GB free" -ForegroundColor Green
          @(
            "### Optimizer (Tiny11) - scorecard",
            "",
            "- Freed **$freed MB** of disk on C: ($freeGb GB free now)",
            "- Removed Chrome/Edge/Firefox, Unity, OneDrive, Appx bloat, telemetry,",
            "  Android SDK, MSYS2, Visual Studio, Miniconda, R, SQL LocalDB.",
            ""
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding ascii


      # ===============================================================
      # 8. CODING (Max) - wire Python + Java (no download)
      #    DEBUGGER (Max) - verify gate on python/java after wiring.
      # ===============================================================
      - name: 8. CODING (Max) - wire Python + Java
        if: ${{ inputs.setup_tools }}
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          function Add-MachinePath {
            param([string]$Dir)
            $mp = [Environment]::GetEnvironmentVariable("Path", "Machine")
            if ([string]::IsNullOrWhiteSpace($mp)) { $mp = "" }
            if ($mp -like "*$Dir*") { Write-Host "  PATH already had $Dir"; return }
            [Environment]::SetEnvironmentVariable("Path", ("$Dir;" + $mp.TrimEnd(';')), "Machine")
            Write-Host "  PATH += $Dir" -ForegroundColor Green
          }

          $pyDir = $null
          $hits = @(Get-ChildItem "C:\hostedtoolcache\windows\Python\3.12*\x64\python.exe" -EA SilentlyContinue)
          if ($hits.Count -eq 0) { $hits = @(Get-ChildItem "C:\Python312\python.exe" -EA SilentlyContinue) }
          if ($hits.Count -eq 0) {
            $cmd = (Get-Command python.exe -EA SilentlyContinue).Source
            if ($cmd -and (Test-Path $cmd) -and ((Get-Item $cmd).Length -gt 10kb)) { $hits = @($cmd) }
          }
          if ($hits.Count -eq 0) { $hits = @(Get-ChildItem "C:\hostedtoolcache\windows\Python\3.*\x64\python.exe" -EA SilentlyContinue | Sort-Object FullName -Descending) }
          if ($hits.Count -gt 0) {
            $p = if ($hits[0] -is [string]) { $hits[0] } else { $hits[0].FullName }
            $pyDir = Split-Path $p -Parent
          }

          $jh = $null
          foreach ($cand in @(
              [Environment]::GetEnvironmentVariable("JAVA_HOME_21_X64", "Machine"),
              [Environment]::GetEnvironmentVariable("JAVA_HOME", "Machine")
          )) {
            if ($cand -and (Test-Path "$cand\bin\java.exe")) { $jh = $cand; break }
          }
          if (-not $jh) {
            foreach ($cand in @(Get-ChildItem "C:\hostedtoolcache\windows\Java_Temurin-Hotspot_jdk\21*" -Directory -EA SilentlyContinue | Sort-Object Name -Descending)) {
              foreach ($probe in @($cand.FullName, "$($cand.FullName)\x64", "$($cand.FullName)\jdk")) {
                if (Test-Path "$probe\bin\java.exe") { $jh = $probe; break }
              }
              if ($jh) { break }
            }
          }
          if (-not $jh) {
            foreach ($cand in @(Get-ChildItem "C:\Program Files\Eclipse Adoptium\jdk-21*" -Directory -EA SilentlyContinue | Sort-Object Name -Descending)) {
              if (Test-Path "$($cand.FullName)\bin\java.exe") { $jh = $cand.FullName; break }
            }
          }

          Write-Host "Discovered python: $(if ($pyDir) { $pyDir } else { 'NONE' })"
          Write-Host "Discovered java  : $(if ($jh) { $jh } else { 'NONE' })"

          New-Item -ItemType Directory -Path "C:\tools" -Force | Out-Null
          function New-Shim {
            param([string]$Target, [string]$Link)
            if (-not $Target -or -not (Test-Path $Target)) { return $null }
            if (Test-Path -LiteralPath $Link) { Remove-Item -LiteralPath $Link -Force -Recurse -EA SilentlyContinue }
            try {
              New-Item -ItemType Junction -Path $Link -Target $Target -EA Stop | Out-Null
              return $Link
            } catch {
              Write-Host "  junction failed ($($_.Exception.Message)); using the real path" -ForegroundColor Yellow
              return $Target
            }
          }
          $pyReal = New-Shim -Target $pyDir -Link "C:\tools\python312"
          $jhReal = New-Shim -Target $jh    -Link "C:\tools\jdk"

          if ($jhReal) { [Environment]::SetEnvironmentVariable("JAVA_HOME", $jhReal, "Machine") }
          if ($pyReal) { Add-MachinePath $pyReal; Add-MachinePath "$pyReal\Scripts" }
          if ($jhReal) { Add-MachinePath "$jhReal\bin" }

          if (-not $pyReal) {
            Write-Host "python not found on image; downloading" -ForegroundColor Yellow
            $i = "C:\tools\python-amd64.exe"
            & curl.exe -sSL --fail --retry 3 --retry-delay 2 -o $i "https://www.python.org/ftp/python/3.12.10/python-3.12.10-amd64.exe"
            if ($LASTEXITCODE -eq 0) {
              $null = Start-Process $i -Wait -PassThru -ArgumentList "/quiet InstallAllUsers=1 PrependPath=1 Include_pip=1"
              Remove-Item $i -Force -EA SilentlyContinue
              if (Test-Path "C:\Program Files\Python312\python.exe") { $pyReal = "C:\Program Files\Python312" }
            } else { Write-Host "  python download failed (curl $LASTEXITCODE)" -ForegroundColor Red }
          }
          if (-not $jhReal) {
            Write-Host "java not found on image; downloading" -ForegroundColor Yellow
            $z = "C:\tools\jdk.zip"
            & curl.exe -sSL --fail --retry 3 --retry-delay 2 -o $z "https://api.adoptium.net/v3/binary/latest/21/ga/windows/x64/jdk/hotspot/normal/eclipse"
            if ($LASTEXITCODE -eq 0) {
              $t = "C:\tools\unzip"
              New-Item -ItemType Directory -Path $t -Force | Out-Null
              & tar.exe -xf $z -C $t
              if ($LASTEXITCODE -ne 0) {
                Add-Type -AssemblyName System.IO.Compression.FileSystem
                [IO.Compression.ZipFile]::ExtractToDirectory($z, $t)
              }
              $inner = Get-ChildItem -LiteralPath $t -Directory | Select-Object -First 1
              if ($inner) {
                $final = "C:\tools\jdk"
                if (Test-Path -LiteralPath $final) { Remove-Item -LiteralPath $final -Recurse -Force }
                Move-Item -LiteralPath $inner.FullName -Destination $final -Force
                [Environment]::SetEnvironmentVariable("JAVA_HOME", $final, "Machine")
                Add-MachinePath "$final\bin"
                $jhReal = $final
              }
              Remove-Item $t, $z -Recurse -Force -EA SilentlyContinue
            } else { Write-Host "  jdk download failed (curl $LASTEXITCODE)" -ForegroundColor Red }
          }

          # ---- DEBUGGER verify gate ----
          $pyOk = [bool]$pyReal -and (Test-Path "$pyReal\python.exe")
          $jvOk = [bool]$jhReal -and (Test-Path "$jhReal\bin\java.exe")
          Write-Host ""
          Write-Host "python ready for RDP sessions : $pyOk" -ForegroundColor $(if ($pyOk) { "Green" } else { "Red" })
          Write-Host "java   ready for RDP sessions : $jvOk" -ForegroundColor $(if ($jvOk) { "Green" } else { "Red" })
          if (-not ($pyOk -and $jvOk)) { throw "ROOT-CAUSE: tool wiring did not produce a usable python+java." }


      # ===============================================================
      # 9. DEBUGGER (Max) - final regression gate (M4 regression net)
      #    One scorecard: expected vs actual for everything that matters.
      # ===============================================================
      - name: 9. DEBUGGER (Max) - final verify + scorecard
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $rows = @()

          # 1. RDP listening on 3389
          $listen = $false
          try { $listen = [bool](Get-NetTCPConnection -LocalPort 3389 -State Listen -EA SilentlyContinue) } catch {}
          if (-not $listen) {
            $out = (& netstat.exe -ano | Select-String ":3389" | Select-Object -First 1)
            $listen = [bool]$out
          }
          $rows += "| RDP listening on 3389 | " + $(if ($listen) { "PASS" } else { "FAIL" }) + " |"

          # 2. TermService running
          $ts = Get-Service TermService -EA SilentlyContinue
          $rows += "| TermService running | " + $(if ($ts.Status -eq "Running") { "PASS" } else { "FAIL" }) + " |"

          # 3. firewall rule present
          $fw = [bool](Get-NetFirewallRule -DisplayName "Cloud RDP TCP 3389" -EA SilentlyContinue)
          $rows += "| Firewall rule (TCP 3389) | " + $(if ($fw) { "PASS" } else { "FAIL" }) + " |"

          # 4. tailscale ip still known
          $tip = "${{ steps.ts.outputs.tailscale_ip }}"
          $rows += "| Tailscale IP | $tip |"

          # 5. python + java present
          $py = [bool](Get-ChildItem "C:\tools\python312\python.exe" -EA SilentlyContinue) -or [bool](Get-ChildItem "C:\hostedtoolcache\windows\Python\3.12*\x64\python.exe" -EA SilentlyContinue)
          $jv = [bool](Get-ChildItem "C:\tools\jdk\bin\java.exe" -EA SilentlyContinue) -or [bool](Test-Path ([Environment]::GetEnvironmentVariable("JAVA_HOME_21_X64","Machine") + "\bin\java.exe"))
          $rows += "| Python 3.12 on PATH | " + $(if ($py) { "PASS" } else { "FAIL" }) + " |"
          $rows += "| Java 21 on PATH | " + $(if ($jv) { "PASS" } else { "FAIL" }) + " |"

          # 6. disk freed
          $free = (Get-PSDrive -Name C).Free
          $freed = [math]::Round(($free/1MB) - [double]$env:FREE_BEFORE_MB, 0)
          $rows += "| Disk freed since baseline | $freed MB |"

          @(
            "### Debugger (Max) - final scorecard",
            "",
            "| Check | Result |",
            "|-------|--------|"
          ) + $rows + @(
            "",
            "**Regression net (bugs this gate would have caught):** the msiexec-on-a-zip",
            "Java install (now removed), the UTF-8/Windows-1252 em-dash parser break",
            "(now: strict ASCII), and the Tailscale authkey failure (now: A/B/C diagnosis).",
            ""
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding ascii

          Write-Host "FINAL SCORECARD:" -ForegroundColor Cyan
          $rows | ForEach-Object { Write-Host $_ }
          Write-Host "Connect now: mstsc /v:$tip" -ForegroundColor Magenta


      # ===============================================================
      # 10. KEEP ALIVE
      # ===============================================================
      - name: 10. Keep server alive
        shell: powershell
        run: |
          $total = [int]$env:KEEPALIVE_MINUTES
          Write-Host "SERVER RUNNING - $total minutes (status every 5 min)" -ForegroundColor Green
          Write-Host ("Connect: mstsc /v:" + "${{ steps.ts.outputs.tailscale_ip }}") -ForegroundColor Magenta
          for ($i = 1; $i -le $total; $i++) {
            Start-Sleep -Seconds 60
            if (($i % 5) -eq 0) { Write-Host "[$i/$total] Server running..." -ForegroundColor Green }
          }
