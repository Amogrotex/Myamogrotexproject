# =============================================================================
#  Windows Cloud RDP - browser access via Cloudflare quick tunnel + MeshCentral
# =============================================================================
#  FIXES vs. the old workflow:
#   1. timeout-minutes: 999 -> 360. GitHub-hosted runners hard-cap at 360
#      minutes (6h). A value above 360 makes the workflow file INVALID, which
#      is why the run never started.
#   2. Tailscale removed entirely -> replaced with Cloudflare quick tunnel
#      (no account, no token, no secrets needed).
#   3. `net user runneradmin ...` removed - changing the runneradmin password
#      mid-run breaks the GitHub runner itself.
#   4. Python 3.12 and JDK 21 are ALREADY preinstalled on windows-latest, so
#      the big installer downloads are gone (kept a verify step only).
#   5. Added MeshCentral: a web-based RDP gateway so you can use the Windows
#      desktop FROM A BROWSER (no mstsc, no extra client).
#
#  NOTE: GitHub's ToS says Actions is for CI/CD only. GitHub has been disabling
#  Actions on repositories used as free RDP hosts. Use a private repo and
#  don't expect this to live forever. The URL below is PUBLIC while the job
#  runs - anyone with the link can see the login page, and the password is
#  printed in the job log. Change "Cynet@2026" in this file.
# =============================================================================

name: Windows Cloud RDP (Cloudflare + browser)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360   # GitHub-hosted maximum (6 hours)

    steps:
      - name: 1. Enable RDP + create admin user
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          # NLA off: the browser RDP client (MeshCentral) does not support NLA/CredSSP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0

          $Password = ConvertTo-SecureString "Cynet@2026" -AsPlainText -Force
          New-LocalUser -Name "CynetAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "CynetAdmin" -ErrorAction SilentlyContinue

          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c 2>$null
          Write-Host ">>> RDP enabled. Local user: CynetAdmin" -ForegroundColor Green

      - name: 2. Cache tools (cloudflared + node_modules)
        uses: actions/cache@v4
        with:
          path: |
            C:\cloudflared.exe
            C:\mesh\node_modules
          key: cloud-rdp-tools-v1

      - name: 3. Download cloudflared + start quick tunnels
        run: |
          $ProgressPreference = 'SilentlyContinue'
          if (-not (Test-Path "C:\cloudflared.exe")) {
            curl.exe -sL --retry 3 -o "C:\cloudflared.exe" `
              "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"
          }

          function Start-QuickTunnel([string]$target, [string]$outLog, [string]$errLog) {
            Start-Process -FilePath "C:\cloudflared.exe" `
              -ArgumentList @("tunnel", "--url", $target, "--no-autoupdate") `
              -RedirectStandardOutput $outLog -RedirectStandardError $errLog `
              -WindowStyle Hidden | Out-Null
            for ($i = 1; $i -le 30; $i++) {
              $m = Select-String -Path $outLog, $errLog -Pattern 'https://[a-z0-9-]+\.trycloudflare\.com' -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($m) { return $m.Matches[0].Value }
              Start-Sleep -Seconds 1
            }
            return $null
          }

          # Tunnel 1: browser RDP via MeshCentral (will listen on port 8080)
          $webUrl = $null
          for ($attempt = 1; $attempt -le 5 -and -not $webUrl; $attempt++) {
            Get-Process cloudflared -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
            $webUrl = Start-QuickTunnel "http://localhost:8080" "C:\cf-web-out.log" "C:\cf-web-err.log"
            if (-not $webUrl) { Write-Host ">>> Tunnel attempt $attempt failed, retrying..." -ForegroundColor Yellow }
          }
          if (-not $webUrl) {
            Get-Content "C:\cf-web-out.log", "C:\cf-web-err.log" -ErrorAction SilentlyContinue | Select-Object -Last 20
            throw "Cloudflare quick tunnel failed to start (rate limited?). Try re-running the workflow."
          }

          # Tunnel 2: native RDP fallback (for mstsc on your own PC)
          $rdpUrl = Start-QuickTunnel "rdp://localhost:3389" "C:\cf-rdp-out.log" "C:\cf-rdp-err.log"
          if (-not $rdpUrl) { $rdpUrl = "unavailable (re-run to try again)" }

          "CF_URL=$webUrl"     | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CF_RDP_URL=$rdpUrl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host ">>> Browser URL  : $webUrl" -ForegroundColor Cyan
          Write-Host ">>> RDP fallback : $rdpUrl" -ForegroundColor Cyan

      - name: 4. Install MeshCentral (browser RDP gateway)
        run: |
          $ProgressPreference = 'SilentlyContinue'
          if (-not (Test-Path "C:\mesh\node_modules\meshcentral\meshcentral.js")) {
            New-Item -ItemType Directory -Path "C:\mesh" -Force | Out-Null
            Set-Location C:\mesh
            npm install meshcentral --no-audit --no-fund --loglevel=error
          }
          Write-Host ">>> MeshCentral installed." -ForegroundColor Green

      - name: 5. Configure MeshCentral + create web login
        env:
          CF_URL: ${{ env.CF_URL }}
        run: |
          $hostName = ($env:CF_URL -replace '^https://', '').Trim()
          $sessionKey = -join ((48..57) + (97..102) | Get-Random -Count 32 | ForEach-Object { [char]$_ })

          $config = @{
            settings = @{
              port          = 8080
              aliasPort     = 0
              redirPort     = 0
              mpsPort       = 0
              mpsAliasPort  = 0
              agentPort     = 0
              agentAliasPort = 0
              lanonly       = $true          # LAN mode: no internet certs, no updates
              tlsOffload    = "0.0.0.0/0"    # Cloudflare terminates TLS, MeshCentral serves HTTP
              sessionKey    = $sessionKey
              noAgentUpdate = $true
            }
            domains = @{
              $hostName = @{
                title       = "Windows RDP"
                title2      = "MeshCentral"
                newAccounts = $false
              }
            }
          }
          New-Item -ItemType Directory -Path "C:\mesh\meshcentral-data" -Force | Out-Null
          $config | ConvertTo-Json -Depth 10 | Set-Content -Path "C:\mesh\meshcentral-data\config.json" -Encoding utf8

          # Create the login account BEFORE starting the server (server must be offline)
          Set-Location C:\mesh
          node "C:\mesh\node_modules\meshcentral\meshcentral.js" --createaccount Cynet --pass "Cynet@2026"
          node "C:\mesh\node_modules\meshcentral\meshcentral.js" --adminaccount Cynet
          Write-Host ">>> MeshCentral configured. Web login: Cynet / Cynet@2026" -ForegroundColor Green

      - name: 6. Start MeshCentral + health check
        run: |
          Start-Process -FilePath "node.exe" `
            -ArgumentList "C:\mesh\node_modules\meshcentral\meshcentral.js" `
            -WorkingDirectory "C:\mesh" `
            -RedirectStandardOutput "C:\mesh\mesh.log" -RedirectStandardError "C:\mesh\mesh-err.log" `
            -WindowStyle Hidden | Out-Null

          $ok = $false
          for ($i = 1; $i -le 90; $i++) {
            try {
              $r = Invoke-WebRequest "http://localhost:8080" -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -lt 500) { $ok = $true; break }
            } catch { }
            Start-Sleep -Seconds 2
          }
          if (-not $ok) {
            Get-Content "C:\mesh\mesh.log", "C:\mesh\mesh-err.log" -ErrorAction SilentlyContinue | Select-Object -Last 40
            throw "MeshCentral did not start - see log above."
          }
          Write-Host ">>> MeshCentral is UP on http://localhost:8080" -ForegroundColor Green

      - name: 7. Toolchain check (Python & Java are preinstalled)
        run: |
          Write-Host ">>> windows-latest already ships Python 3.12 and JDK 21 - no install needed:"
          python --version 2>&1
          $j = if (Get-Command java -ErrorAction SilentlyContinue) { "java" }
               elseif (Test-Path "$env:JAVA_HOME_21_X64\bin\java.exe") { "$env:JAVA_HOME_21_X64\bin\java.exe" }
               else { $null }
          if ($j) { & $j -version 2>&1 | Select-Object -First 1 }
          else { Write-Host "Java not found on PATH" -ForegroundColor Red }

      - name: 8. Keep server alive (up to 6h) + connection info
        env:
          CF_URL: ${{ env.CF_URL }}
          CF_RDP_URL: ${{ env.CF_RDP_URL }}
        run: |
          Write-Host ""
          Write-Host "==============================================================" -ForegroundColor Green
          Write-Host "   >>> OPEN THIS URL IN YOUR BROWSER (any device) <<<" -ForegroundColor Cyan
          Write-Host "       $env:CF_URL"
          Write-Host ""
          Write-Host "   Web login : Cynet" -ForegroundColor Yellow
          Write-Host "   Password  : Cynet@2026" -ForegroundColor Yellow
          Write-Host ""
          Write-Host "   In the browser, once logged in:"
          Write-Host "     1. My Devices -> Add Device Group -> type 'Local Devices (No Agent)'"
          Write-Host "     2. Add Device -> type Windows -> address 127.0.0.1"
          Write-Host "     3. Open the device -> RDP tab -> host 127.0.0.1"
          Write-Host "        user CynetAdmin / password Cynet@2026 -> Connect"
          Write-Host ""
          Write-Host "   Native RDP fallback (mstsc on YOUR pc, needs cloudflared):" -ForegroundColor Cyan
          Write-Host "     cloudflared access rdp --hostname $($env:CF_RDP_URL -replace '^https://','') --url rdp://localhost:3390"
          Write-Host "     then mstsc -> localhost:3390 -> CynetAdmin / Cynet@2026"
          Write-Host "==============================================================" -ForegroundColor Green

          for ($i = 1; $i -le 340; $i++) {
            Start-Sleep -Seconds 60
            $cf  = if (Get-Process cloudflared -ErrorAction SilentlyContinue) { "OK" } else { "DOWN" }
            $web = try { (Invoke-WebRequest "http://localhost:8080" -UseBasicParsing -TimeoutSec 5).StatusCode } catch { "DOWN" }
            Write-Host "[$i/340] cloudflared:$cf | meshcentral:$web"
          }
