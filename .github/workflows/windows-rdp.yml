name: Windows Cloud RDP

on:
  workflow_dispatch:

concurrency:
  group: windows-cloud-rdp
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PERSIST_BRANCH: persist/d-drive
      PERSIST_DIR: C:\rdp-persist

    steps:
      - name: 0. Persist helpers (7-Zip + save/restore scripts)
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path $env:PERSIST_DIR -Force | Out-Null

          if (-not (Test-Path 'C:\Program Files\7-Zip\7z.exe')) {
            choco install 7zip -y --no-progress
          }

          # GitHub Actions strips the common indent, so the here-string closers land at column 0.
          Set-Content -Path "$env:PERSIST_DIR\Ensure-DDrive.ps1" -Encoding UTF8 @'
          $ErrorActionPreference = 'Stop'
          if (Test-Path 'D:\') {
            Write-Host ">>> D: already present."
          } else {
            $root = 'C:\D_Drive'
            New-Item -ItemType Directory -Path $root -Force | Out-Null
            subst D: $root
            if (-not (Test-Path 'D:\')) { throw 'Failed to create D: (subst)' }
            Write-Host ">>> D: was missing on this runner. Mapped D: -> $root"
          }
          Set-Content -Path 'D:\README-PERSIST.txt' -Encoding UTF8 -Value 'Only D: is saved to repo branch persist/d-drive and restored next session. C: is wiped every run. Do not store files in D:\a (runner workspace, skipped). Auto-save on RDP disconnect, every 30 min, and when the job ends.'
          '@

          Set-Content -Path "$env:PERSIST_DIR\Git-Auth.ps1" -Encoding UTF8 @'
          # Configure git HTTPS auth for this process without printing the token.
          $token = $env:GITHUB_TOKEN
          if ([string]::IsNullOrEmpty($token)) { throw 'GITHUB_TOKEN is empty (need permissions: contents: write)' }
          $b64 = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$token"))
          git config --global --unset-all http.https://github.com/.extraheader 2>$null
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $b64"
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          '@

          Set-Content -Path "$env:PERSIST_DIR\Restore-DDrive.ps1" -Encoding UTF8 @'
          $ErrorActionPreference = 'Continue'
          Write-Host ">>> Restoring D: from repo branch $($env:PERSIST_BRANCH) ..."
          . "$env:PERSIST_DIR\Git-Auth.ps1"

          $work = Join-Path $env:PERSIST_DIR 'restore'
          if (Test-Path $work) { Remove-Item $work -Recurse -Force }
          $url = "https://github.com/$($env:GITHUB_REPOSITORY).git"

          $heads = git ls-remote --heads $url $env:PERSIST_BRANCH 2>$null
          if (-not $heads) {
            Write-Host ">>> No snapshot yet (first run). D: starts empty."
            exit 0
          }

          git clone --depth 1 --branch $env:PERSIST_BRANCH --single-branch $url $work
          if ($LASTEXITCODE -ne 0) {
            Write-Host ">>> WARN: clone of persist branch failed. Starting with empty D:."
            exit 0
          }

          $archive = Join-Path $work 'D-drive.7z'
          if (-not (Test-Path $archive)) {
            Write-Host ">>> Persist branch has no D-drive.7z. Starting with empty D:."
            exit 0
          }

          $7z = 'C:\Program Files\7-Zip\7z.exe'
          & $7z x $archive "-oD:\" -y
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 1) {
            Write-Host ">>> WARN: 7z extract returned $LASTEXITCODE"
            exit 0
          }
          Write-Host ">>> D: restored OK."
          '@

          Set-Content -Path "$env:PERSIST_DIR\Save-DDrive.ps1" -Encoding UTF8 @'
          $ErrorActionPreference = 'Stop'
          $lock = Join-Path $env:PERSIST_DIR 'save.lock'
          if (Test-Path $lock) {
            $ageMin = ((Get-Date) - (Get-Item $lock).LastWriteTime).TotalMinutes
            if ($ageMin -lt 25) {
              Write-Host ">>> Save already in progress. Skipping."
              exit 0
            }
          }
          New-Item $lock -Force | Out-Null
          try {
            if (-not (Test-Path 'D:\')) { throw 'D: not found' }
            . "$env:PERSIST_DIR\Git-Auth.ps1"

            $work = Join-Path $env:PERSIST_DIR 'work'
            if (Test-Path $work) { Remove-Item $work -Recurse -Force }
            New-Item $work -ItemType Directory -Force | Out-Null
            $archive = Join-Path $work 'D-drive.7z'
            $7z = 'C:\Program Files\7-Zip\7z.exe'

            Write-Host ">>> Packing D: (skipping D:\a runner workspace) ..."
            & $7z a -t7z -mx=1 -mmt=on -ssw -bso0 -bsp1 `
                $archive 'D:\*' `
                '-xr!a' '-xr!a\*' `
                '-xr!$RECYCLE.BIN' '-xr!$RECYCLE.BIN\*' `
                '-xr!System Volume Information' '-xr!System Volume Information\*' `
                '-xr!pagefile.sys' '-xr!swapfile.sys' '-xr!hiberfil.sys'
            # 7z exit 1 = warning (usually locked files) — still usable
            if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 1) {
              throw "7z failed with exit code $LASTEXITCODE"
            }
            if (-not (Test-Path $archive)) { throw 'Archive was not created' }

            $size = (Get-Item $archive).Length
            Write-Host (">>> Archive size: {0:N1} MB" -f ($size / 1MB))
            if ($size -gt (1.9GB)) {
              throw "Archive is $([math]::Round($size/1GB,2)) GB. GitHub LFS max is 2 GB. Delete files on D: and retry."
            }
            if ($size -lt 16) {
              Write-Host ">>> Archive is empty-ish. Still pushing so the next session gets a clean D:."
            }

            Push-Location $work
            git init -b $env:PERSIST_BRANCH | Out-Null
            git lfs install --local | Out-Null
            git lfs track "D-drive.7z" | Out-Null
            git add .gitattributes D-drive.7z
            git commit -m "D: snapshot $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')" | Out-Null
            git remote add origin "https://github.com/$($env:GITHUB_REPOSITORY).git"
            Write-Host ">>> Pushing snapshot to $($env:PERSIST_BRANCH) (force, single commit) ..."
            git push -f origin "HEAD:$($env:PERSIST_BRANCH)"
            if ($LASTEXITCODE -ne 0) { throw 'git push failed' }
            Pop-Location

            Set-Content -Path (Join-Path $env:PERSIST_DIR 'last-save.txt') -Value (Get-Date -Format o)
            Write-Host ">>> D: saved to repo branch $($env:PERSIST_BRANCH)."
          }
          finally {
            Remove-Item $lock -Force -ErrorAction SilentlyContinue
          }
          '@

          Write-Host ">>> Persist helpers ready."

      - name: 1. Enable RDP, Firewall, UDP Transport & Performance Tuning
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Enable-NetFirewallRule -Name "RemoteDesktop-UserMode-In-UDP" -ErrorAction SilentlyContinue
          Enable-NetFirewallRule -Name "RemoteDesktop-UserMode-In-TCP" -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

          $tsPol = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          New-Item -Path $tsPol -Force | Out-Null
          Set-ItemProperty -Path $tsPol -Name "SelectTransport" -Value 1 -Type DWord -Force
          Set-ItemProperty -Path $tsPol -Name "ColorDepth" -Value 24 -Type DWord -Force
          Set-ItemProperty -Path $tsPol -Name "fCompressionEnabled" -Value 1 -Type DWord -Force

          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c 2>$null
          Write-Host ">>> RDP enabled (UDP transport) + High Performance power plan." -ForegroundColor Green

      - name: 2. Create Admin Account
        run: |
          $Password = ConvertTo-SecureString "Cynet@2026" -AsPlainText -Force
          New-LocalUser -Name "CynetAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "CynetAdmin" -ErrorAction SilentlyContinue
          net user runneradmin Cynet@2026

      - name: 2b. Ensure D: exists + restore snapshot from repo
        run: |
          powershell -NoProfile -File "$env:PERSIST_DIR\Ensure-DDrive.ps1"
          powershell -NoProfile -File "$env:PERSIST_DIR\Restore-DDrive.ps1"

      - name: 3a. Cache Tailscale Installer (skip re-download every run)
        id: ts-cache
        uses: actions/cache@v4
        with:
          path: C:\tailscale.msi
          key: tailscale-msi-v1

      - name: 3b. Install & Connect Tailscale (optimized)
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ProgressPreference = 'SilentlyContinue'

          if (-not (Test-Path "C:\tailscale.msi")) {
            curl.exe -L --retry 3 --retry-delay 2 -o "C:\tailscale.msi" "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          }
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait

          $ts = "C:\Program Files\Tailscale\tailscale.exe"

          & $ts up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="github-rdp-server" `
                   --reset --ssh=false --accept-dns=false
          if ($LASTEXITCODE -ne 0) {
            Write-Host ">>> tailscale up FAILED (exit code $LASTEXITCODE)." -ForegroundColor Red
            Write-Host "    Check that TAILSCALE_AUTHKEY secret is set, valid and reusable:" -ForegroundColor Red
            Write-Host "    https://login.tailscale.com/admin/settings/keys" -ForegroundColor Red
            throw "Tailscale login failed - job aborted."
          }

          $ts_ip = $null
          for ($i = 1; $i -le 40; $i++) {
            $raw = (& $ts ip -4 2>$null | Select-Object -First 1)
            if ($raw) {
              $ts_ip = ([string]$raw).Trim()
              break
            }
            Start-Sleep -Milliseconds 500
          }

          if (-not $ts_ip) {
            try {
              $stSelf = & $ts status --json 2>$null | ConvertFrom-Json
              if ($stSelf.Self.TailscaleIPs) {
                $ts_ip = [string]$stSelf.Self.TailscaleIPs[0]
              }
            } catch { }
          }

          if (-not $ts_ip) {
            Write-Host ">>> WARN: Tailscale IP not assigned yet. Diagnostics:" -ForegroundColor Yellow
            & $ts status
            & $ts ip -4
          }

          $direct = $false
          try {
            $st = & $ts status --json 2>$null | ConvertFrom-Json
            $peer = $st.Peer.Values | Select-Object -First 1
            if ($peer) {
              $direct = [string]::IsNullOrEmpty([string]$peer.Relay)
              $derp  = if ($peer.Relay) { $peer.Relay } else { "direct (no relay)" }
            }
          } catch { }

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "  >>> RDP SERVER IS READY! <<<" -ForegroundColor Cyan
          Write-Host "  Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host "  Username     : CynetAdmin" -ForegroundColor Yellow
          Write-Host "  Password     : Cynet@2026" -ForegroundColor Yellow
          Write-Host "  Persist      : D:  <->  repo branch persist/d-drive" -ForegroundColor Yellow
          Write-Host "  Connection   : $derp" -ForegroundColor $(if ($direct) { "Green" } else { "Red" })
          if (-not $direct) {
            Write-Host "  WARN: relayed connection will be slow. Tips below." -ForegroundColor Red
          }
          Write-Host "  >> Open mstsc and connect to: $ts_ip" -ForegroundColor Magenta
          Write-Host "  >> Put YOUR files on D:  (C: is wiped every run)" -ForegroundColor Magenta
          Write-Host "==================================================" -ForegroundColor Green

          if (-not $direct) {
            Write-Host ""
            Write-Host ">>> HOW TO GET A DIRECT (FAST) CONNECTION <<<" -ForegroundColor Cyan
            Write-Host " 1. Install Tailscale on YOUR PC too and log into the same account (tailscale.com/download)"
            Write-Host " 2. Check 'tailscale status' on your PC - both machines should show 'direct'"
            Write-Host " 3. Relayed usually means: closed UDP port 41641, CGNAT, or strict corporate firewall"
            Write-Host " 4. On your PC: tailscale up --netfilter-mode=off  (removes firewall overhead)"
            Write-Host " 5. Restart the client: 'tailscale down' then 'tailscale up' to re-negotiate a direct path"
          }

      - name: 4. Install Python & Java (Adoptium Temurin 21)
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Write-Host ">>> Installing Python 3.12 ..." -ForegroundColor Cyan
          Invoke-WebRequest "https://www.python.org/ftp/python/3.12.3/python-3.12.3-amd64.exe" -OutFile "C:\python-installer.exe"
          Start-Process "C:\python-installer.exe" -ArgumentList "/quiet InstallAllUsers=1 PrependPath=1 Include_pip=1" -Wait
          Remove-Item "C:\python-installer.exe" -Force -ErrorAction SilentlyContinue

          Write-Host ">>> Installing Eclipse Adoptium Temurin JDK 21 (LTS) ..." -ForegroundColor Cyan
          Invoke-WebRequest "https://api.adoptium.net/v3/binary/latest/21/ga/windows/x64/jdk/hotspot/normal/eclipse" -OutFile "C:\jdk.msi"
          Start-Process msiexec -ArgumentList '/i C:\jdk.msi /quiet ADDLOCAL=FeatureMain,FeatureEnvironment,FeatureJarFileRunWith,FeatureJavaHome /norestart' -Wait
          Remove-Item "C:\jdk.msi" -Force -ErrorAction SilentlyContinue

          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "  >>> TOOLCHAIN SUMMARY <<<" -ForegroundColor Cyan
          $pyPath = (Get-Command python -ErrorAction SilentlyContinue).Source
          if ($pyPath) { Write-Host "  Python : $(& python --version) ($pyPath)" -ForegroundColor Yellow }
          else         { Write-Host "  Python : NOT FOUND on PATH" -ForegroundColor Red }
          $javaPath = (Get-Command java -ErrorAction SilentlyContinue).Source
          if ($javaPath) { Write-Host "  Java   : $(& java -version 2>&1 | Select-Object -First 1) ($javaPath)" -ForegroundColor Yellow }
          else         { Write-Host "  Java   : NOT FOUND on PATH" -ForegroundColor Red }
          Write-Host "  JAVA_HOME : $env:JAVA_HOME" -ForegroundColor Yellow
          Write-Host "==================================================" -ForegroundColor Green

      - name: 5. Keep Server Alive (6 Hours) + autosave D: on disconnect
        run: |
          function Get-RdpUserState {
            $lines = @(qwinsta 2>$null)
            foreach ($line in $lines) {
              if ($line -match 'CynetAdmin') {
                if ($line -match 'Active') { return 'Active' }
                if ($line -match 'Disc')   { return 'Disc' }
              }
            }
            return 'None'
          }

          $lastState = 'None'
          $lastSave  = Get-Date
          $interval  = [TimeSpan]::FromMinutes(30)

          for ($i = 1; $i -le 360; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "[$i/360] Server running..."

            $state = Get-RdpUserState
            $disconnected = ($lastState -eq 'Active' -and $state -ne 'Active')
            $due = ((Get-Date) - $lastSave) -ge $interval

            if ($disconnected -or $due) {
              if ($disconnected) {
                Write-Host ">>> RDP lost ($lastState -> $state). Saving D: to repo ..." -ForegroundColor Cyan
              } else {
                Write-Host ">>> Periodic autosave (30 min). Saving D: to repo ..." -ForegroundColor Cyan
              }
              try {
                powershell -NoProfile -File "$env:PERSIST_DIR\Save-DDrive.ps1"
                $lastSave = Get-Date
              } catch {
                Write-Host ">>> WARN: save failed: $($_.Exception.Message)" -ForegroundColor Yellow
              }
            }
            $lastState = $state
          }

      - name: 6. Save D: to repo (always — end, cancel, or timeout)
        if: always()
        run: |
          Write-Host ">>> Job ending. Final save of D: ..."
          powershell -NoProfile -File "$env:PERSIST_DIR\Save-DDrive.ps1"
