name: Windows Cloud RDP (localtonet)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      # ------------------------------------------------------------------
      # 1) روشن کردن Remote Desktop و باز کردن فایروال
      # ------------------------------------------------------------------
      - name: 1. Enable Remote Desktop & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

      # ------------------------------------------------------------------
      # 2) ساخت کاربر ادمین
      # ------------------------------------------------------------------
      - name: 2. Create Admin Account
        run: |
          $Password = ConvertTo-SecureString "Cynet@2026" -AsPlainText -Force
          New-LocalUser -Name "CynetAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "CynetAdmin" -ErrorAction SilentlyContinue

      # ------------------------------------------------------------------
      # 3) نصب localtonet + اجرای کلاینت + زنده نگه‌داشتن سرور
      #    (همه در یک مرحله، چون پروسه‌ی پس‌زمینه بین مرحله‌ها کشته می‌شود)
      #    تونل TCP باید از قبل در داشبورد ساخته شده باشد: 127.0.0.1:3389
      # ------------------------------------------------------------------
      - name: 3. Install localtonet, connect & keep alive
        env:
          LOCALTONET_AUTHTOKEN: ${{ secrets.LOCALTONET_AUTHTOKEN }}
        run: |
          # دانلود و استخراج باینری ویندوز ۶۴ بیتی
          Invoke-WebRequest "https://localtonet.com/download/localtonet-win-64.zip" -OutFile "C:\localtonet.zip"
          Expand-Archive "C:\localtonet.zip" -DestinationPath "C:\localtonet" -Force

          # اجرای کلاینت در پس‌زمینه (بدون نقل‌قول اضافه، تا توکن درست خوانده شود)
          $p = Start-Process -FilePath "C:\localtonet\localtonet.exe" `
                -ArgumentList @("--authtoken", $Env:LOCALTONET_AUTHTOKEN) `
                -WindowStyle Hidden -PassThru `
                -RedirectStandardOutput "C:\localtonet\out.log" `
                -RedirectStandardError "C:\localtonet\err.log"

          # کمی صبر تا کلاینت به تونل متصل شود
          Start-Sleep -Seconds 15

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "  >>> RDP SERVER IS READY <<<" -ForegroundColor Cyan
          Write-Host "  Username : CynetAdmin" -ForegroundColor Yellow
          Write-Host "  Password : Cynet@2026" -ForegroundColor Yellow
          Write-Host "  >>> Get the public address from localtonet" -ForegroundColor Magenta
          Write-Host "      DASHBOARD (e.g. 8o4v6zsgam.localto.net:PORT)." -ForegroundColor Magenta
          Write-Host "      Then run: mstsc -> that address" -ForegroundColor Magenta
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host ""
          Write-Host "--- localtonet client log ---"
          Get-Content "C:\localtonet\out.log" -ErrorAction SilentlyContinue

          # زنده نگه‌داشتن سرور: تا وقتی این مرحله ادامه دارد، تونل هم فعال است
          for ($i = 1; $i -le 999; $i++) {
            Start-Sleep -Seconds 60
            if ($p.HasExited) {
              Write-Host "[$i] WARNING: localtonet client exited!" -ForegroundColor Red
              Write-Host "--- out.log ---"
              Get-Content "C:\localtonet\out.log" -ErrorAction SilentlyContinue | Select-Object -Last 20
              Write-Host "--- err.log ---"
              Get-Content "C:\localtonet\err.log" -ErrorAction SilentlyContinue | Select-Object -Last 20
              break
            }
            Write-Host "[$i] Server running... tunnel active" -ForegroundColor Green
          }
