            }
            if ($remaining -eq 10) {
              Write-Host "  ⚠️  Session 3 ends in 10 min - Session 4 starts next!" -ForegroundColor Red
            }
          }
          Write-Host "[✓] Session 3 Complete!" -ForegroundColor Green

  # ============================================================
  # SESSION 4 - Hours 19-24
  # ============================================================
  session-4:
    needs: session-3
    if: always() && inputs.sessions >= '4'
    runs-on: windows-latest
    timeout-minutes: 360
    steps:

      - name: 🔧 System Info
        run: |
          Write-Host "╔══════════════════════════════════════════════════╗" -ForegroundColor Cyan
          Write-Host "║       WINDOWS CLOUD RDP - SESSION 4 / 6         ║" -ForegroundColor Cyan
          Write-Host "║       Hours 19 - 24                              ║" -ForegroundColor Cyan
