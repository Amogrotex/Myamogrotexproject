          Start-Process msiexec -ArgumentList "/i $Env:TEMP\tailscale.msi /quiet /norestart" -Wait
          Start-Sleep -Seconds 5

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"
          & $tailscale up --authkey="$Env:TAILSCALE_AUTHKEY" `
            --hostname="${{ github.event.inputs.hostname }}-s3-${{ github.run_id }}" --shields-up=false

          Start-Sleep -Seconds 8
          $ts_ip = & $tailscale ip -4
          echo "TAILSCALE_IP=$ts_ip" >> $Env:GITHUB_ENV

          Write-Host ""
          Write-Host "╔══════════════════════════════════════════════════╗" -ForegroundColor Green
          Write-Host "║         ✅ SESSION 3 READY TO CONNECT            ║" -ForegroundColor Green
          Write-Host "╠══════════════════════════════════════════════════╣" -ForegroundColor Green
          Write-Host "║  IP       : $ts_ip" -ForegroundColor Yellow
          Write-Host "║  Username : ${{ github.event.inputs.rdp_username }}" -ForegroundColor Yellow
          Write-Host "║  Connect  : mstsc /v:$ts_ip" -ForegroundColor Cyan
          Write-Host "║  Session  : 3 / 6  (Hours 13-18)                 ║" -ForegroundColor Magenta
          Write-Host "╚══════════════════════════════════════════════════╝" -ForegroundColor Green

      - name: ⏳ Keep Alive - Session 3 (6 Hours)
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          echo "::add-mask::$Env:TAILSCALE_AUTHKEY"
          $tailscale    = "C:\Program Files\Tailscale\tailscale.exe"
          $totalMinutes = 355

          for ($i = 1; $i -le $totalMinutes; $i++) {
            Start-Sleep -Seconds 60
            $remaining = $totalMinutes - $i
            $percent   = [math]::Round(($i / $totalMinutes) * 100)
            $filled    = [math]::Round($percent / 5)
            $bar       = ("█" * $filled) + ("░" * (20 - $filled))
            Write-Host "  S3 | [$bar] $percent% | ${i}m elapsed | ${remaining}m left" -ForegroundColor Cyan

            if ($i % 15 -eq 0) {
              $svc = Get-Service "TermService" -ErrorAction SilentlyContinue
              if ($svc.Status -ne "Running") { Start-Service "TermService" }
              try {
                $status = & $tailscale status --json | ConvertFrom-Json
                if ($status.BackendState -ne "Running") {
                  & $tailscale up --authkey="$Env:TAILSCALE_AUTHKEY" --shields-up=false
                } else {
                  Write-Host "  [✓] Tailscale OK: $(& $tailscale ip -4)" -ForegroundColor Green
                }
              } catch {}
              $cpu = (Get-WmiObject Win32_Processor).LoadPercentage
