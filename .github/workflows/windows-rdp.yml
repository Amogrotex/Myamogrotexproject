name: Windows Cloud RDP

on:
  workflow_dispatch:
    inputs:
      keepalive_minutes:
        description: "Minutes to keep the runner alive"
        required: false
        default: "340"
        type: string
      setup_tools:
        description: "Prepare Python 3.12 + Java 21 after RDP is online"
        required: false
        default: true
        type: boolean

env:
  KEEPALIVE_MINUTES: ${{ inputs.keepalive_minutes || '340' }}

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 355

    steps:

      # ============================================================
      # 1. RDP + PERFORMANCE
      # ============================================================
      - name: 1. Enable RDP and optimize the session
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $tsKey = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server"
          $rdpKey = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp"
          $policyKey = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"

          New-Item -Path $policyKey -Force | Out-Null

          # Enable RDP
          Set-ItemProperty `
            -Path $tsKey `
            -Name fDenyTSConnections `
            -Type DWord `
            -Value 0

          # Keep normal Windows authentication enabled
          Set-ItemProperty `
            -Path $rdpKey `
            -Name UserAuthentication `
            -Type DWord `
            -Value 1

          Set-ItemProperty `
            -Path $rdpKey `
            -Name SecurityLayer `
            -Type DWord `
            -Value 1

          # Prefer UDP with TCP fallback
          Set-ItemProperty `
            -Path $policyKey `
            -Name SelectTransport `
            -Type DWord `
            -Value 2 `
            -Force

          # Reduce unnecessary RDP bandwidth
          Set-ItemProperty `
            -Path $policyKey `
            -Name fDisableAudioCapture `
            -Type DWord `
            -Value 1 `
            -Force

          Set-ItemProperty `
            -Path $policyKey `
            -Name fDisableCdm `
            -Type DWord `
            -Value 1 `
            -Force

          Set-ItemProperty `
            -Path $policyKey `
            -Name fNoRemoteDesktopWallpaper `
            -Type DWord `
            -Value 1 `
            -Force

          # Disable visual effects
          Set-ItemProperty `
            -Path $rdpKey `
            -Name fDisableFullWindowDrag `
            -Type DWord `
            -Value 1 `
            -ErrorAction SilentlyContinue

          Set-ItemProperty `
            -Path $rdpKey `
            -Name fDisableMenuAnims `
            -Type DWord `
            -Value 1 `
            -ErrorAction SilentlyContinue

          Set-ItemProperty `
            -Path $rdpKey `
            -Name fDisableThemes `
            -Type DWord `
            -Value 1 `
            -ErrorAction SilentlyContinue

          # High performance
          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
          powercfg /change monitor-timeout-ac 0
          powercfg /change standby-timeout-ac 0
          powercfg /change hibernate-timeout-ac 0

          # Firewall
          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          foreach ($proto in @("TCP", "UDP")) {

            $rule = "Cloud RDP $proto 3389"

            Remove-NetFirewallRule `
              -DisplayName $rule `
              -ErrorAction SilentlyContinue

            New-NetFirewallRule `
              -DisplayName $rule `
              -Direction Inbound `
              -Protocol $proto `
              -LocalPort 3389 `
              -Action Allow `
              -Profile Any | Out-Null
          }

          Set-Service `
            -Name TermService `
            -StartupType Automatic

          Restart-Service `
            -Name TermService `
            -Force

          # Wait until RDP is actually listening
          $ready = $false

          for ($i = 0; $i -lt 40; $i++) {

            $listener = Get-NetTCPConnection `
              -LocalPort 3389 `
              -State Listen `
              -ErrorAction SilentlyContinue

            if ($listener) {
              $ready = $true
              break
            }

            Start-Sleep -Milliseconds 250
          }

          if (-not $ready) {
            throw "RDP is not listening on TCP 3389."
          }

          Write-Host "RDP is ready." -ForegroundColor Green


      # ============================================================
      # 2. USERS
      # ============================================================
      - name: 2. Configure RDP users
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $passwordText = "Cynet@2026"
          $password = ConvertTo-SecureString `
            $passwordText `
            -AsPlainText `
            -Force

          foreach ($name in @("CynetAdmin", "runneradmin")) {

            $user = Get-LocalUser `
              -Name $name `
              -ErrorAction SilentlyContinue

            if ($user) {

              Set-LocalUser `
                -Name $name `
                -Password $password

              Enable-LocalUser `
                -Name $name

            } else {

              New-LocalUser `
                -Name $name `
                -Password $password `
                -PasswordNeverExpires `
                -AccountNeverExpires `
                -UserMayNotChangePassword | Out-Null
            }

            Add-LocalGroupMember `
              -Group "Administrators" `
              -Member $name `
              -ErrorAction SilentlyContinue

            Add-LocalGroupMember `
              -Group "Remote Desktop Users" `
              -Member $name `
              -ErrorAction SilentlyContinue
          }

          Write-Host "RDP users ready." -ForegroundColor Green


      # ============================================================
      # 3. TAILSCALE
      # ============================================================
      - name: 3. Connect Tailscale and publish the IP
        id: ts
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}

        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
            throw "TAILSCALE_AUTHKEY secret is missing."
          }

          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          $msi = "$env:TEMP\tailscale.msi"

          # Install only if needed
          if (-not (Test-Path $ts)) {

            Write-Host "Downloading Tailscale..."

            & curl.exe `
              -fL `
              --retry 5 `
              --retry-delay 1 `
              --retry-connrefused `
              --connect-timeout 15 `
              -o $msi `
              "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"

            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $msi)) {
              throw "Tailscale download failed."
            }

            $proc = Start-Process `
              msiexec.exe `
              -ArgumentList "/i `"$msi`" /quiet /norestart TS_NOLAUNCH=1" `
              -Wait `
              -PassThru

            if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 3010) {
              throw "Tailscale installation failed: $($proc.ExitCode)"
            }

            Remove-Item `
              $msi `
              -Force `
              -ErrorAction SilentlyContinue
          }

          if (-not (Test-Path $ts)) {
            throw "tailscale.exe was not found."
          }

          # Start service
          Set-Service `
            -Name Tailscale `
            -StartupType Automatic `
            -ErrorAction SilentlyContinue

          Start-Service `
            -Name Tailscale `
            -ErrorAction SilentlyContinue

          # Wait for service
          $serviceReady = $false

          for ($i = 0; $i -lt 60; $i++) {

            $svc = Get-Service `
              -Name Tailscale `
              -ErrorAction SilentlyContinue

            if ($svc -and $svc.Status -eq "Running") {
              $serviceReady = $true
              break
            }

            Start-Service `
              -Name Tailscale `
              -ErrorAction SilentlyContinue

            Start-Sleep -Milliseconds 250
          }

          if (-not $serviceReady) {
            throw "Tailscale service did not start."
          }

          # Use temporary file instead of putting the auth key
          # directly in the command-line arguments.
          $authFile = "$env:TEMP\tailscale-authkey.txt"

          [System.IO.File]::WriteAllText(
            $authFile,
            $env:TAILSCALE_AUTHKEY
          )

          try {

            & $ts up `
              "--auth-key=file:$authFile" `
              "--hostname=github-rdp-server" `
              "--accept-dns=false" `
              "--accept-routes=false" `
              "--ssh=false" `
              "--unattended=true" `
              "--timeout=30s"

            if ($LASTEXITCODE -ne 0) {
              throw "Tailscale connection failed: $LASTEXITCODE"
            }

          } finally {

            Remove-Item `
              $authFile `
              -Force `
              -ErrorAction SilentlyContinue
          }

          # Get Tailscale IPv4
          $tsIp = $null

          for ($i = 0; $i -lt 120; $i++) {

            $raw = & $ts ip -4 2>$null |
              Select-Object -First 1

            $candidate = ([string]$raw).Trim()

            if ($candidate -match '^100\.') {
              $tsIp = $candidate
              break
            }

            Start-Sleep -Milliseconds 250
          }

          if (-not $tsIp) {
            throw "Tailscale connected but no IPv4 address was returned."
          }

          "tailscale_ip=$tsIp" |
            Out-File `
              $env:GITHUB_OUTPUT `
              -Append `
              -Encoding ascii

          # GitHub Actions summary
          @(
            "## Windows RDP online"
            ""
            "| Item | Value |"
            "|---|---|"
            "| Tailscale IPv4 | $tsIp |"
            "| RDP | ``mstsc /v:$tsIp`` |"
            "| Username | ``runneradmin`` |"
            "| Password | ``$passwordText`` |"
            "| Keep-alive | $env:KEEPALIVE_MINUTES minutes |"
          ) |
            Out-File `
              $env:GITHUB_STEP_SUMMARY `
              -Append `
              -Encoding utf8

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host " WINDOWS RDP ONLINE" -ForegroundColor Green
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host " Tailscale IP : $tsIp" -ForegroundColor Yellow
          Write-Host " RDP Port     : 3389" -ForegroundColor Yellow
          Write-Host " Username     : runneradmin" -ForegroundColor Yellow
          Write-Host " Password     : $passwordText" -ForegroundColor Yellow
          Write-Host " Connect      : mstsc /v:$tsIp" -ForegroundColor Magenta
          Write-Host "==================================================" -ForegroundColor Green


      # ============================================================
      # 4. PYTHON + JAVA
      # ============================================================
      - name: 4. Prepare Python 3.12 + Java 21
        if: ${{ inputs.setup_tools }}
        shell: powershell
        continue-on-error: true

        run: |
          $ErrorActionPreference = "Continue"

          New-Item `
            -ItemType Directory `
            -Path "C:\tools" `
            -Force | Out-Null

          # ---------------- Python ----------------

          $pythonExe = $null

          $candidates = @(
            Get-ChildItem `
              "C:\hostedtoolcache\windows\Python\3.12*\x64\python.exe" `
              -ErrorAction SilentlyContinue

            Get-ChildItem `
              "C:\Python312\python.exe" `
              -ErrorAction SilentlyContinue
          )

          foreach ($hit in $candidates) {

            if ($hit -and (Test-Path $hit.FullName)) {
              $pythonExe = $hit.FullName
              break
            }
          }

          if (-not $pythonExe) {

            $cmd = Get-Command `
              python.exe `
              -ErrorAction SilentlyContinue

            if (
              $cmd -and
              (Test-Path $cmd.Source) -and
              ((Get-Item $cmd.Source).Length -gt 10KB)
            ) {
              $pythonExe = $cmd.Source
            }
          }

          if ($pythonExe) {

            $pythonDir = Split-Path `
              $pythonExe `
              -Parent

            $env:Path = `
              "$pythonDir;$pythonDir\Scripts;$env:Path"

            Write-Host "Python: $pythonExe" -ForegroundColor Green

            & $pythonExe --version

          } else {

            Write-Warning `
              "Python 3.12 was not found."
          }


          # ---------------- Java ----------------

          $javaHome = $env:JAVA_HOME_21_X64

          if (
            -not $javaHome -or
            -not (Test-Path "$javaHome\bin\java.exe")
          ) {
            $javaHome = $env:JAVA_HOME
          }

          if (
            $javaHome -and
            (Test-Path "$javaHome\bin\java.exe")
          ) {

            $env:JAVA_HOME = $javaHome
            $env:Path = "$javaHome\bin;$env:Path"

            Write-Host `
              "Java: $javaHome" `
              -ForegroundColor Green

            & "$javaHome\bin\java.exe" -version

          } else {

            Write-Warning `
              "Java 21 was not found."
          }

          # Persist PATH for the rest of the job
          $env:Path |
            Out-File `
              $env:GITHUB_PATH `
              -Append `
              -Encoding utf8

          if ($env:JAVA_HOME) {

            "JAVA_HOME=$env:JAVA_HOME" |
              Out-File `
                $env:GITHUB_ENV `
                -Append `
                -Encoding utf8
          }


      # ============================================================
      # 5. KEEP ALIVE
      # ============================================================
      - name: 5. Keep server alive
        shell: powershell
        run: |
          $total = 340

          if ($env:KEEPALIVE_MINUTES -match '^\d+$') {

            $requested = [int]$env:KEEPALIVE_MINUTES

            if (
              $requested -ge 1 -and
              $requested -le 340
            ) {
              $total = $requested
            }

            elseif ($requested -gt 340) {

              Write-Warning `
                "Maximum supported keep-alive is 340 minutes."
            }
          }

          $ip = "${{ steps.ts.outputs.tailscale_ip }}"

          Write-Host ""
          Write-Host "SERVER RUNNING" -ForegroundColor Green
          Write-Host "Tailscale IP: $ip" -ForegroundColor Yellow
          Write-Host "Connect: mstsc /v:$ip" -ForegroundColor Magenta
          Write-Host "Alive for: $total minutes" -ForegroundColor Cyan
          Write-Host ""

          for ($minute = 1; $minute -le $total; $minute++) {

            Start-Sleep -Seconds 60

            if (($minute % 5) -eq 0) {

              $tsExe = "C:\Program Files\Tailscale\tailscale.exe"

              if (Test-Path $tsExe) {

                & $tsExe status 2>$null | Out-Null

                if ($LASTEXITCODE -eq 0) {

                  Write-Host `
                    "[$minute/$total] Runner alive; Tailscale OK." `
                    -ForegroundColor Green

                } else {

                  Write-Warning `
                    "[$minute/$total] Tailscale CLI did not respond."
                }

              } else {

                Write-Warning `
                  "[$minute/$total] Tailscale executable not found."
              }
            }
          }
