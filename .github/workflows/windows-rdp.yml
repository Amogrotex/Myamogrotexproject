          Write-Host "╠══════════════════════════════════════════════════╣" -ForegroundColor Green
          Write-Host "║  IP       : $ts_ip" -ForegroundColor Yellow
          Write-Host "║  Username : ${{ github.event.inputs.rdp_username }}" -ForegroundColor Yellow
          Write-Host "║  Connect  : mstsc /v:$ts_ip" -ForegroundColor Cyan
          Write-Host "║  Session  : 4 / 6  (Hours 19-24)                 ║" -ForegroundColor Magenta
          Write-Host "╚══════════════════════════════════════════════════╝" -ForegroundColor Green

      - name: ⏳ Keep Alive - Session 4 (6 Hours)
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          echo "::add-mask::$Env:TAILSCALE_AUTHKEY"
          $tailscale    = "C:\Program Files\Tailscale\tailscale.exe"
          $totalMinutes = 355

          for ($i = 1; $i -le $totalMinutes; $i++) {
            Start-Sleep -Seconds 60
            $remaining = $totalMinutes - $i
            $percent   = [math]::Round(($i / $totalMinutes) * 100)
            $filled    = [math]::Round($percent / 5)
            $bar       = ("█" * $filled) + ("░" * (20 - $filled))
            Write-Host "  S4 | [$bar] $percent% | ${i}m elapsed | ${remaining}m left" -ForegroundColor Cyan

            if ($i % 15 -eq 0) {
              $svc = Get-Service "TermService" -ErrorAction SilentlyContinue
              if ($svc.Status -ne "Running") { Start-Service "TermService" }
              try {
                $status = & $tailscale status --json | ConvertFrom-Json
                if ($status.BackendState -ne "Running") {
                  & $tailscale up --authkey="$Env:TAILSCALE_AUTHKEY" --shields-up=false
                } else {
                  Write-Host "  [✓] Tailscale OK: $(& $tailscale ip -4)" -ForegroundColor Green
                }
              } catch {}
              $cpu = (Get-WmiObject Win32_Processor).LoadPercentage
              $ram = [math]::Round((Get-WmiObject Win32_OperatingSystem).FreePhysicalMemory / 1MB, 1)
              Write-Host "  [📊] CPU: $cpu% | Free RAM: ${ram}GB" -ForegroundColor Gray
            }
            if ($remaining -eq 10) {
              Write-Host "  ⚠️  Session 4 ends in 10 min - Session 5 starts next!" -ForegroundColor Red
            }
          }
          Write-Host "[✓] Session 4 Complete!" -ForegroundColor Green

  # ============================================================
  # SESSION 5 - Hours 25-30
  # ============================================================
  session-5:
    needs: session-4
    if: always() && inputs.sessions >= '5'
    runs-on: windows-latest
    timeout-minutes: 360
    steps:

      - name: 🔧 System Info
        run: |
          Write-Host "╔══════════════════════════════════════════════════╗" -ForegroundColor Cyan
          Write-Host "║       WINDOWS CLOUD RDP - SESSION 5 / 6         ║" -ForegroundColor Cyan
          Write-Host "║       Hours 25 - 30                              ║" -ForegroundColor Cyan
          Write-Host "╚══════════════════════════════════════════════════╝" -ForegroundColor Cyan

      - name: 🖥️ Enable Remote Desktop
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fSingleSessionPerUser" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Write-Host "[✓] Remote Desktop ENABLED" -ForegroundColor Green

      - name: 👤 Create Admin User
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
          RDP_USERNAME: ${{ github.event.inputs.rdp_username }}
        run: |
          echo "::add-mask::$Env:RDP_PASSWORD"
          $securePass = ConvertTo-SecureString $Env:RDP_PASSWORD -AsPlainText -Force
          New-LocalUser -Name $Env:RDP_USERNAME -Password $securePass -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member $Env:RDP_USERNAME -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $Env:RDP_USERNAME -ErrorAction SilentlyContinue
          net user runneradmin $Env:RDP_PASSWORD 2>$null
          Write-Host "[✓] User configured" -ForegroundColor Green

      - name: 🌐 Install & Connect Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          echo "::add-mask::$Env:TAILSCALE_AUTHKEY"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile "$Env:TEMP\tailscale.msi" -UseBasicParsing
          Start-Process msiexec -ArgumentList "/i $Env:TEMP\tailscale.msi /quiet /norestart" -Wait
          Start-Sleep -Seconds 5

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"
          & $tailscale up --authkey="$Env:TAILSCALE_AUTHKEY" `
            --hostname="${{ github.event.inputs.hostname }}-s5-${{ github.run_id }}" --shields-up=false

          Start-Sleep -Seconds 8
          $ts_ip = & $tailscale ip -4
          echo "TAILSCALE_IP=$ts_ip" >> $Env:GITHUB_ENV

          Write-Host ""
          Write-Host "╔══════════════════════════════════════════════════╗" -ForegroundColor Green
          Write-Host "║         ✅ SESSION 5 READY TO CONNECT            ║" -ForegroundColor Green
          Write-Host "╠══════════════════════════════════════════════════╣" -ForegroundColor Green
          Write-Host "║  IP       : $ts_ip" -ForegroundColor Yellow
          Write-Host "║  Username : ${{ github.event.inputs.rdp_username }}" -ForegroundColor Yellow
          Write-Host "║  Connect  : mstsc /v:$ts_ip" -ForegroundColor Cyan
          Write-Host "║  Session  : 5 / 6  (Hours 25-30)                 ║" -ForegroundColor Magenta
          Write-Host "╚══════════════════════════════════════════════════╝" -ForegroundColor Green

      - name: ⏳ Keep Alive - Session 5 (6 Hours)
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          echo "::add-mask::$Env:TAILSCALE_AUTHKEY"
          $tailscale    = "C:\Program Files\Tailscale\tailscale.exe"
          $totalMinutes = 355

          for ($i = 1; $i -le $totalMinutes; $i++) {
            Start-Sleep -Seconds 60
            $remaining = $totalMinutes - $i
            $percent   = [math]::Round(($i / $totalMinutes) * 100)
            $filled    = [math]::Round($percent / 5)
            $bar       = ("█" * $filled) + ("░" * (20 - $filled))
            Write-Host "  S5 | [$bar] $percent% | ${i}m elapsed | ${remaining}m left" -ForegroundColor Cyan

            if ($i % 15 -eq 0) {
              $svc = Get-Service "TermService" -ErrorAction SilentlyContinue
              if ($svc.Status -ne "Running") { Start-Service "TermService" }
              try {
                $status = & $tailscale status --json | ConvertFrom-Json
                if ($status.BackendState -ne "Running") {
                  & $tailscale up --authkey="$Env:TAILSCALE_AUTHKEY" --shields-up=false
                } else {
                  Write-Host "  [✓] Tailscale OK: $(& $tailscale ip -4)" -ForegroundColor Green
                }
              } catch {}
              $cpu = (Get-WmiObject Win32_Processor).LoadPercentage
              $ram = [math]::Round((Get-WmiObject Win32_OperatingSystem).FreePhysicalMemory / 1MB, 1)
              Write-Host "  [📊] CPU: $cpu% | Free RAM: ${ram}GB" -ForegroundColor Gray
            }
            if ($remaining -eq 10) {
              Write-Host "  ⚠️  Session 5 ends in 10 min - Session 6 starts next!" -ForegroundColor Red
            }
          }
          Write-Host "[✓] Session 5 Complete!" -ForegroundColor Green

  # ============================================================
  # SESSION 6 - Hours 31-36
  # ============================================================
  session-6:
    needs: session-5
    if: always() && inputs.sessions >= '6'
    runs-on: windows-latest
    timeout-minutes: 360
    steps:

      - name: 🔧 System Info
        run: |
          Write-Host "╔══════════════════════════════════════════════════╗" -ForegroundColor Cyan
          Write-Host "║       WINDOWS CLOUD RDP - SESSION 6 / 6         ║" -ForegroundColor Cyan
          Write-Host "║       Hours 31 - 36  *** FINAL SESSION ***       ║" -ForegroundColor Cyan
          Write-Host "╚══════════════════════════════════════════════════╝" -ForegroundColor Cyan

      - name: 🖥️ Enable Remote Desktop
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fSingleSessionPerUser" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Write-Host "[✓] Remote Desktop ENABLED" -ForegroundColor Green

      - name: 👤 Create Admin User
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
          RDP_USERNAME: ${{ github.event.inputs.rdp_username }}
        run: |
          echo "::add-mask::$Env:RDP_PASSWORD"
          $securePass = ConvertTo-SecureString $Env:RDP_PASSWORD -AsPlainText -Force
          New-LocalUser -Name $Env:RDP_USERNAME -Password $securePass -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member $Env:RDP_USERNAME -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $Env:RDP_USERNAME -ErrorAction SilentlyContinue
          net user runneradmin $Env:RDP_PASSWORD 2>$null
          Write-Host "[✓] User configured" -ForegroundColor Green

      - name: 🌐 Install & Connect Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          echo "::add-mask::$Env:TAILSCALE_AUTHKEY"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile "$Env:TEMP\tailscale.msi" -UseBasicParsing
          Start-Process msiexec -ArgumentList "/i $Env:TEMP\tailscale.msi /quiet /norestart" -Wait
          Start-Sleep -Seconds 5

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"
          & $tailscale up --authkey="$Env:TAILSCALE_AUTHKEY" `
            --hostname="${{ github.event.inputs.hostname }}-s6-${{ github.run_id }}" --shields-up=false

          Start-Sleep -Seconds 8
          $ts_ip = & $tailscale ip -4
          echo "TAILSCALE_IP=$ts_ip" >> $Env:GITHUB_ENV

          Write-Host ""
          Write-Host "╔══════════════════════════════════════════════════╗" -ForegroundColor Green
          Write-Host "║     ✅ SESSION 6 (FINAL) READY TO CONNECT        ║" -ForegroundColor Green
          Write-Host "╠══════════════════════════════════════════════════╣" -ForegroundColor Green
          Write-Host "║  IP       : $ts_ip" -ForegroundColor Yellow
          Write-Host "║  Username : ${{ github.event.inputs.rdp_username }}" -ForegroundColor Yellow
          Write-Host "║  Connect  : mstsc /v:$ts_ip" -ForegroundColor Cyan
          Write-Host "║  Session  : 6 / 6  (Hours 31-36) FINAL           ║" -ForegroundColor Magenta
          Write-Host "╚══════════════════════════════════════════════════╝" -ForegroundColor Green

      - name: ⏳ Keep Alive - Session 6 (6 Hours)
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          echo "::add-mask::$Env:TAILSCALE_AUTHKEY"
          $tailscale    = "C:\Program Files\Tailscale\tailscale.exe"
          $totalMinutes = 355

          for ($i = 1; $i -le $totalMinutes; $i++) {
            Start-Sleep -Seconds 60
            $remaining = $totalMinutes - $i
            $percent   = [math]::Round(($i / $totalMinutes) * 100)
            $filled    = [math]::Round($percent / 5)
            $bar       = ("█" * $filled) + ("░" * (20 - $filled))
            Write-Host "  S6 | [$bar] $percent% | ${i}m elapsed | ${remaining}m left" -ForegroundColor Cyan

            if ($i % 15 -eq 0) {
              $svc = Get-Service "TermService" -ErrorAction SilentlyContinue
              if ($svc.Status -ne "Running") { Start-Service "TermService" }
              try {
                $status = & $tailscale status --json | ConvertFrom-Json
                if ($status.BackendState -ne "Running") {
                  & $tailscale up --authkey="$Env:TAILSCALE_AUTHKEY" --shields-up=false
                } else {
                  Write-Host "  [✓] Tailscale OK: $(& $tailscale ip -4)" -ForegroundColor Green
                }
              } catch {}
              $cpu = (Get-WmiObject Win32_Processor).LoadPercentage
              $ram = [math]::Round((Get-WmiObject Win32_OperatingSystem).FreePhysicalMemory / 1MB, 1)
              Write-Host "  [📊] CPU: $cpu% | Free RAM: ${ram}GB" -ForegroundColor Gray
            }
            if ($remaining -eq 10) {
              Write-Host "  🏁 FINAL SESSION ends in 10 minutes!" -ForegroundColor Red
            }
          }
          Write-Host ""
          Write-Host "[✓] ALL 6 SESSIONS COMPLETE - 36 HOURS TOTAL!" -ForegroundColor Green

  # ============================================================
  # SUMMARY
  # ============================================================
  summary:
    needs: [session-1, session-2, session-3, session-4, session-5, session-6]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 📊 Final Summary
        run: |
          echo "╔══════════════════════════════════════╗"
          echo "║         RDP SESSION COMPLETE         ║"
          echo "╠══════════════════════════════════════╣"
          echo "║  Total Runtime : 36 Hours            ║"
          echo "║  Sessions      : 6 x 6 Hours         ║"
          echo "║  Run ID        : ${{ github.run_id }} ║"
          echo "╚══════════════════════════════════════╝"
