# =============================================================================
#  Windows RDP - Chrome Remote Desktop (FASTEST, no VPN, no tunnel)
# =============================================================================
#  Why this one:
#   - No VPN, no Cloudflare, no ngrok, no tokens. Google's own protocol (VP9)
#     + global relay network. Usually the fastest option for GitHub Actions.
#   - Access from ANY browser: https://remotedesktop.google.com/access
#     (or the Chrome Remote Desktop app on Windows/Android/iOS).
#   - Nothing to rate-limit or time out like trycloudflare tunnels.
#
#  ONE-TIME SETUP PER RUN (2 minutes):
#   1. Go to https://remotedesktop.google.com/headless in any browser,
#      sign in with YOUR Google account -> Begin -> Next -> Authorize.
#   2. On the next page switch to the "Windows" commands and COPY the
#      code inside --code="..."  (looks like 4/0AfXXXX...)
#   3. In this repo: Settings -> Secrets and variables -> Actions ->
#      New repository secret:  name = CRD_CODE,  value = the code.
#   4. IMMEDIATELY go to Actions -> run this workflow (the code expires
#      after ~5-10 minutes and is single-use).
#   5. Open the job log -> step 3 banner confirms "Machine: github-rdp".
#      Go to https://remotedesktop.google.com/access -> connect to
#      "github-rdp" with PIN 123456.
#
#  NOTE: GitHub's ToS says Actions is for CI/CD only. GitHub has been
#  disabling Actions on repositories used as free RDP hosts. Use a
#  private repo and don't expect this to live forever. Max run = 6 hours.
# =============================================================================

name: Windows RDP (Chrome Remote Desktop - no VPN)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360   # GitHub-hosted maximum (6 hours)

    steps:
      - name: 1. Install Chrome Remote Desktop host
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $msi = "C:\crd-host.msi"
          if (-not (Test-Path $msi)) {
            curl.exe -sL --retry 3 -o $msi "https://dl.google.com/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi"
          }
          Start-Process msiexec -ArgumentList "/i $msi /qn /norestart" -Wait
          Write-Host ">>> Chrome Remote Desktop host installed." -ForegroundColor Green

      - name: 2. Register this machine with your Google account
        env:
          CRD_CODE: ${{ secrets.CRD_CODE }}
        run: |
          if (-not $env:CRD_CODE -or $env:CRD_CODE -notlike "4/*") {
            throw "Secret CRD_CODE is missing or invalid. Get it at https://remotedesktop.google.com/headless (see comments at top of this file), save it as repo secret CRD_CODE, then re-run."
          }

          $hostExe = "$env:ProgramFiles(x86)\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"
          if (-not (Test-Path $hostExe)) { throw "remoting_start_host.exe not found - step 1 failed?" }

          # --pin is an undocumented but working flag (min 6 digits)
          & $hostExe --code="$env:CRD_CODE" `
                     --redirect-url="https://remotedesktop.google.com/_/oauthredirect" `
                     --name="github-rdp" --pin=123456
          Start-Sleep -Seconds 10

          $svc = Get-Service chromoting -ErrorAction SilentlyContinue
          if (-not $svc -or $svc.Status -ne 'Running') {
            Write-Host ">>> Warning: chromoting service not running yet. State: $($svc.Status)" -ForegroundColor Yellow
            Start-Service chromoting -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 5
            $svc = Get-Service chromoting -ErrorAction SilentlyContinue
          }
          Write-Host ""
          Write-Host "==============================================================" -ForegroundColor Green
          Write-Host "   >>> CHROME REMOTE DESKTOP IS READY <<<" -ForegroundColor Cyan
          Write-Host ""
          Write-Host "   Open in ANY browser:  https://remotedesktop.google.com/access" -ForegroundColor Yellow
          Write-Host "   Machine name : github-rdp" -ForegroundColor Yellow
          Write-Host "   PIN           : 123456" -ForegroundColor Yellow
          Write-Host "   Service state : $($svc.Status)" -ForegroundColor $(if ($svc.Status -eq 'Running') { "Green" } else { "Red" })
          Write-Host "==============================================================" -ForegroundColor Green

      - name: 3. Keep server alive (up to ~6h) + watchdog
        run: |
          Write-Host ">>> Keeping the runner alive. Do NOT cancel this job while you are connected."
          Write-Host ">>> GitHub kills the machine 6 hours after start - the session dies with it."
          $started = (Get-Date).ToUniversalTime().ToString("HH:mm 'UTC'")
          Write-Host ">>> Run started at $started"
          for ($i = 1; $i -le 348; $i++) {
            $svc = Get-Service chromoting -ErrorAction SilentlyContinue
            if (-not $svc) {
              Write-Host "[$i/348] chromoting service MISSING - trying to re-register? Check step 2 logs." -ForegroundColor Red
            } elseif ($svc.Status -ne 'Running') {
              Write-Host "[$i/348] chromoting stopped - restarting ..." -ForegroundColor Yellow
              Start-Service chromoting -ErrorAction SilentlyContinue
            } else {
              Write-Host "[$i/348] chromoting RUNNING - you can connect at remotedesktop.google.com/access"
            }
            Start-Sleep -Seconds 60
          }
          Write-Host ">>> Time's up - job ending, machine is gone. Re-run for a new session." -ForegroundColor Yellow
