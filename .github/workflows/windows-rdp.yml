name: 🖥️ Windows Cloud RDP - Extended

on:
  workflow_dispatch:
    inputs:
      sessions:
        description: 'Number of 6-hour sessions (max 6 = 36hrs)'
        required: true
        default: '6'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'
      hostname:
        description: 'Tailscale hostname'
        required: true
        default: 'github-rdp'
      rdp_username:
        description: 'RDP Username'
        required: true
        default: 'CloudAdmin'

jobs:
  # ============================================================
  # SESSION 1 - Hours 1-6
  # ============================================================
  session-1:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:

      - name: 🔧 System Info
        run: |
          Write-Host ""
          Write-Host "╔══════════════════════════════════════════════════╗" -ForegroundColor Cyan
          Write-Host "║       WINDOWS CLOUD RDP - SESSION 1 / 6         ║" -ForegroundColor Cyan
          Write-Host "║       Hours 1 - 6                                ║" -ForegroundColor Cyan
          Write-Host "╚══════════════════════════════════════════════════╝" -ForegroundColor Cyan
          Write-Host ""
          Write-Host "  OS   : $((Get-WmiObject Win32_OperatingSystem).Caption)" -ForegroundColor Yellow
          Write-Host "  CPU  : $((Get-WmiObject Win32_Processor).Name)" -ForegroundColor Yellow
          Write-Host "  RAM  : $([math]::Round((Get-WmiObject Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 2)) GB" -ForegroundColor Yellow
          Write-Host "  Disk : $([math]::Round((Get-PSDrive C).Free / 1GB, 2)) GB free" -ForegroundColor Yellow
          Write-Host "  Time : $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss') UTC" -ForegroundColor Yellow
          Write-Host ""

      - name: 🖥️ Enable Remote Desktop
        run: |
          Write-Host "[*] Enabling Remote Desktop..." -ForegroundColor Cyan
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fSingleSessionPerUser" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Write-Host "[✓] Remote Desktop ENABLED" -ForegroundColor Green

      - name: 👤 Create Admin User
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
          RDP_USERNAME: ${{ github.event.inputs.rdp_username }}
        run: |
          echo "::add-mask::$Env:RDP_PASSWORD"
          $username   = $Env:RDP_USERNAME
          $password   = $Env:RDP_PASSWORD
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          New-LocalUser -Name $username -Password $securePass `
            -FullName "Cloud RDP Admin" -PasswordNeverExpires `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember -Group "Administrators" -Member $username -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username -ErrorAction SilentlyContinue
          net user runneradmin $password 2>$null

          Write-Host "[✓] User '$username' configured" -ForegroundColor Green

      - name: 📦 Install Tools via Chocolatey
        run: |
          Write-Host "[*] Installing Chocolatey..." -ForegroundColor Cyan
          Set-ExecutionPolicy Bypass -Scope Process -Force
          [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
          iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))

          $tools = @("googlechrome", "vscode", "git", "7zip", "notepadplusplus", "python")
          foreach ($tool in $tools) {
            Write-Host "[*] Installing $tool..." -ForegroundColor Cyan
            choco install $tool -y --no-progress 2>$null
            Write-Host "[✓] $tool done" -ForegroundColor Green
          }

      - name: 🌐 Install & Connect Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          echo "::add-mask::$Env:TAILSCALE_AUTHKEY"
          Write-Host "[*] Downloading Tailscale..." -ForegroundColor Cyan

          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile "$Env:TEMP\tailscale.msi" -UseBasicParsing

          Start-Process msiexec -ArgumentList "/i $Env:TEMP\tailscale.msi /quiet /norestart" -Wait
          Write-Host "[✓] Tailscale installed" -ForegroundColor Green

          Start-Sleep -Seconds 5

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"
          $hostname  = "${{ github.event.inputs.hostname }}-s1-${{ github.run_id }}"

          & $tailscale up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="$hostname" --shields-up=false

          Start-Sleep -Seconds 8

          $ts_ip = & $tailscale ip -4
          echo "TAILSCALE_IP=$ts_ip" >> $Env:GITHUB_ENV

          Write-Host ""
          Write-Host "╔══════════════════════════════════════════════════╗" -ForegroundColor Green
          Write-Host "║         ✅ SESSION 1 READY TO CONNECT            ║" -ForegroundColor Green
          Write-Host "╠══════════════════════════════════════════════════╣" -ForegroundColor Green
          Write-Host "║  IP       : $ts_ip" -ForegroundColor Yellow
          Write-Host "║  Username : ${{ github.event.inputs.rdp_username }}" -ForegroundColor Yellow
          Write-Host "║  Password : [RDP_PASSWORD Secret]                ║" -ForegroundColor Yellow
          Write-Host "║  Connect  : mstsc /v:$ts_ip" -ForegroundColor Cyan
          Write-Host "║  Session  : 1 / 6  (Hours 1-6)                   ║" -ForegroundColor Magenta
          Write-Host "╚══════════════════════════════════════════════════╝" -ForegroundColor Green

      - name: ⏳ Keep Alive - Session 1 (6 Hours)
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          echo "::add-mask::$Env:TAILSCALE_AUTHKEY"
          $tailscale    = "C:\Program Files\Tailscale\tailscale.exe"
          $totalMinutes = 355

          for ($i = 1; $i -le $totalMinutes; $i++) {
            Start-Sleep -Seconds 60
            $remaining = $totalMinutes - $i
            $percent   = [math]::Round(($i / $totalMinutes) * 100)
            $filled    = [math]::Round($percent / 5)
            $bar       = ("█" * $filled) + ("░" * (20 - $filled))
            Write-Host "  S1 | [$bar] $percent% | ${i}m elapsed | ${remaining}m left" -ForegroundColor Cyan

            if ($i % 15 -eq 0) {
              $svc = Get-Service "TermService" -ErrorAction SilentlyContinue
              if ($svc.Status -ne "Running") { Start-Service "TermService" }

              try {
                $status = & $tailscale status --json | ConvertFrom-Json
                if ($status.BackendState -ne "Running") {
                  Write-Host "  [!] Reconnecting Tailscale..." -ForegroundColor Yellow
                  & $tailscale up --authkey="$Env:TAILSCALE_AUTHKEY" --shields-up=false
                } else {
                  $ts_ip = & $tailscale ip -4
                  Write-Host "  [✓] Tailscale OK: $ts_ip" -ForegroundColor Green
                }
              } catch {
                Write-Host "  [!] Tailscale check failed" -ForegroundColor Yellow
              }

              $cpu  = (Get-WmiObject Win32_Processor).LoadPercentage
              $ram  = [math]::Round((Get-WmiObject Win32_OperatingSystem).FreePhysicalMemory / 1MB, 1)
              $disk = [math]::Round((Get-PSDrive C).Free / 1GB, 1)
              Write-Host "  [📊] CPU: $cpu% | Free RAM: ${ram}GB | Free Disk: ${disk}GB" -ForegroundColor Gray
            }

            if ($remaining -eq 10) {
              Write-Host "  ⚠️  Session 1 ends in 10 min - Session 2 starts next!" -ForegroundColor Red
            }
          }
          Write-Host "[✓] Session 1 Complete!" -ForegroundColor Green

  # ============================================================
  # SESSION 2 - Hours 7-12
  # ============================================================
  session-2:
    needs: session-1
    if: always() && inputs.sessions >= '2'
    runs-on: windows-latest
    timeout-minutes: 360
    steps:

      - name: 🔧 System Info
        run: |
          Write-Host ""
          Write-Host "╔══════════════════════════════════════════════════╗" -ForegroundColor Cyan
          Write-Host "║       WINDOWS CLOUD RDP - SESSION 2 / 6         ║" -ForegroundColor Cyan
          Write-Host "║       Hours 7 - 12                               ║" -ForegroundColor Cyan
          Write-Host "╚══════════════════════════════════════════════════╝" -ForegroundColor Cyan

      - name: 🖥️ Enable Remote Desktop
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fSingleSessionPerUser" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Write-Host "[✓] Remote Desktop ENABLED" -ForegroundColor Green

      - name: 👤 Create Admin User
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
          RDP_USERNAME: ${{ github.event.inputs.rdp_username }}
        run: |
          echo "::add-mask::$Env:RDP_PASSWORD"
          $securePass = ConvertTo-SecureString $Env:RDP_PASSWORD -AsPlainText -Force
          New-LocalUser -Name $Env:RDP_USERNAME -Password $securePass -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member $Env:RDP_USERNAME -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $Env:RDP_USERNAME -ErrorAction SilentlyContinue
          net user runneradmin $Env:RDP_PASSWORD 2>$null
          Write-Host "[✓] User configured" -ForegroundColor Green

      - name: 🌐 Install & Connect Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          echo "::add-mask::$Env:TAILSCALE_AUTHKEY"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile "$Env:TEMP\tailscale.msi" -UseBasicParsing
          Start-Process msiexec -ArgumentList "/i $Env:TEMP\tailscale.msi /quiet /norestart" -Wait
          Start-Sleep -Seconds 5

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"
          & $tailscale up --authkey="$Env:TAILSCALE_AUTHKEY" `
            --hostname="${{ github.event.inputs.hostname }}-s2-${{ github.run_id }}" --shields-up=false

          Start-Sleep -Seconds 8
          $ts_ip = & $tailscale ip -4
          echo "TAILSCALE_IP=$ts_ip" >> $Env:GITHUB_ENV

          Write-Host ""
          Write-Host "╔══════════════════════════════════════════════════╗" -ForegroundColor Green
          Write-Host "║         ✅ SESSION 2 READY TO CONNECT            ║" -ForegroundColor Green
          Write-Host "╠══════════════════════════════════════════════════╣" -ForegroundColor Green
          Write-Host "║  IP       : $ts_ip" -ForegroundColor Yellow
          Write-Host "║  Username : ${{ github.event.inputs.rdp_username }}" -ForegroundColor Yellow
          Write-Host "║  Connect  : mstsc /v:$ts_ip" -ForegroundColor Cyan
          Write-Host "║  Session  : 2 / 6  (Hours 7-12)                  ║" -ForegroundColor Magenta
          Write-Host "╚══════════════════════════════════════════════════╝" -ForegroundColor Green

      - name: ⏳ Keep Alive - Session 2 (6 Hours)
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          echo "::add-mask::$Env:TAILSCALE_AUTHKEY"
          $tailscale    = "C:\Program Files\Tailscale\tailscale.exe"
          $totalMinutes = 355

          for ($i = 1; $i -le $totalMinutes; $i++) {
            Start-Sleep -Seconds 60
            $remaining = $totalMinutes - $i
            $percent   = [math]::Round(($i / $totalMinutes) * 100)
            $filled    = [math]::Round($percent / 5)
            $bar       = ("█" * $filled) + ("░" * (20 - $filled))
            Write-Host "  S2 | [$bar] $percent% | ${i}m elapsed | ${remaining}m left" -ForegroundColor Cyan

            if ($i % 15 -eq 0) {
              $svc = Get-Service "TermService" -ErrorAction SilentlyContinue
              if ($svc.Status -ne "Running") { Start-Service "TermService" }
              try {
                $status = & $tailscale status --json | ConvertFrom-Json
                if ($status.BackendState -ne "Running") {
                  & $tailscale up --authkey="$Env:TAILSCALE_AUTHKEY" --shields-up=false
                } else {
                  Write-Host "  [✓] Tailscale OK: $(& $tailscale ip -4)" -ForegroundColor Green
                }
              } catch {}
              $cpu  = (Get-WmiObject Win32_Processor).LoadPercentage
              $ram  = [math]::Round((Get-WmiObject Win32_OperatingSystem).FreePhysicalMemory / 1MB, 1)
              Write-Host "  [📊] CPU: $cpu% | Free RAM: ${ram}GB" -ForegroundColor Gray
            }
            if ($remaining -eq 10) {
              Write-Host "  ⚠️  Session 2 ends in 10 min - Session 3 starts next!" -ForegroundColor Red
            }
          }
          Write-Host "[✓] Session 2 Complete!" -ForegroundColor Green

  # ============================================================
  # SESSION 3 - Hours 13-18
  # ============================================================
  session-3:
    needs: session-2
    if: always() && inputs.sessions >= '3'
    runs-on: windows-latest
    timeout-minutes: 360
    steps:

      - name: 🔧 System Info
        run: |
          Write-Host "╔══════════════════════════════════════════════════╗" -ForegroundColor Cyan
          Write-Host "║       WINDOWS CLOUD RDP - SESSION 3 / 6         ║" -ForegroundColor Cyan
          Write-Host "║       Hours 13 - 18                              ║" -ForegroundColor Cyan
          Write-Host "╚══════════════════════════════════════════════════╝" -ForegroundColor Cyan

      - name: 🖥️ Enable Remote Desktop
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fSingleSessionPerUser" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Write-Host "[✓] Remote Desktop ENABLED" -ForegroundColor Green

      - name: 👤 Create Admin User
