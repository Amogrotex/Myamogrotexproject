# =====================================================================
# Windows Cloud RDP  —  tiny edition (v3)
# RDP + Tailscale + Python 3.12 + Java 21  +  Tiny11-style debloat
#
# NEW IN v3 (Tiny11-style optimizer, step 4)
# ------------------------------------------
#   The optimizer now strips the box the way Tiny11 strips Windows 11:
#     * Uninstalls Chrome, Edge, Firefox + their updaters, web drivers
#       and per-user profiles.
#     * Deletes Unity (Hub + every Editor version + all caches).
#     * Removes ALL non-essential Appx packages (Store, Xbox, Cortana,
#       Bing, etc.) — Notepad, Calculator, Terminal, VCLibs, winget and
#       the XAML runtime are kept so the shell still works.
#     * Removes OneDrive (uninstaller + leftovers).
#     * Kills telemetry: AllowTelemetry=0, DiagTrack/dmwappush/WER and
#       the CEIP/DiskDiagnostic scheduled tasks.
#     * Disables background services (SysMain, WSearch, Xbox, Spooler,
#       Windows Update, Delivery Optimization, ...).
#     * Deletes the huge preinstalled dev stacks: Android SDK+NDK,
#       MSYS2, Visual Studio 2022, Miniconda, R, SQL LocalDB, the
#       VS package cache — typically 20-40 GB. Remove any single line
#       in the $heavy list to keep that tool.
#     * DISM /StartComponentCleanup + /SPSuperseded to shrink WinSxS.
#     * Uses `rd /s /q` first, then robocopy /MIR (continues past
#       locked files) as a fallback — far faster than Remove-Item.
#   All of it runs AFTER the Tailscale IP is published, so you connect
#   instantly and the cleanup finishes behind your session. Toggle it
#   with the `optimize` input (default: on).
#
# WHY THIS VERSION IS FASTER (numbers are from your own runs #108-#110,
# read off the Actions API step timestamps):
#
#   old step 1 "Configure RDP and Install Python + Java"  20-25 s   <== the delay
#   old step 2 "Configure RDP Users"                       1-2 s
#   old step 3 "Install and Connect Tailscale"             8-13 s   <== what you wait for
#   old step 4 "Show Connection Information"               1 s
#   old step 5 "Keep Server Alive"                         340 min (unchanged)
#
#   Step 1 was one serial block: RDP registry -> download+install Python
#   (27 MB) -> download+install Java (205 MB). Tailscale, the only thing
#   standing between you and an RDP session, waited behind all of it.
#
#   What was actually wrong, found while measuring:
#
#   1. The Java install never worked. The Adoptium URL used
#      (…/binary/latest/21/ga/windows/x64/jdk/hotspot/normal/eclipse)
#      307-redirects to OpenJDK21U-jdk_x64_windows_hotspot_*.zip - a ZIP -
#      which was then handed to `msiexec /i C:\jdk.msi`. msiexec cannot
#      install a ZIP, and the exit code was never checked, so the step
#      printed "Java installed." having installed nothing.
#   2. Both downloads were pointless. windows-2025 ships Python 3.12.10
#      and Temurin 21.0.12 (JAVA_HOME_21_X64) already. ~232 MB of
#      downloading, and two installers, on the critical path, for
#      software that is already on the machine.
#   3. Invoke-WebRequest on Windows PowerShell 5.1 is dramatically slower
#      and more memory hungry than curl.exe for binaries this size.
#   4. Fixed Start-Sleep 2 plus a 1 s-granularity retry loop in the
#      Tailscale step.
#
#   Now: ~232 MB of downloads and two installer processes are gone from
#   the critical path, so time-to-RDP-IP should land around 12-18 s
#   (RDP setup + Tailscale only) instead of 30-38 s. Keep-alive duration
#   and total job time are unchanged; the tools are wired up AFTER the IP
#   is published, so even the download fallback path cannot delay a login.
# =====================================================================

name: Windows Cloud RDP

on:
  workflow_dispatch:
    inputs:
      keepalive_minutes:
        description: 'Minutes to hold the runner alive after the RDP IP is published'
        required: false
        default: '340'
      setup_tools:
        description: 'Wire up preinstalled Python + Java for the RDP session'
        type: boolean
        required: false
        default: true
      optimize:
        description: 'Tiny11-style debloat: purge Chrome/Edge/Unity/apps/telemetry + free disk (after IP is live)'
        type: boolean
        required: false
        default: true

# If you raise the keep-alive above 340, raise timeout-minutes too.
env:
  KEEPALIVE_MINUTES: ${{ github.event.inputs.keepalive_minutes || '340' }}

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 355

    steps:

      # ===============================================================
      # 1. RDP + PERFORMANCE   (registry + firewall only: no network I/O)
      # ===============================================================
      - name: 1. Configure RDP and performance
        shell: powershell
        run: |
          $rdp    = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp"
          $policy = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          New-Item -Path $policy -Force | Out-Null

          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path $rdp -Name "UserAuthentication" -Value 0 -ErrorAction SilentlyContinue

          # Same RDP behaviour as before, applied in one pass.
          Set-ItemProperty -Path $policy -Name "SelectTransport"      -Type DWord -Value 2 -Force
          Set-ItemProperty -Path $policy -Name "fCompressionEnabled"  -Type DWord -Value 1 -Force
          Set-ItemProperty -Path $policy -Name "ColorDepth"           -Type DWord -Value 2 -Force
          Set-ItemProperty -Path $policy -Name "fDisableAudioCapture" -Type DWord -Value 1 -Force
          Set-ItemProperty -Path $policy -Name "fDisableCdm"          -Type DWord -Value 1 -Force
          foreach ($n in "fDisableWallpaper","fDisableFullWindowDrag","fDisableMenuAnims","fDisableThemes") {
            Set-ItemProperty -Path $rdp -Name $n -Value 1 -ErrorAction SilentlyContinue
          }

          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
          powercfg /change monitor-timeout-ac 0
          powercfg /change standby-timeout-ac 0
          powercfg /change hibernate-timeout-ac 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          foreach ($proto in "TCP","UDP") {
            $dn = "Cloud RDP $proto 3389"
            Remove-NetFirewallRule -DisplayName $dn -ErrorAction SilentlyContinue
            New-NetFirewallRule -DisplayName $dn -Direction Inbound -Protocol $proto -LocalPort 3389 -Action Allow -Profile Any | Out-Null
          }

          Set-Service   -Name "TermService" -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service -Name "TermService" -ErrorAction SilentlyContinue
          Write-Host "RDP ready." -ForegroundColor Green


      # ===============================================================
      # 2. USERS
      # ===============================================================
      - name: 2. Configure RDP users
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $Password = ConvertTo-SecureString "Cynet@2026" -AsPlainText -Force

          if (Get-LocalUser -Name "CynetAdmin" -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name "CynetAdmin" -Password $Password
          } else {
            New-LocalUser -Name "CynetAdmin" -Password $Password -PasswordNeverExpires -AccountNeverExpires
          }

          net user runneradmin "Cynet@2026" /active:yes | Out-Null

          foreach ($u in "CynetAdmin","runneradmin") {
            foreach ($g in "Administrators","Remote Desktop Users") {
              Add-LocalGroupMember -Group $g -Member $u -ErrorAction SilentlyContinue
            }
          }
          Write-Host "RDP USERS READY" -ForegroundColor Green


      # ===============================================================
      # 3. TAILSCALE + CONNECTION CARD
      #    Nothing unrelated is allowed in front of this step, because
      #    this is the thing that produces the address you connect to.
      # ===============================================================
      - name: 3. Connect Tailscale and publish the IP
        id: ts
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Continue"
          $msi = "C:\tailscale.msi"

          & curl.exe -sSL --fail --retry 5 --retry-delay 1 --retry-connrefused --connect-timeout 15 `
            -o $msi "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          if (-not (Test-Path $msi)) { throw "Could not download Tailscale." }

          $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /quiet /norestart TS_NOLAUNCH=1" -Wait -PassThru
          Write-Host "msiexec exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { throw "Tailscale install failed (msiexec $($p.ExitCode))." }
          Remove-Item $msi -Force -ErrorAction SilentlyContinue

          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not (Test-Path $ts)) { throw "Tailscale executable not found after installation." }

          # Wait for the service to exist instead of sleeping blindly.
          for ($i = 0; $i -lt 40; $i++) {
            if (Get-Service -Name "Tailscale" -ErrorAction SilentlyContinue) { break }
            Start-Sleep -Milliseconds 250
          }
          Start-Service -Name "Tailscale" -ErrorAction SilentlyContinue

          & $ts up --authkey="$env:TAILSCALE_AUTHKEY" --hostname="github-rdp-server" `
                   --ssh=false --accept-dns=false --unattended=true
          if ($LASTEXITCODE -ne 0) { throw "Tailscale connection failed. Exit code: $LASTEXITCODE" }

          # Tight poll: 0.25 s steps, capped at 30 s, instead of 40 x 1 s.
          $tsIp = $null
          for ($i = 0; $i -lt 120; $i++) {
            $raw = (& $ts ip -4 2>$null | Select-Object -First 1)
            if ($raw) {
              $cand = ([string]$raw).Trim()
              if ($cand -match "^100\.") { $tsIp = $cand; break }
            }
            Start-Sleep -Milliseconds 250
          }
          if (-not $tsIp) { throw "Tailscale connected but no IPv4 address was returned." }

          "tailscale_ip=$tsIp" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii

          # The log scrolls; the run summary page keeps the details visible
          # for the whole session.
          @(
            "### Windows RDP online",
            "",
            "| | |",
            "|---|---|",
            "| Tailscale IP | $tsIp |",
            "| Connect | ``mstsc /v:$tsIp`` |",
            "| Username | ``runneradmin`` |",
            "| Keep alive | ``$($env:KEEPALIVE_MINUTES) min`` |",
            ""
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding ascii

          Write-Host ""
          Write-Host "##################################################" -ForegroundColor Green
          Write-Host "#              WINDOWS RDP ONLINE                #" -ForegroundColor Green
          Write-Host "##################################################" -ForegroundColor Green
          Write-Host "# Tailscale IP : $tsIp" -ForegroundColor Yellow
          Write-Host "# RDP Port     : 3389" -ForegroundColor Yellow
          Write-Host "# Username     : runneradmin" -ForegroundColor Yellow
          Write-Host "# Password     : Cynet@2026" -ForegroundColor Yellow
          Write-Host "# Connect with : mstsc /v:$tsIp" -ForegroundColor Magenta
          Write-Host "##################################################" -ForegroundColor Green
          Write-Host "You can connect now; Tiny11 debloat + tool wiring run behind you." -ForegroundColor Cyan


      # ===============================================================
      # 4. OPTIMIZE — Tiny11-style debloat
      #    Runs AFTER the IP is live: connect instantly, this finishes
      #    in the background. `rd /s /q` first (fast), then robocopy
      #    /MIR as a fallback that continues past locked files — far
      #    faster than Remove-Item -Recurse on multi-GB trees.
      #    NEVER touches: TermService/RDP, Tailscale, the runner
      #    (C:\actions), hostedtoolcache (Python/Java wiring in step 5),
      #    Git, PowerShell or .NET.
      # ===============================================================
      - name: 4. Optimize — Tiny11 debloat (apps/telemetry/Chrome/Edge/Unity)
        if: ${{ inputs.optimize }}
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $before = (Get-PSDrive -Name C).Free

          # ---------- 1. kill processes that lock the folders ----------
          Write-Host "[1/9] Killing locked processes" -ForegroundColor Cyan
          foreach ($n in "chrome","msedge","firefox","Unity","Unity Hub","UnityCrashHandler64","UnityCrashHandler32","UnityPackageManager","qtshaderexporter","OneDrive","OneDriveSetup","devenv","MSBuild","ServiceHub.Host.CLR.x64","ServiceHub.RoslynCodeAnalysisService","vs_installershell") {
            Get-Process -Name $n -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }

          # ---------- 2. stop updaters, drop their scheduled tasks ----------
          Write-Host "[2/9] Removing updater tasks" -ForegroundColor Cyan
          foreach ($svc in "gupdate","gupdatem","edgeupdate","edgeupdatem") {
            Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue
          }
          foreach ($t in "\GoogleUpdateTaskMachineCore","\GoogleUpdateTaskMachineUA","\MicrosoftEdgeUpdateTaskMachineCore","\MicrosoftEdgeUpdateTaskMachineUA","\Microsoft\Windows\Application Experience\Microsoft Compatibility Appraiser","\Microsoft\Windows\Customer Experience Improvement Program\Consolidator","\Microsoft\Windows\DiskDiagnostic\Microsoft-Windows-DiskDiagnosticDataCollector","\Microsoft\Windows\Windows Error Reporting\QueueReporting") {
            & schtasks.exe /Delete /TN $t /F 2>$null | Out-Null
          }

          # Defender real-time scan re-checks every file we delete and
          # makes bulk removal crawl; switch it off for the session.
          try { Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop } catch {}

          # ---------- 3. fast delete helper: rd, then robocopy /MIR fallback ----------
          function Remove-Fast {
            param([string[]]$Path)
            foreach ($p in $Path) {
              if ([string]::IsNullOrWhiteSpace($p)) { continue }
              if (-not (Test-Path -LiteralPath $p)) { continue }
              $arg = 'rd /s /q "' + $p.TrimEnd('\') + '"'
              & cmd.exe /c $arg 2>$null | Out-Null
              if (Test-Path -LiteralPath $p) {
                # robocopy /MIR against an empty dir clears what rd could not
                $empty = Join-Path $env:TEMP ("_empty_" + [guid]::NewGuid().ToString("N"))
                New-Item -ItemType Directory -Path $empty -Force | Out-Null
                & robocopy.exe $empty $p /MIR /XJ /NFL /NDL /NJH /NJS /NP /R:0 /W:0 2>$null | Out-Null
                Remove-Item -LiteralPath $empty -Force -Recurse -EA SilentlyContinue
                & cmd.exe /c $arg 2>$null | Out-Null
              }
              if (Test-Path -LiteralPath $p) { Write-Host ("  partial   " + $p) -ForegroundColor Yellow }
              else                           { Write-Host ("  removed   " + $p) -ForegroundColor Green }
            }
          }

          # ---------- 4. browsers: Chrome + Edge + Firefox (app/updater/driver/profile) ----------
          Write-Host "[3/9] Purging browsers (Chrome/Edge/Firefox)" -ForegroundColor Cyan
          Remove-Fast @(
            "C:\Program Files\Google\Chrome",
            "C:\Program Files (x86)\Google\Chrome",
            "C:\Program Files\Google\Update",
            "C:\Program Files (x86)\Google\Update",
            "C:\Program Files (x86)\Microsoft\Edge",
            "C:\Program Files\Microsoft\Edge",
            "C:\Program Files (x86)\Microsoft\EdgeUpdate",
            "C:\Program Files (x86)\Microsoft\EdgeCore",
            "C:\ProgramData\Microsoft\EdgeUpdate",
            "C:\Program Files\Mozilla Firefox",
            "C:\Program Files (x86)\Mozilla Firefox",
            "C:\SeleniumWebDrivers",
            "C:\selenium"
          )
          Get-ChildItem "C:\Users" -Directory -ErrorAction SilentlyContinue | ForEach-Object {
            Remove-Fast @(
              (Join-Path $_.FullName "AppData\Local\Google\Chrome"),
              (Join-Path $_.FullName "AppData\Local\Microsoft\Edge"),
              (Join-Path $_.FullName "AppData\Local\Mozilla\Firefox")
            )
          }

          # ---------- 5. Unity deleter: Hub, Editors, every cache ----------
          Write-Host "[4/9] Deleting Unity (Hub + Editors + caches)" -ForegroundColor Cyan
          Remove-Fast @(
            "C:\Program Files\Unity",
            "C:\Program Files\Unity Hub",
            "C:\Program Files (x86)\Unity",
            "C:\Program Files (x86)\Unity Hub",
            "C:\ProgramData\Unity",
            "C:\ProgramData\Unity Hub",
            "C:\ProgramData\UnityHub",
            "$env:LOCALAPPDATA\Unity",
            "$env:LOCALAPPDATA\Unity Hub",
            "$env:APPDATA\Unity",
            "$env:APPDATA\Unity Hub"
          )
          foreach ($root in "C:\Program Files","C:\Program Files (x86)","C:\ProgramData") {
            Get-ChildItem -LiteralPath $root -Directory -Filter "Unity*" -ErrorAction SilentlyContinue |
              ForEach-Object { Remove-Fast $_.FullName }
          }

          # ---------- 6. OneDrive ----------
          Write-Host "[5/9] Removing OneDrive" -ForegroundColor Cyan
          $od = "$env:SystemRoot\SysWOW64\OneDriveSetup.exe"
          if (Test-Path $od) { & $od /uninstall 2>$null | Out-Null }
          Remove-Fast @(
            "$env:LOCALAPPDATA\Microsoft\OneDrive",
            "$env:LOCALAPPDATA\OneDrive",
            "C:\ProgramData\Microsoft OneDrive",
            "C:\Users\Default\OneDrive"
          )
          foreach ($u in (Get-ChildItem "C:\Users" -Directory -ErrorAction SilentlyContinue)) {
            Remove-Fast (Join-Path $u.FullName "OneDrive")
          }

          # ---------- 7. Tiny11 Appx strip: remove Store/Xbox/Cortana/etc ----------
          # Keep: Notepad, Calculator, Terminal, VCLibs, winget, XAML runtime
          Write-Host "[6/9] Stripping Appx packages (Store/Xbox/Cortana/Bing…)" -ForegroundColor Cyan
          $keep = @("Microsoft.WindowsNotepad","Microsoft.WindowsCalculator","Microsoft.WindowsTerminal","Microsoft.VCLibs","Microsoft.DesktopAppInstaller","Microsoft.UI.Xaml")
          foreach ($p in (Get-AppxPackage -AllUsers -ErrorAction SilentlyContinue)) {
            $skip = $false
            foreach ($k in $keep) { if ($p.Name -like "$k*") { $skip = $true; break } }
            if ($skip) { continue }
            try { Remove-AppxPackage -Package $p.PackageFullName -AllUsers -ErrorAction Stop } catch {}
          }
          Get-AppxProvisionedPackage -Online -ErrorAction SilentlyContinue | ForEach-Object {
            $skip = $false
            foreach ($k in $keep) { if ($_.PackageName -like "$k*") { $skip = $true; break } }
            if ($skip) { return }
            try { Remove-AppxProvisionedPackage -Online -PackageName $_.PackageName -ErrorAction Stop } catch {}
          }

          # ---------- 8. telemetry + privacy + snappy UI registry ----------
          Write-Host "[7/9] Disabling telemetry + UI speed tweaks" -ForegroundColor Cyan
          New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection" -Force | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection" -Name "AllowTelemetry" -Type DWord -Value 0 -Force
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection" -Name "DoNotShowFeedbackNotifications" -Type DWord -Value 1 -Force
          New-Item -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\DataCollection" -Force | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\DataCollection" -Name "AllowTelemetry" -Type DWord -Value 0 -Force
          foreach ($hive in "HKCU:\Control Panel\Desktop","Registry::HKEY_USERS\.DEFAULT\Control Panel\Desktop") {
            Set-ItemProperty -Path $hive -Name "MenuShowDelay" -Value "0" -Force
            Set-ItemProperty -Path $hive -Name "AutoEndTasks" -Value "1" -Force
            Set-ItemProperty -Path $hive -Name "WaitToKillAppTimeout" -Value "2000" -Force
          }

          # ---------- 9. heavy debloat: preinstalled dev stacks (tiny = strip them) ----------
          # Remove any single line below to KEEP that tool.
          Write-Host "[8/9] Removing heavy preinstalled stacks (~20-40 GB)" -ForegroundColor Cyan
          Remove-Fast @(
            "C:\Android",                                   # Android SDK + NDK
            "C:\msys64",                                    # MSYS2 toolchain
            "C:\Miniconda",                                 # Miniconda
            "C:\Program Files\R",                           # R runtime
            "C:\Program Files\Microsoft Visual Studio\2022",# Visual Studio 2022
            "C:\Program Files (x86)\Microsoft Visual Studio",# VS Installer + older
            "C:\ProgramData\Microsoft\VisualStudio",        # VS shared packages
            "C:\ProgramData\Package Cache",                 # cached MSI installers
            "C:\Program Files\Microsoft SQL Server"         # SQL LocalDB
          )

          # ---------- 10. system junk ----------
          Write-Host "[9/9] Cleaning system junk + WinSxS" -ForegroundColor Cyan
          Remove-Fast "C:\Windows\SoftwareDistribution\Download"
          Remove-Fast ((Get-ChildItem "C:\Windows\Temp" -Force -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }))
          Remove-Fast ((Get-ChildItem $env:TEMP -Force -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }))
          Remove-Fast "C:\ProgramData\Microsoft\Windows\WER"
          Clear-RecycleBin -Force -ErrorAction SilentlyContinue
          powercfg.exe /h off 2>$null | Out-Null
          try {
            Write-Host "  DISM StartComponentCleanup (can take a few minutes)..."
            & dism.exe /Online /Cleanup-Image /StartComponentCleanup
            Write-Host "  StartComponentCleanup exit: $LASTEXITCODE"
            & dism.exe /Online /Cleanup-Image /SPSuperseded
            Write-Host "  SPSuperseded exit: $LASTEXITCODE"
          } catch { Write-Host "  DISM skipped: $($_.Exception.Message)" -ForegroundColor Yellow }

          # ---------- 11. disable background services ----------
          # TermService (RDP) and Tailscale are deliberately NOT here.
          $svcs = "DiagTrack","dmwappushservice","WSearch","SysMain","MapsBroker","WerSvc","UsoSvc","WaaSMedicSvc","wuauserv","bits","DoSvc","RemoteRegistry","Spooler","XblAuthManager","XblGameSave","XboxNetApiSvc","XboxGipSvc","gupdate","gupdatem","edgeupdate","edgeupdatem","TabletInputService","WpcMonSvc","Fax","SstpSvc","edgeupdate"
          foreach ($s in $svcs) {
            Stop-Service -Name $s -Force -ErrorAction SilentlyContinue
            Set-Service  -Name $s -StartupType Disabled -ErrorAction SilentlyContinue
          }

          # ---------- 12. report ----------
          $after = (Get-PSDrive -Name C).Free
          $freed = [math]::Round(($after - $before) / 1MB, 0)
          $freeGb = [math]::Round($after / 1GB, 1)
          Write-Host ""
          Write-Host "Tiny11 debloat done — freed $freed MB, C: now $freeGb GB free" -ForegroundColor Green
          "### Optimizer (Tiny11)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding ascii
          "- Freed **$freed MB** of disk on C: ($freeGb GB free now)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding ascii
          "- Removed Chrome/Edge/Firefox, Unity, OneDrive, Appx bloat, telemetry, Android SDK, MSYS2, Visual Studio, Miniconda, R" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding ascii


      # ===============================================================
      # 5. TOOLS - reuse what the image already ships
      #    Verified against the official windows-2025 image notes: it
      #    already contains Python 3.12.10 (with pip) and Temurin
      #    21.0.12, exposed as JAVA_HOME_21_X64. So this step finds
      #    those and exposes them on the MACHINE PATH - no 232 MB of
      #    downloads, no installer processes. Discovery verifies each
      #    candidate by the binary it needs, so it does not depend on
      #    any one directory layout.
      #    Runs after the IP is published: it can never block a login.
      # ===============================================================
      - name: 5. Wire up Python + Java (no download)
        if: ${{ inputs.setup_tools }}
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          function Add-MachinePath {
            param([string]$Dir)
            # Null-safe: a missing/empty Machine PATH must not blow up here.
            $mp = [Environment]::GetEnvironmentVariable("Path", "Machine")
            if ([string]::IsNullOrWhiteSpace($mp)) { $mp = "" }
            if ($mp -like "*$Dir*") { Write-Host "  PATH already had $Dir"; return }
            [Environment]::SetEnvironmentVariable("Path", ("$Dir;" + $mp.TrimEnd(';')), "Machine")
            Write-Host "  PATH += $Dir" -ForegroundColor Green
          }

          # ---- python: prefer the image's own 3.12 ----
          $pyDir = $null
          $hits = @(Get-ChildItem "C:\hostedtoolcache\windows\Python\3.12*\x64\python.exe" -EA SilentlyContinue)
          if ($hits.Count -eq 0) { $hits = @(Get-ChildItem "C:\Python312\python.exe" -EA SilentlyContinue) }
          if ($hits.Count -eq 0) {
            $cmd = (Get-Command python.exe -EA SilentlyContinue).Source
            # Reject the Microsoft Store stub: a real interpreter is not 0 bytes.
            if ($cmd -and (Test-Path $cmd) -and ((Get-Item $cmd).Length -gt 10kb)) { $hits = @($cmd) }
          }
          if ($hits.Count -eq 0) { $hits = @(Get-ChildItem "C:\hostedtoolcache\windows\Python\3.*\x64\python.exe" -EA SilentlyContinue | Sort-Object FullName -Descending) }
          if ($hits.Count -gt 0) {
            $p = if ($hits[0] -is [string]) { $hits[0] } else { $hits[0].FullName }
            $pyDir = Split-Path $p -Parent
          }

          # ---- java: JAVA_HOME_21_X64 is the documented anchor ----
          $jh = $null
          foreach ($cand in @(
              [Environment]::GetEnvironmentVariable("JAVA_HOME_21_X64", "Machine"),
              [Environment]::GetEnvironmentVariable("JAVA_HOME", "Machine")
          )) {
            if ($cand -and (Test-Path "$cand\bin\java.exe")) { $jh = $cand; break }
          }
          if (-not $jh) {
            foreach ($cand in @(Get-ChildItem "C:\hostedtoolcache\windows\Java_Temurin-Hotspot_jdk\21*" -Directory -EA SilentlyContinue | Sort-Object Name -Descending)) {
              foreach ($probe in @($cand.FullName, "$($cand.FullName)\x64", "$($cand.FullName)\jdk")) {
                if (Test-Path "$probe\bin\java.exe") { $jh = $probe; break }
              }
              if ($jh) { break }
            }
          }
          if (-not $jh) {
            foreach ($cand in @(Get-ChildItem "C:\Program Files\Eclipse Adoptium\jdk-21*" -Directory -EA SilentlyContinue | Sort-Object Name -Descending)) {
              if (Test-Path "$($cand.FullName)\bin\java.exe") { $jh = $cand.FullName; break }
            }
          }

          Write-Host "Discovered python: $(if ($pyDir) { $pyDir } else { 'NONE' })"
          Write-Host "Discovered java  : $(if ($jh) { $jh } else { 'NONE' })"

          # ---- stable shims: image updates move versions, these do not ----
          New-Item -ItemType Directory -Path "C:\tools" -Force | Out-Null
          function New-Shim {
            param([string]$Target, [string]$Link)
            if (-not $Target -or -not (Test-Path $Target)) { return $null }
            if (Test-Path -LiteralPath $Link) { Remove-Item -LiteralPath $Link -Force -Recurse -EA SilentlyContinue }
            try {
              New-Item -ItemType Junction -Path $Link -Target $Target -EA Stop | Out-Null
              return $Link
            } catch {
              Write-Host "  junction failed ($($_.Exception.Message)); using the real path" -ForegroundColor Yellow
              return $Target
            }
          }
          $pyReal = New-Shim -Target $pyDir -Link "C:\tools\python312"
          $jhReal = New-Shim -Target $jh    -Link "C:\tools\jdk"

          if ($jhReal) { [Environment]::SetEnvironmentVariable("JAVA_HOME", $jhReal, "Machine") }
          if ($pyReal) { Add-MachinePath $pyReal; Add-MachinePath "$pyReal\Scripts" }
          if ($jhReal) { Add-MachinePath "$jhReal\bin" }

          # ---- only if discovery came up empty do we touch the network ----
          if (-not $pyReal) {
            Write-Host "python not found on image; downloading" -ForegroundColor Yellow
            $i = "C:\tools\python-amd64.exe"
            & curl.exe -sSL --fail --retry 3 --retry-delay 2 -o $i "https://www.python.org/ftp/python/3.12.10/python-3.12.10-amd64.exe"
            if ($LASTEXITCODE -eq 0) {
              $null = Start-Process $i -Wait -PassThru -ArgumentList "/quiet InstallAllUsers=1 PrependPath=1 Include_pip=1"
              Remove-Item $i -Force -EA SilentlyContinue
              if (Test-Path "C:\Program Files\Python312\python.exe") { $pyReal = "C:\Program Files\Python312" }
            } else { Write-Host "  python download failed (curl $LASTEXITCODE)" -ForegroundColor Red }
          }
          if (-not $jhReal) {
            Write-Host "java not found on image; downloading" -ForegroundColor Yellow
            $z = "C:\tools\jdk.zip"
            & curl.exe -sSL --fail --retry 3 --retry-delay 2 -o $z "https://api.adoptium.net/v3/binary/latest/21/ga/windows/x64/jdk/hotspot/normal/eclipse"
            if ($LASTEXITCODE -eq 0) {
              # That endpoint serves a .zip - so it is UNPACKED. The old file
              # handed it to msiexec, which silently installed nothing.
              $t = "C:\tools\unzip"
              New-Item -ItemType Directory -Path $t -Force | Out-Null
              & tar.exe -xf $z -C $t
              if ($LASTEXITCODE -ne 0) {
                Write-Host "  tar.exe failed ($LASTEXITCODE); falling back to System.IO.Compression"
                Add-Type -AssemblyName System.IO.Compression.FileSystem
                [IO.Compression.ZipFile]::ExtractToDirectory($z, $t)
              }
              $inner = Get-ChildItem -LiteralPath $t -Directory | Select-Object -First 1
              if ($inner) {
                $final = "C:\tools\jdk"
                if (Test-Path -LiteralPath $final) { Remove-Item -LiteralPath $final -Recurse -Force }
                Move-Item -LiteralPath $inner.FullName -Destination $final -Force
                [Environment]::SetEnvironmentVariable("JAVA_HOME", $final, "Machine")
                Add-MachinePath "$final\bin"
                $jhReal = $final
              }
              Remove-Item $t, $z -Recurse -Force -EA SilentlyContinue
            } else { Write-Host "  jdk download failed (curl $LASTEXITCODE)" -ForegroundColor Red }
          }

          # Both conditions must be tested explicitly: in PowerShell -and/-or
          # return booleans, so "$a -or $b" never yields $a (that bug would
          # have written "True\bin" into the Machine PATH).
          $pyOk = [bool]$pyReal -and (Test-Path "$pyReal\python.exe")
          $jvOk = [bool]$jhReal -and (Test-Path "$jhReal\bin\java.exe")
          Write-Host ""
          Write-Host "python ready for RDP sessions : $pyOk" -ForegroundColor $(if ($pyOk) { "Green" } else { "Red" })
          Write-Host "java   ready for RDP sessions : $jvOk" -ForegroundColor $(if ($jvOk) { "Green" } else { "Red" })
          if (-not ($pyOk -and $jvOk)) { throw "tool wiring did not produce a usable python+java" }

      # ===============================================================
      # 6. KEEP ALIVE
      #    Idle minutes cost nothing in log volume; every 5 minutes is
      #    plenty to show the runner is still alive.
      # ===============================================================
      - name: 6. Keep server alive
        shell: powershell
        run: |
          $total = [int]$env:KEEPALIVE_MINUTES
          Write-Host "SERVER RUNNING - $total minutes (status every 5 min)" -ForegroundColor Green
          Write-Host ("Connect: mstsc /v:" + "${{ steps.ts.outputs.tailscale_ip }}") -ForegroundColor Magenta
          for ($i = 1; $i -le $total; $i++) {
            Start-Sleep -Seconds 60
            if (($i % 5) -eq 0) { Write-Host "[$i/$total] Server running..." -ForegroundColor Green }
          }
