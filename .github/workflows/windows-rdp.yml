# =====================================================================
# Windows Cloud RDP - LEAN & FAST EDITION (v5)
# ---------------------------------------------------------------------
# Drop-in replacement for the old 818-line v4. Same features, fewer
# failure points, strictly ASCII (safe for Windows PowerShell).
#
# WHAT CHANGED vs v4
#   * RDP password is hard-coded as a PowerShell string in the RDP setup step.
#   * SPEED: official tailscale/github-action@v3 (cached binaries) runs
#     as the FIRST real step; RDP config is local-only, so the session
#     is reachable in well under a minute.
#   * BUG FIX: keep-alive could exceed the 355-min job timeout and get
#     the session killed mid-use. Now auto-computed from actual elapsed
#     time with a safety margin.
#   * NLA is ON by default (faster auth + safer). Input `nla: false`
#     restores the old behavior for legacy clients.
#   * CONNECTION QUALITY: optional Tailscale RTT/path check to the client.
#   * DESKTOP: dark theme, requested wallpaper, and This PC icon by default.
#   * CLEANUP: helper scripts are not downloaded to the desktop.
#
# REQUIRED SETUP:
#   TAILSCALE_AUTHKEY repo secret - Tailscale auth key (reusable + ephemeral)
#   RDP password - inline as $rdpPassword in the RDP configuration step.
#     Never reboot Windows from INSIDE the RDP session: the runner agent dies
#     with the VM and the job fails. To get a fresh system, run the companion
#     workflow "Windows RDP Restart" (windows-rdp-restart.yml).
# =====================================================================

name: Windows Cloud RDP

on:
  workflow_dispatch:
    inputs:
      keepalive_minutes:
        description: 'Minutes to hold the session after startup (auto-clamped to job timeout)'
        required: false
        default: '340'
      setup_tools:
        description: 'Verify preinstalled Python + Java are on PATH'
        type: boolean
        required: false
        default: true
      optimize:
        description: 'Free disk space (caches + heavy SDKs) AFTER session is reachable'
        type: boolean
        required: false
        default: true
      rdp_scope:
        description: 'Who may reach RDP port 3389 through the firewall'
        type: choice
        required: false
        default: 'tailscale'
        options:
          - tailscale
          - any
      nla:
        description: 'Network Level Authentication (OFF matches the classic mstsc login flow)'
        type: boolean
        required: false
        default: false
      client_tailscale_ip:
        type: string
        description: 'Optional: your PC Tailscale IPv4 for latency/path checks (or set repo variable RDP_CLIENT_TS_IP)'
        required: false
        default: ''

# Least privilege: the job only reads the repo.
permissions:
  contents: read

jobs:
  rdp:
    runs-on: windows-2025
    timeout-minutes: 355   # hosted-runner hard max is 360; leave margin

    steps:

      # -------------------------------------------------------------
      # 0. PREFLIGHT - record job start epoch
      # -------------------------------------------------------------
      - name: 0. Preflight (start clock)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          "JOB_START_EPOCH=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_ENV
          Write-Host 'Preflight OK: job clock started.' -ForegroundColor Green

      # -------------------------------------------------------------
      # 1. TAILSCALE FIRST - fastest possible path to a reachable IP
      # -------------------------------------------------------------
      - name: 1. Connect Tailscale (IP as early as possible)
        id: ts
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          use-cache: 'true'

      - name: 2. Get Tailscale IPv4 (verify gate)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ts  = "C:\Program Files\Tailscale\tailscale.exe"
          $ip  = $null
          for ($i = 0; $i -lt 120; $i++) {
            $cand = ([string](& $ts ip -4 2>$null | Select-Object -First 1)).Trim()
            if ($cand -match '^100\.') { $ip = $cand; break }
            Start-Sleep -Milliseconds 500
          }
          if (-not $ip) {
            Write-Host ("tailscale status: " + ((& $ts status 2>&1 | Out-String).Trim()))
            throw "ROOT-CAUSE: no 100.x IPv4 after 60s (expired/revoked authkey is the usual cause)."
          }
          "tailscale_ip=$ip" >> $env:GITHUB_OUTPUT
          try {
            & $ts set --hostname=mainy 2>$null
            Write-Host 'Tailscale hostname set to: mainy' -ForegroundColor Green
          } catch {
            Write-Host ('hostname rename skipped: ' + $_.Exception.Message) -ForegroundColor Yellow
          }
          Write-Host "Tailscale IP: $ip" -ForegroundColor Green

      # -------------------------------------------------------------
      # 2. RDP CONFIG - local registry/firewall/user only, no downloads
      # -------------------------------------------------------------
      - name: 3. Enable + tune RDP, create user, firewall
        shell: pwsh
        env:
          RDP_SCOPE: ${{ inputs.rdp_scope || 'tailscale' }}
          NLA_FLAG: ${{ inputs.nla && '1' || '0' }}
        run: |
          $ErrorActionPreference = 'Continue'
          $ts   = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server"
          $rdp  = "$ts\WinStations\RDP-Tcp"
          $pol  = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          New-Item -Path $pol -Force | Out-Null

          # Core: enable RDP + NLA per input
          Set-ItemProperty -Path $ts  -Name fDenyTSConnections -Value 0
          Set-ItemProperty -Path $rdp -Name UserAuthentication  -Value $env:NLA_FLAG -ErrorAction SilentlyContinue

          # Performance tuning: allow both RDP transports (UDP is usually more responsive),
          # while preserving the requested wallpaper and dark Windows theme.
          Set-ItemProperty -Path $pol -Name fCompressionEnabled  -Type DWord -Value 1 -Force
          Set-ItemProperty -Path $pol -Name SelectTransport      -Type DWord -Value 0 -Force
          Set-ItemProperty -Path $pol -Name fDisableAudioCapture -Type DWord -Value 1 -Force
          Set-ItemProperty -Path $pol -Name fDisableCdm          -Type DWord -Value 1 -Force
          Set-ItemProperty -Path $rdp -Name fDisableWallpaper -Value 0 -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $rdp -Name fDisableThemes    -Value 0 -ErrorAction SilentlyContinue
          foreach ($n in 'fDisableFullWindowDrag','fDisableMenuAnims') {
            Set-ItemProperty -Path $rdp -Name $n -Value 1 -ErrorAction SilentlyContinue
          }

          # No sleep while the session is in use
          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
          powercfg /change monitor-timeout-ac 0
          powercfg /change standby-timeout-ac 0
          powercfg /change hibernate-timeout-ac 0

          # Edit this hard-coded password here.
          $rdpPassword = 'cynet@2026'
          if ($rdpPassword -eq 'CHANGE_ME' -or $rdpPassword.Length -lt 8) {
            throw 'RDP password is a placeholder or too short; edit $rdpPassword in this step.'
          }
          $pw = ConvertTo-SecureString $rdpPassword -AsPlainText -Force
          if (Get-LocalUser -Name runneradmin -ErrorAction SilentlyContinue) {
            Set-LocalUser  -Name runneradmin -Password $pw
          } else {
            New-LocalUser  -Name runneradmin -Password $pw -PasswordNeverExpires -AccountNeverExpires
          }
          net user runneradmin /active:yes | Out-Null
          Add-LocalGroupMember -Group 'Administrators'       -Member 'runneradmin' -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member 'runneradmin' -ErrorAction SilentlyContinue

          # Second account (owner-requested): CynetAdmin, same password
          if (Get-LocalUser -Name CynetAdmin -ErrorAction SilentlyContinue) {
            Set-LocalUser  -Name CynetAdmin -Password $pw
          } else {
            New-LocalUser  -Name CynetAdmin -Password $pw -PasswordNeverExpires -AccountNeverExpires
          }
          net user CynetAdmin /active:yes | Out-Null
          Add-LocalGroupMember -Group 'Administrators'       -Member 'CynetAdmin' -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member 'CynetAdmin' -ErrorAction SilentlyContinue

          # Firewall: TCP+UDP 3389, scoped per input
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop' -ErrorAction SilentlyContinue
          $remote = if ($env:RDP_SCOPE -eq 'tailscale') { '100.64.0.0/10' } else { 'Any' }
          foreach ($proto in 'TCP','UDP') {
            $dn = "Cloud RDP $proto 3389"
            Remove-NetFirewallRule -DisplayName $dn -ErrorAction SilentlyContinue
            New-NetFirewallRule -DisplayName $dn -Direction Inbound -Protocol $proto `
              -LocalPort 3389 -RemoteAddress $remote -Action Allow -Profile Any | Out-Null
          }

          Set-Service   -Name TermService -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service -Name TermService -ErrorAction SilentlyContinue

          # ---- verify gate ----
          $fail = @()
          $deny = (Get-ItemProperty $ts -Name fDenyTSConnections -ErrorAction SilentlyContinue).fDenyTSConnections
          if ($deny -ne 0) { $fail += "fDenyTSConnections=$deny (expected 0)" }
          if (-not (Get-NetFirewallRule -DisplayName 'Cloud RDP TCP 3389' -ErrorAction SilentlyContinue)) { $fail += 'TCP firewall rule missing' }
          $svc = Get-Service TermService -ErrorAction SilentlyContinue
          if ($svc.Status -ne 'Running') { $fail += "TermService=$($svc.Status)" }
          if ((Get-LocalUser runneradmin).Enabled -ne $true) { $fail += 'runneradmin not enabled' }
          if ($fail.Count -gt 0) { throw "ROOT-CAUSE: RDP verify gate FAILED - $($fail -join '; ')" }
          Write-Host 'RDP ready (verify gate PASS).' -ForegroundColor Green

      # -------------------------------------------------------------
      # 3b. DESKTOP - dark theme, wallpaper, This PC icon, script cleanup
      # -------------------------------------------------------------
      - name: 3b. Configure desktop and remove script clutter
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Native commands are checked explicitly below so expected registry access
          # failures can be logged as warnings without failing the entire workflow.
          $PSNativeCommandUseErrorActionPreference = $false
          $wallpaperUrl  = 'https://4kwallpapers.com/images/walls/thumbs_2t/27235.jpg'
          $wallpaperPath = 'C:\Users\Public\Pictures\anime-wallpaper.jpg'
          New-Item -ItemType Directory -Path (Split-Path $wallpaperPath) -Force | Out-Null

          # The wallpaper host challenges generic command-line clients, so use a browser UA + site referer.
          $wallpaperReady = $false
          try {
            & curl.exe --fail --silent --show-error --location --retry 3 --retry-delay 2 `
              --connect-timeout 15 --max-time 90 `
              --user-agent 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36' `
              --referer 'https://4kwallpapers.com/' `
              --output $wallpaperPath $wallpaperUrl
            $curlCode = $LASTEXITCODE
            if ($curlCode -eq 0 -and (Test-Path $wallpaperPath) -and (Get-Item $wallpaperPath).Length -gt 10240) {
              $wallpaperReady = $true
              Write-Host 'Anime wallpaper downloaded.' -ForegroundColor Green
            } else {
              Write-Host "Wallpaper download failed (curl exit $curlCode); dark theme and This PC icon will still be applied." -ForegroundColor Yellow
            }
          } catch {
            Write-Host ('Wallpaper download failed; continuing with other desktop settings: ' + $_.Exception.Message) -ForegroundColor Yellow
          }

          function Set-RdpDesktopDefaults {
            param([string]$Root, [bool]$SetWallpaper)

            $personalize = "$Root\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"
            New-Item -Path $personalize -Force | Out-Null
            New-ItemProperty -Path $personalize -Name AppsUseLightTheme   -PropertyType DWord -Value 0 -Force | Out-Null
            New-ItemProperty -Path $personalize -Name SystemUsesLightTheme -PropertyType DWord -Value 0 -Force | Out-Null

            if ($SetWallpaper) {
              $desktop = "$Root\Control Panel\Desktop"
              New-Item -Path $desktop -Force | Out-Null
              New-ItemProperty -Path $desktop -Name Wallpaper      -PropertyType String -Value $wallpaperPath -Force | Out-Null
              New-ItemProperty -Path $desktop -Name WallpaperStyle -PropertyType String -Value '10' -Force | Out-Null
              New-ItemProperty -Path $desktop -Name TileWallpaper  -PropertyType String -Value '0' -Force | Out-Null
            }

            # Show This PC in both modern and classic desktop-icon views.
            $thisPcGuid = '{20D04FE0-3AEA-1069-A2D8-08002B30309D}'
            foreach ($view in 'NewStartPanel','ClassicStartMenu') {
              $icons = "$Root\Software\Microsoft\Windows\CurrentVersion\Explorer\HideDesktopIcons\$view"
              New-Item -Path $icons -Force | Out-Null
              New-ItemProperty -Path $icons -Name $thisPcGuid -PropertyType DWord -Value 0 -Force | Out-Null
            }
          }

          function Invoke-RegCommand {
            param([string[]]$RegArgs, [string]$Operation)
            try {
              $output = & reg.exe @RegArgs 2>&1
              $code = $LASTEXITCODE
              if ($code -ne 0) {
                $detail = ($output | Out-String).Trim()
                Write-Host "$Operation failed (reg.exe exit $code): $detail" -ForegroundColor Yellow
                return $false
              }
              return $true
            } catch {
              Write-Host "$Operation failed: $($_.Exception.Message)" -ForegroundColor Yellow
              return $false
            }
          }

          # Seed the default profile so CynetAdmin gets these settings at first RDP sign-in.
          $defaultHive = 'C:\Users\Default\NTUSER.DAT'
          if (Test-Path $defaultHive) {
            $defaultLoaded = Invoke-RegCommand -RegArgs @('load', 'HKU\RdpDesktopDefault', $defaultHive) -Operation 'Loading default profile hive'
            if ($defaultLoaded) {
              try {
                Set-RdpDesktopDefaults -Root 'Registry::HKEY_USERS\RdpDesktopDefault' -SetWallpaper:$wallpaperReady
              } catch {
                Write-Host ('Could not set default desktop preferences: ' + $_.Exception.Message) -ForegroundColor Yellow
              } finally {
                $null = Invoke-RegCommand -RegArgs @('unload', 'HKU\RdpDesktopDefault') -Operation 'Unloading default profile hive'
              }
            }
          } else {
            Write-Host "Default profile hive not found at $defaultHive; skipping default-profile customization." -ForegroundColor Yellow
          }

          # Also update existing account profiles when Windows allows their hives to be opened.
          foreach ($userName in 'CynetAdmin','runneradmin') {
            try {
              $account = Get-LocalUser -Name $userName -ErrorAction SilentlyContinue
              if (-not $account) { continue }
              $sid = $account.SID.Value
              $profile = Get-CimInstance -ClassName Win32_UserProfile -Filter "SID='$sid'" -ErrorAction SilentlyContinue | Select-Object -First 1
              if (-not $profile -or -not $profile.LocalPath) { continue }
              $ntuser = Join-Path $profile.LocalPath 'NTUSER.DAT'
              if (-not (Test-Path $ntuser)) { continue }

              if ($profile.Loaded) {
                try {
                  Set-RdpDesktopDefaults -Root "Registry::HKEY_USERS\$sid" -SetWallpaper:$wallpaperReady
                } catch {
                  Write-Host "Could not update loaded profile for $userName; continuing: $($_.Exception.Message)" -ForegroundColor Yellow
                }
              } else {
                $hiveKey = 'RdpDesktop_' + ($sid -replace '[^A-Za-z0-9_]', '_')
                $hiveMount = "HKU\$hiveKey"
                $loaded = Invoke-RegCommand -RegArgs @('load', $hiveMount, $ntuser) -Operation "Loading profile for $userName"
                if ($loaded) {
                  try {
                    Set-RdpDesktopDefaults -Root "Registry::HKEY_USERS\$hiveKey" -SetWallpaper:$wallpaperReady
                  } catch {
                    Write-Host "Could not set desktop preferences for $userName; continuing: $($_.Exception.Message)" -ForegroundColor Yellow
                  } finally {
                    $null = Invoke-RegCommand -RegArgs @('unload', $hiveMount) -Operation "Unloading profile for $userName"
                  }
                }
              }
            } catch {
              Write-Host "Desktop customization for $userName was skipped: $($_.Exception.Message)" -ForegroundColor Yellow
            }
          }

          # Remove leftovers from earlier versions; no helper scripts are downloaded anymore.
          $desktopPaths = @('C:\Users\CynetAdmin\Desktop', 'C:\Users\Public\Desktop')
          foreach ($desktop in $desktopPaths) {
            if (-not (Test-Path $desktop)) { continue }
            Get-ChildItem -LiteralPath $desktop -Force -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Extension -ieq '.ps1' -or
                $_.Name -match '(?i)fgi' -or
                $_.Name -ieq 'windows-rdp.yml'
              } |
              Remove-Item -Force -ErrorAction SilentlyContinue
          }
          Write-Host 'Desktop configured: dark theme, wallpaper (when downloadable), This PC icon; no fgi or PowerShell files are placed on the desktop.' -ForegroundColor Green
          # The runner treats a non-zero exit code from the last native command as a failed step.
          # All optional native-command errors above are handled; end this setup step successfully.
          $global:LASTEXITCODE = 0
          exit 0

      # -------------------------------------------------------------
      # 3. PUBLISH connection info (IP only - never the password)
      # -------------------------------------------------------------
      - name: 4. Publish connection info
        shell: pwsh
        run: |
          $ip = "${{ steps.ts.outputs.tailscale_ip }}"
          @(
            '### Windows RDP online',
            '',
            "| Setting | Value |",
            "| --- | --- |",
            "| Address | ``$ip`` |",
            "| Connect | ``mstsc /v:$ip`` |",
            "| User    | ``CynetAdmin`` (backup: ``runneradmin``) |",
            "| Desktop | dark theme, anime wallpaper, This PC icon |",
            "| RDP transport | UDP + TCP (automatic fallback) |",
            "| NLA     | ${{ inputs.nla }} |",
            "| Scope   | ${{ inputs.rdp_scope }} |",
            '',
            'Tip: keep this tab open; session ends when the job times out.'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Write-Host "Connect with: mstsc /v:$ip  (user: CynetAdmin; use the hard-coded password in the RDP setup step)"

      # -------------------------------------------------------------
      # 4. OPTIONAL - verify Python/Java wiring (preinstalled on image)
      # -------------------------------------------------------------
      - name: 5. Wire Python + Java (optional)
        if: ${{ inputs.setup_tools }}
        shell: pwsh
        run: |
          $py = (python --version 2>&1) -join ''
          $jhome = $env:JAVA_HOME_21_X64
          $java = if ($jhome -and (Test-Path "$jhome\bin\java.exe")) {
            (& "$jhome\bin\java.exe" -version 2>&1 | Select-Object -First 1)
          } else { 'JAVA_HOME_21_X64 not found' }
          Write-Host "Python: $py"
          Write-Host "Java:   $java"
          "PY_OK=$([bool]($py -match 'Python 3'))" >> $env:GITHUB_ENV

      # -------------------------------------------------------------
      # 5. OPTIONAL - disk cleanup AFTER the session is reachable
      #    (wrapped so it can never kill a working session)
      # -------------------------------------------------------------
      - name: 6. Optimize disk (optional, post-IP)
        if: ${{ inputs.optimize }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $before = [math]::Round((Get-PSDrive C).Free/1GB, 1)
          $targets = @(
            $env:ANDROID_HOME,
            "$env:ProgramFiles\Unity\Hub",
            'C:\ghc',
            'C:\hostedtoolcache\windows\stack',
            "$env:ChocolateyInstall\lib",
            "$env:LOCALAPPDATA\Temp",
            "$env:RUNNER_TEMP"
          ) | Where-Object { $_ -and (Test-Path $_) }
          foreach ($t in $targets) {
            try { Remove-Item -Path $t -Recurse -Force -ErrorAction SilentlyContinue } catch {}
          }
          foreach ($c in 'pip cache purge','npm cache clean --force') {
            try { cmd /c $c 2>$null | Out-Null } catch {}
          }
          $after = [math]::Round((Get-PSDrive C).Free/1GB, 1)
          Write-Host "Disk free: $before GB -> $after GB" -ForegroundColor Green

      # -------------------------------------------------------------
      # 6. NETWORK DIAGNOSTICS - Tailscale path, netcheck, optional client RTT
      # -------------------------------------------------------------
      - name: 7. Check Tailscale path and client latency
        shell: pwsh
        env:
          RDP_CLIENT_TS_IP: ${{ inputs.client_tailscale_ip || vars.RDP_CLIENT_TS_IP }}
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          $status = (& $ts status 2>&1 | Out-String).Trim()
          if ($status -match 'peer-relay') {
            Write-Host 'Tailscale path: peer relay detected.' -ForegroundColor Yellow
          } elseif ($status -match 'relay') {
            Write-Host 'Tailscale path: DERP relay detected; direct UDP is preferable when both networks allow it.' -ForegroundColor Yellow
          } elseif ($status -match 'direct') {
            Write-Host 'Tailscale path: direct peer connection detected.' -ForegroundColor Green
          } else {
            Write-Host 'Tailscale is connected; no active peer path is reported yet.' -ForegroundColor Yellow
          }

          Write-Host 'Tailscale network check (UDP/NAT and nearest relay diagnostics):' -ForegroundColor Cyan
          & $ts netcheck 2>&1 | ForEach-Object { Write-Host $_ }

          if ($env:RDP_CLIENT_TS_IP -match '^100\.\d{1,3}\.\d{1,3}\.\d{1,3}$') {
            Write-Host "Measuring Tailscale RTT/path to client $env:RDP_CLIENT_TS_IP (up to 10 probes):" -ForegroundColor Cyan
            & $ts ping --c 10 $env:RDP_CLIENT_TS_IP 2>&1 | ForEach-Object { Write-Host $_ }
          } else {
            Write-Host 'For an automatic client-specific RTT check, set the workflow input client_tailscale_ip or repo variable RDP_CLIENT_TS_IP to your PC 100.x address.' -ForegroundColor Yellow
          }

      # -------------------------------------------------------------
      # 7. KEEP-ALIVE - auto-clamped so the job timeout never kills
      #    the session mid-use (v4 bug fix)
      # -------------------------------------------------------------
      - name: 8. Keep session alive (auto-clamped)
        shell: pwsh
        env:
          KEEPALIVE_INPUT: ${{ inputs.keepalive_minutes }}
          RDP_CLIENT_TS_IP: ${{ inputs.client_tailscale_ip || vars.RDP_CLIENT_TS_IP }}
        run: |
          $start   = [DateTimeOffset]::FromUnixTimeSeconds([long]$env:JOB_START_EPOCH).UtcDateTime
          $elapsed = [double](([DateTimeOffset]::UtcNow) - $start).TotalMinutes
          $wanted  = 340
          try { $wanted = [int]$env:KEEPALIVE_INPUT } catch {}
          if ($wanted -le 0) { $wanted = 340 }

          $budget = [int]([double]'355' - 6 - $elapsed)   # 6-min safety margin
          $total  = [Math]::Min($wanted, $budget)
          if ($total -lt 1) {
            throw "No keep-alive budget left (elapsed $([int]$elapsed) min). Re-run the workflow."
          }
          if ($wanted -gt $budget) {
            Write-Host "Requested $wanted min but only $budget min fit in the job timeout - clamped." -ForegroundColor Yellow
          }

          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          Write-Host "Session online for $total minutes (status every 5 min)." -ForegroundColor Green
          Write-Host ("Connect now: mstsc /v:" + "${{ steps.ts.outputs.tailscale_ip }}") -ForegroundColor Magenta
          for ($i = 1; $i -le $total; $i++) {
            Start-Sleep -Seconds 60
            if (($i % 5) -eq 0) {
              $peer = (& $ts status 2>&1 | Out-String)
              if ($peer -match 'peer-relay') { $path = 'peer relay' }
              elseif ($peer -match 'relay') { $path = 'DERP relay' }
              elseif ($peer -match 'direct') { $path = 'direct' }
              else { $path = 'idle/unknown' }
              Write-Host "[$i/$total min] running - path: $path" -ForegroundColor Green
            }
          }
          Write-Host 'Keep-alive finished - session ending cleanly (not killed).' -ForegroundColor Cyan
