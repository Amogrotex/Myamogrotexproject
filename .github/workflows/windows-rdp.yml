      - name: 3. Setup Ngrok Tunnel
        run: |
          # Download Ngrok
          Invoke-WebRequest "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "C:\ngrok.zip"
          Expand-Archive "C:\ngrok.zip" -DestinationPath "C:\ngrok"
          
          # Authenticate
          C:\ngrok\ngrok.exe authtoken "39kfpc4o02bVwjKQxtbomLlO7qF_2KoSwgUzgRKRLzZpRAG4c"
          
          # Start Tunnel with log file so we can see errors
          Start-Process "C:\ngrok\ngrok.exe" -ArgumentList "tcp 3389 --log=C:\ngrok\ngrok.log --log-format=json" -WindowStyle Hidden
          
          # Wait and retry
          Write-Host "Waiting for Ngrok..."
          $maxAttempts = 30
          $attempt = 0
          $success = $false
          
          while ($attempt -lt $maxAttempts) {
            Start-Sleep -Seconds 3
            $attempt++
            Write-Host "Attempt $attempt of $maxAttempts..."
            
            try {
              $response = Invoke-RestMethod "http://localhost:4040/api/tunnels" -ErrorAction Stop
              if ($response.tunnels.Count -gt 0) {
                $success = $true
                break
              }
            } catch {
              # Show log to debug
              if (Test-Path "C:\ngrok\ngrok.log") {
                Write-Host "--- Ngrok Log ---"
                Get-Content "C:\ngrok\ngrok.log" | Select-Object -Last 5
                Write-Host "-----------------"
              }
            }
          }
          
          if ($success) {
            $raw_address = $response.tunnels[0].public_url -replace "tcp://", ""
            Write-Host ""
            Write-Host "==================================================" -ForegroundColor Green
            Write-Host "  ADDRESS  : $raw_address" -ForegroundColor Yellow
            Write-Host "  USERNAME : CynetAdmin" -ForegroundColor Yellow
            Write-Host "  PASSWORD : Cynet@2026" -ForegroundColor Yellow
            Write-Host "==================================================" -ForegroundColor Green
          } else {
            Write-Host "=== NGROK FAILED - FULL LOG ===" -ForegroundColor Red
            if (Test-Path "C:\ngrok\ngrok.log") {
              Get-Content "C:\ngrok\ngrok.log"
            }
            
            Write-Host "=== PROCESS LIST ===" -ForegroundColor Red
            Get-Process | Where-Object {$_.Name -like "*ngrok*"}
            exit 1
          }
