name: Windows Cloud RDP (via Cloudflare Tunnel)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    # GitHub Actions hard cap: 360 min (6 h) for free-tier runners
    timeout-minutes: 360

    steps:
      - name: 1. Enable RDP, Firewall, UDP Transport & Performance Tuning
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Enable-NetFirewallRule -Name "RemoteDesktop-UserMode-In-UDP" -ErrorAction SilentlyContinue
          Enable-NetFirewallRule -Name "RemoteDesktop-UserMode-In-TCP" -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

          # --- RDP performance tuning (server-side) ---
          $tsPol = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          New-Item -Path $tsPol -Force | Out-Null
          Set-ItemProperty -Path $tsPol -Name "SelectTransport" -Value 1 -Type DWord -Force     # UDP+TCP
          Set-ItemProperty -Path $tsPol -Name "ColorDepth" -Value 24 -Type DWord -Force
          Set-ItemProperty -Path $tsPol -Name "fCompressionEnabled" -Value 1 -Type DWord -Force

          # --- High Performance power plan (no CPU throttling) ---
          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c 2>$null

          Write-Host ">>> RDP enabled (UDP+TCP transport) + High Performance power plan." -ForegroundColor Green

      - name: 2. Create Admin Account
        run: |
          $Password = ConvertTo-SecureString "Cynet@2026" -AsPlainText -Force
          New-LocalUser -Name "CynetAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "CynetAdmin" -ErrorAction SilentlyContinue
          net user runneradmin Cynet@2026
          Write-Host ">>> Account CynetAdmin created / runneradmin password set." -ForegroundColor Green

      # ============================================================
      # Step 3: download cloudflared → start Quick Tunnel → print
      # connection info → KEEP THE SERVER ALIVE (watchdog loop).
      # Everything runs in ONE PowerShell process so cloudflared is
      # never orphaned/killed between steps (which caused Error 1033).
      # ============================================================
      - name: 3. Start Cloudflare Tunnel & Keep Server Alive
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $ErrorActionPreference = 'Continue'

          # ---- 3a. Cache / download cloudflared ---------------------------------
          if (-not (Test-Path "C:\cloudflared.exe")) {
            Write-Host ">>> Downloading cloudflared (latest stable Windows amd64)..." -ForegroundColor Cyan
            curl.exe -L --retry 3 --retry-delay 2 -o "C:\cloudflared.exe" `
              "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"
          } else {
            Write-Host ">>> Using cached C:\cloudflared.exe" -ForegroundColor Cyan
          }
          & "C:\cloudflared.exe" --version

          # ---- 3b. Start cloudflared as a fully detached background process -----
          # Use -WindowStyle Hidden (NOT -NoNewWindow) so the process owns its own
          # console and can't be killed when PowerShell moves between commands.
          $logOut = "C:\cloudflared.out.log"
          $logErr = "C:\cloudflared.err.log"
          foreach ($f in $logOut,$logErr) { if (Test-Path $f) { Remove-Item $f -Force } }

          # Quick Tunnel (tcp://) — no Cloudflare account, no token, no domain.
          # --protocol auto lets cloudflared pick QUIC (UDP 7844) first, falling
          # back to HTTP/2 if outbound UDP is blocked.
          $args = @(
            'tunnel',
            '--no-autoupdate',
            '--edge-ip-version', 'auto',
            '--retries', '20',
            '--protocol', 'auto',
            '--url', 'tcp://localhost:3389'
          )

          $cfProc = Start-Process -FilePath "C:\cloudflared.exe" `
            -ArgumentList $args `
            -RedirectStandardOutput $logOut -RedirectStandardError $logErr `
            -WindowStyle Hidden -PassThru

          Write-Host ">>> cloudflared launched (PID $($cfProc.Id)). Waiting for tunnel URL..." -ForegroundColor Cyan

          # Helper: combined log view
          function Get-CfLogs {
            $out = if (Test-Path $logOut) { @(Get-Content $logOut -ErrorAction SilentlyContinue) } else { @() }
            $err = if (Test-Path $logErr) { @(Get-Content $logErr -ErrorAction SilentlyContinue) } else { @() }
            return @($out + $err)
          }

          # ---- 3c. Wait for *.trycloudflare.com URL to appear -------------------
          $cfUrl = $null
          for ($i = 1; $i -le 120; $i++) {
            if ($cfProc.HasExited) {
              Write-Host ">>> cloudflared exited prematurely (code $($cfProc.ExitCode))." -ForegroundColor Red
              Write-Host "--- stdout ---"; if (Test-Path $logOut) { Get-Content $logOut -Tail 60 }
              Write-Host "--- stderr ---"; if (Test-Path $logErr) { Get-Content $logErr -Tail 60 }
              throw "cloudflared failed at startup."
            }
            $all = Get-CfLogs
            if ($all.Count -gt 0) {
              $blob = $all -join "`n"
              # Match URLs inside the ASCII box banner OR inline text
              $m = [regex]::Match($blob, 'https://[a-z0-9][a-z0-9\-]*\.trycloudflare\.com')
              if ($m.Success) { $cfUrl = $m.Value; break }
            }
            Start-Sleep -Seconds 1
          }

          if (-not $cfUrl) {
            Write-Host ">>> ERROR: Timed out waiting for Quick Tunnel URL." -ForegroundColor Red
            Write-Host "--- stdout ---"; if (Test-Path $logOut) { Get-Content $logOut -Tail 80 }
            Write-Host "--- stderr ---"; if (Test-Path $logErr) { Get-Content $logErr -Tail 80 }
            throw "cloudflared did not register a tunnel."
          }

          $cfHost = $cfUrl -replace '^https?://',''

          # ---- 3d. Warm-up pause: wait for Cloudflare edge to propagate ---------
          Write-Host ">>> Got URL: $cfUrl — giving Cloudflare edge a few seconds to propagate..." -ForegroundColor Cyan
          Start-Sleep -Seconds 8

          # ---- 3e. Print connection banner --------------------------------------
          Write-Host ""
          Write-Host "==========================================================" -ForegroundColor Green
          Write-Host "  >>> RDP SERVER IS READY! (Cloudflare Quick Tunnel) <<<"   -ForegroundColor Cyan
          Write-Host "  Tunnel Host : $cfHost"                                    -ForegroundColor Yellow
          Write-Host "  Username    : CynetAdmin"                                 -ForegroundColor Yellow
          Write-Host "  Password    : Cynet@2026"                                 -ForegroundColor Yellow
          Write-Host "==========================================================" -ForegroundColor Green
          Write-Host ""
          Write-Host ">>> HOW TO CONNECT FROM YOUR PC:" -ForegroundColor Magenta
          Write-Host ""
          Write-Host "  1) Download cloudflared (single ~25 MB exe, no installer):"
          Write-Host "     https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"
          Write-Host "     Put it on your PATH (e.g. drop it in C:\Windows\System32\)."
          Write-Host ""
          Write-Host "  2) Open PowerShell/cmd and run (LEAVE THIS WINDOW OPEN):" -ForegroundColor White
          Write-Host "     cloudflared access tcp --hostname $cfHost --url localhost:3389" -ForegroundColor Yellow
          Write-Host ""
          Write-Host "  3) Open mstsc.exe and connect to:  localhost:3389" -ForegroundColor White
          Write-Host "     Log in with user CynetAdmin / password Cynet@2026"
          Write-Host ""
          Write-Host "  4) When done, close the cloudflared window and cancel this workflow run."
          Write-Host ""
          Write-Host ">>> Tunnel uptime will be reported in this log every 10 minutes." -ForegroundColor DarkGray
          Write-Host ""

          # ---- 3f. Keep-alive + watchdog loop (one step = no cleanup kills) -----
          # GitHub Actions caps Windows jobs at 360 minutes; we loop 1-minute ticks.
          Write-Host ">>> Starting keep-alive loop (max ~6 h)." -ForegroundColor Cyan
          $maxMin = 355
          for ($i = 1; $i -le $maxMin; $i++) {
            Start-Sleep -Seconds 60

            # Watchdog: if cloudflared dies, dump logs and fail loudly
            if ($cfProc.HasExited) {
              Write-Host ">>> [$i/$maxMin] !! cloudflared (PID $($cfProc.Id)) DIED (exit $($cfProc.ExitCode))." -ForegroundColor Red
              Write-Host "--- stdout tail ---"; if (Test-Path $logOut) { Get-Content $logOut -Tail 50 }
              Write-Host "--- stderr tail ---"; if (Test-Path $logErr) { Get-Content $logErr -Tail 50 }
              throw "cloudflared died — tunnel is down."
            }

            # Heartbeat every 10 minutes
            if ($i % 10 -eq 0) {
              # Light activity to keep RDP session from idling out
              Write-Host "[$i/$maxMin] Alive ($($i) min uptime) — PID $($cfProc.Id) still running." -ForegroundColor Green
              if (Test-Path $logErr) {
                $recentErr = Get-Content $logErr -Tail 3 -ErrorAction SilentlyContinue
                if ($recentErr -and ($recentErr -match 'error|ERR|fail|disconnect|reconnect' -join '|')) {
                  Write-Host "--- recent stderr ---" -ForegroundColor Yellow
                  $recentErr | ForEach-Object { Write-Host $_ -ForegroundColor Yellow }
                }
              }
            } else {
              Write-Host "[$i/$maxMin] tick"
            }
          }

          Write-Host ">>> Reached 6-hour cap. Exiting normally." -ForegroundColor Cyan
