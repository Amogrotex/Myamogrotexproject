# Temporary VPS on GitHub Actions, reachable ONLY over Tailscale.
#
# Required repo secret (Settings -> Secrets and variables -> Actions):
#   TAILSCALE_AUTHKEY   Tailscale auth key (reusable + ephemeral recommended)
#
# Login (all modes):  user = agent   password = Arenaai
#
# Start: Actions tab -> "VPS (Tailscale)" -> Run workflow
# Stop early: Linux: `touch /tmp/stop`   Windows: `New-Item C:\stop`
# Or just cancel the run. Max lifetime is ~6 hours (GitHub job limit).

name: VPS (Tailscale)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Server type"
        type: choice
        default: linux-ssh
        options:
          - linux-ssh      # Ubuntu, headless, SSH only
          - linux-gui      # Ubuntu + XFCE desktop via RDP (xrdp) + SSH
          - windows        # Windows Server via RDP (+ OpenSSH if available)
      duration:
        description: "Minutes to stay online (max 350)"
        type: number
        default: 300

concurrency:
  group: vps
  cancel-in-progress: false

env:
  VPS_USER: agent
  VPS_PASS: Arenaai
  # Public key of the Arena agent (so the agent can SSH in). Remove to revoke.
  AGENT_SSH_PUBKEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKzN3eSZeUza3P4BJudoKSsUfv7TUzqfsCsi3GaD6jjV arena-agent"
  TS_HOSTNAME: gh-${{ inputs.mode }}-${{ github.run_number }}
  DURATION: ${{ inputs.duration }}

jobs:
  # ---------------------------------------------------------------- LINUX
  linux:
    if: inputs.mode == 'linux-ssh' || inputs.mode == 'linux-gui'
    runs-on: ubuntu-latest
    timeout-minutes: 359
    steps:
      - name: Check secret
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          [ -n "$TS_AUTHKEY" ] || { echo "::error::Secret TAILSCALE_AUTHKEY is missing"; exit 1; }

      - name: Create user (sudo + password + SSH key)
        run: |
          sudo useradd -m -s /bin/bash "$VPS_USER"
          echo "$VPS_USER:$VPS_PASS" | sudo chpasswd
          echo "$VPS_USER ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/$VPS_USER >/dev/null
          sudo mkdir -p /home/$VPS_USER/.ssh
          echo "$AGENT_SSH_PUBKEY" | sudo tee /home/$VPS_USER/.ssh/authorized_keys >/dev/null
          sudo chown -R $VPS_USER:$VPS_USER /home/$VPS_USER/.ssh
          sudo chmod 700 /home/$VPS_USER/.ssh
          sudo chmod 600 /home/$VPS_USER/.ssh/authorized_keys

      - name: Configure SSH (password + key, no root)
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq openssh-server
          printf '%s\n' \
            'PasswordAuthentication yes' \
            'KbdInteractiveAuthentication yes' \
            'PubkeyAuthentication yes' \
            'PermitRootLogin no' | sudo tee /etc/ssh/sshd_config.d/00-vps.conf >/dev/null
          sudo systemctl restart ssh || sudo systemctl restart sshd

      - name: Install desktop (XFCE + xrdp)
        if: inputs.mode == 'linux-gui'
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            xfce4 xfce4-terminal dbus-x11 xrdp firefox
          echo "xfce4-session" | sudo tee /home/$VPS_USER/.xsession >/dev/null
          sudo chown $VPS_USER:$VPS_USER /home/$VPS_USER/.xsession
          sudo adduser xrdp ssl-cert
          sudo systemctl enable --now xrdp
          sudo systemctl restart xrdp

      - name: Connect to Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey="$TS_AUTHKEY" --hostname="$TS_HOSTNAME" --ssh --accept-dns=false
          # Allow SSH/RDP only from the tailnet
          sudo iptables -A INPUT -i lo -j ACCEPT
          sudo iptables -A INPUT -i tailscale0 -j ACCEPT
          sudo iptables -A INPUT -m state --state ESTABLISHED,RELATED -j ACCEPT
          sudo iptables -A INPUT -p tcp --dport 22 -j DROP
          sudo iptables -A INPUT -p tcp --dport 3389 -j DROP

      - name: Show user and password
        run: |
          IP=$(tailscale ip -4)
          echo "=============================================="
          echo "  VPS ONLINE  (${{ inputs.mode }})"
          echo "  Tailscale IP : $IP"
          echo "  Hostname     : $TS_HOSTNAME"
          echo "  Username     : $VPS_USER"
          echo "  Password     : $VPS_PASS"
          echo "  SSH          : ssh $VPS_USER@$IP"
          if [ "${{ inputs.mode }}" = "linux-gui" ]; then
          echo "  RDP          : $IP:3389"
          fi
          echo "  Online for   : $DURATION min"
          echo "=============================================="
          {
            echo "## VPS is online (${{ inputs.mode }})"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Tailscale IP | \`$IP\` |"
            echo "| Hostname | \`$TS_HOSTNAME\` |"
            echo "| Username | \`$VPS_USER\` |"
            echo "| Password | \`$VPS_PASS\` |"
            echo "| SSH | \`ssh $VPS_USER@$IP\` |"
            if [ "${{ inputs.mode }}" = "linux-gui" ]; then
              echo "| RDP | \`$IP:3389\` |"
            fi
            echo "| Online for | $DURATION min |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep alive
        run: |
          end=$((SECONDS + DURATION * 60))
          while [ $SECONDS -lt $end ] && [ ! -f /tmp/stop ]; do
            echo "alive - $(( (end - SECONDS) / 60 )) min left"
            sleep 60
          done
          echo "Shutting down."

      - name: Leave Tailscale
        if: always()
        run: sudo tailscale logout || true

  # -------------------------------------------------------------- WINDOWS
  windows:
    if: inputs.mode == 'windows'
    runs-on: windows-latest
    timeout-minutes: 359
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check secret
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          if (-not $env:TS_AUTHKEY) { Write-Host "::error::Secret TAILSCALE_AUTHKEY is missing"; exit 1 }

      - name: Relax password policy (allow simple password)
        run: |
          secedit /export /cfg C:\secpol.cfg | Out-Null
          (Get-Content C:\secpol.cfg) `
            -replace 'PasswordComplexity = \d+', 'PasswordComplexity = 0' `
            -replace 'MinimumPasswordLength = \d+', 'MinimumPasswordLength = 0' |
            Set-Content C:\secpol.cfg
          secedit /configure /db C:\Windows\security\local.sdb /cfg C:\secpol.cfg /areas SECURITYPOLICY | Out-Null
          Remove-Item C:\secpol.cfg -Force

      - name: Create admin user
        run: |
          $pw = ConvertTo-SecureString $env:VPS_PASS -AsPlainText -Force
          New-LocalUser -Name $env:VPS_USER -Password $pw -PasswordNeverExpires -AccountNeverExpires | Out-Null
          Add-LocalGroupMember -Group "Administrators" -Member $env:VPS_USER
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $env:VPS_USER

      - name: Enable RDP (tailnet only)
        run: |
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name UserAuthentication -Value 1
          Set-NetFirewallRule -DisplayGroup "Remote Desktop" -RemoteAddress 100.64.0.0/10 -Enabled True
          Restart-Service -Name TermService -Force

      - name: Enable OpenSSH server (best effort, tailnet only)
        continue-on-error: true
        run: |
          if (-not (Get-Service sshd -ErrorAction SilentlyContinue)) {
            Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0 | Out-Null
          }
          New-Item -ItemType Directory -Force C:\ProgramData\ssh | Out-Null
          $env:AGENT_SSH_PUBKEY | Set-Content -Encoding ascii C:\ProgramData\ssh\administrators_authorized_keys
          icacls C:\ProgramData\ssh\administrators_authorized_keys /inheritance:r /grant "Administrators:F" /grant "SYSTEM:F" | Out-Null
          Set-Service sshd -StartupType Automatic
          Start-Service sshd
          New-ItemProperty -Path "HKLM:\SOFTWARE\OpenSSH" -Name DefaultShell -Value "C:\Program Files\PowerShell\7\pwsh.exe" -PropertyType String -Force | Out-Null
          Get-NetFirewallRule -Name "OpenSSH-Server-In-TCP" -ErrorAction SilentlyContinue | Remove-NetFirewallRule
          New-NetFirewallRule -Name "OpenSSH-Tailnet" -DisplayName "OpenSSH (tailnet only)" -Direction Inbound -Protocol TCP -LocalPort 22 -RemoteAddress 100.64.0.0/10 -Action Allow | Out-Null

      - name: Connect to Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $msi = "$env:RUNNER_TEMP\tailscale.msi"
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $msi
          Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /quiet /norestart" -Wait
          for ($i = 0; $i -lt 30 -and -not (Get-Service Tailscale -ErrorAction SilentlyContinue); $i++) { Start-Sleep 2 }
          Start-Service Tailscale -ErrorAction SilentlyContinue
          Start-Sleep 5
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$env:TS_AUTHKEY" --hostname="$env:TS_HOSTNAME" --unattended --accept-dns=false

      - name: Show user and password
        run: |
          $ip = (& "C:\Program Files\Tailscale\tailscale.exe" ip -4).Trim()
          $sshOk = [bool](Get-Service sshd -ErrorAction SilentlyContinue | Where-Object Status -eq Running)
          Write-Host "=============================================="
          Write-Host "  WINDOWS VPS ONLINE"
          Write-Host "  Tailscale IP : $ip"
          Write-Host "  Hostname     : $env:TS_HOSTNAME"
          Write-Host "  Username     : $env:VPS_USER"
          Write-Host "  Password     : $env:VPS_PASS"
          Write-Host "  RDP          : ${ip}:3389"
          if ($sshOk) { Write-Host "  SSH          : ssh $env:VPS_USER@$ip" }
          Write-Host "  Online for   : $env:DURATION min"
          Write-Host "=============================================="
          $lines = @(
            "## Windows VPS is online",
            "",
            "| | |",
            "|---|---|",
            "| Tailscale IP | ``$ip`` |",
            "| Hostname | ``$env:TS_HOSTNAME`` |",
            "| Username | ``$env:VPS_USER`` |",
            "| Password | ``$env:VPS_PASS`` |",
            "| RDP | ``${ip}:3389`` |"
          )
          if ($sshOk) { $lines += "| SSH | ``ssh $env:VPS_USER@$ip`` |" }
          $lines += "| Online for | $env:DURATION min |"
          $lines | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Keep alive
        run: |
          $end = (Get-Date).AddMinutes([int]$env:DURATION)
          while ((Get-Date) -lt $end -and -not (Test-Path C:\stop)) {
            Write-Host ("alive - {0:N0} min left" -f ($end - (Get-Date)).TotalMinutes)
            Start-Sleep 60
          }
          Write-Host "Shutting down."

      - name: Leave Tailscale
        if: always()
        run: '& "C:\Program Files\Tailscale\tailscale.exe" logout; exit 0'
