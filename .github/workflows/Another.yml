# =====================================================================
#  Windows Cloud RDP  --  FULL + FAST PERFORMANCE PC
# ---------------------------------------------------------------------
#  Builds a fully-provisioned, high-performance Windows desktop box.
#
#  PERFORMANCE (the "fast" part):
#    * Ultimate Performance power plan + high CPU priority
#    * No sleep / hibernation / auto-shutoff (RDP box stays hot)
#    * GPU set to Maximum performance
#    * High-performance visual FX + smooth NTFS / fast startup
#    * Virtual memory sized generously (no random paging stalls)
#    * Background apps + startup apps throttled for max foreground CPU
#    * Tailscale: MTU 1280 + Private profile + DIRECT-path peer warm-up
#    * RDP: UDP transport, 24-bit, compression, low redirection
#
#  "FULL PC":
#    * Installs a broad app/toolchain set via winget (comment/uncomment
#      to taste). Choco is used as fallback for anything winget misses.
#    * Persists your user profile + app list so the NEXT run comes back
#      looking like the same machine (restore => your files, AppData,
#      Desktop icons, settings re-applied; apps re-installed from list).
#
#  NOTE: GitHub-hosted runners are for CI only. Using them as a remote
#  desktop violates the GitHub Actions ToS and can get the account
#  suspended; runners also have NO GPU. Proceed at your own risk.
# =====================================================================
name: Windows Cloud RDP

on:
  workflow_dispatch:

env:
  TAILSCALE_NODE_NAME: github-rdp-server
  KEEPALIVE_MINUTES: 340
  PERSIST_DIR: D:\Persist
  BACKUP_FILE: C:\_backup\profile.7z

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 355

    steps:
      # ---------------------------------------------------------------
      #  Cache Tailscale MSI (no re-download) + previous profile backup.
      # ---------------------------------------------------------------
      - name: 0. Restore cached Tailscale MSI
        uses: actions/cache/restore@v4
        with:
          path: C:\tailscale.msi
          key: tailscale-msi
          restore-keys: |
            tailscale-msi

      - name: 0b. Restore previous session data
        uses: actions/cache/restore@v4
        with:
          path: C:\_backup\profile.7z
          key: profile-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            profile-

      # ---------------------------------------------------------------
      #  FULL PC PERFORMANCE TUNING
      # ---------------------------------------------------------------
      - name: 1. High-performance system tuning
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          try { [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12 } catch {}

          # --- Power: Ultimate Performance plan (cap) ---
          powercfg /setactive SCHEME_MIN 2>$null
          powercfg /setacvalueindex SCHEME_CURRENT SUB_PROCESSOR PROCTHROTTLEMAX 100
          powercfg /setacvalueindex SCHEME_CURRENT SUB_PROCESSOR PROCTHROTTLEMIN 100
          powercfg /setacvalueindex SCHEME_CURRENT SUB_PROCESSOR PERFBOOSTMODE 2
          powercfg /setdcvalueindex SCHEME_CURRENT SUB_PROCESSOR PROCTHROTTLEMAX 100
          powercfg /setactive SCHEME_CURRENT 2>$null

          # --- No sleep / hibernation / screen-off => desktop stays alive ---
          powercfg /change standby-timeout-ac 0
          powercfg /change hibernate-timeout-ac 0
          powercfg /change monitor-timeout-ac 0
          powercfg /change disk-timeout-ac 0
          powercfg /hibernate off
          powercfg /change standby-timeout-dc 0

          # --- CPU priority: favor foreground apps ---
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\PriorityControl' -Name 'Win32PrioritySeparation' -Value 26 -Type DWord

          # --- Visual FX: full performance (disable animations/transparency) ---
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects' -Name 'VisualFXSetting' -Value 3
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'MenuShowDelay' -Value 0
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop\WindowMetrics' -Name 'MinAnimate' -Value 0

          # --- Start / power-menu shutdown speed ---
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'AutoEndTasks' -Value 1
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'HungAppTimeout' -Value 2000
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'WaitToKillAppTimeout' -Value 2000

          # --- GPU: set High Performance for apps (best-effort) ---
          powercfg /setacvalueindex SCHEME_CURRENT SUB_GRAPHICS GPUPREFERENCEPREFERENCE 0 2>$null

          # --- Virtual memory: generous pagefile (avoids paging stalls) ---
          try {
            $cs = Get-CimInstance Win32_ComputerSystem
            $ramMB = [int](Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory/1MB
            $pageMB = [math]::Max(4096 + $ramMB, [int]$ramMB * 1.5)
            $Sys = Get-WmiObject Win32_ComputerSystem -EnableAllPrivileges
            $Sys.AutomaticManagedPagefile = $false
            $Sys.Put() | Out-Null
            $pg = Get-WmiObject Win32_PageFileSetting | Select-Object -First 1
            if (-not $pg) { Set-WmiInstance -Class Win32_PageFileSetting -Arguments @{ Name = 'C:\pagefile.sys' } }
            Set-WmiInstance -Class Win32_PageFileSetting -Arguments @{ Name = 'C:\pagefile.sys'; InitialSize = $pageMB; MaximumSize = $pageMB } | Out-Null
          } catch { Write-Host '>>> Virtual memory tuning skipped.' -ForegroundColor Yellow }

          # --- Disable background apps for max foreground CPU ---
          New-Item -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\BackgroundAccessApplications' -Force | Out-Null
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\BackgroundAccessApplications' -Name 'GlobalUserDisabled' -Value 1
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\BackgroundAccessApplications' -Name 'GlobalBackgroundAccess' -Value 0

          # --- Fast start-up (hybrid boot) on ---
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Power' -Name 'HiberbootEnabled' -Value 1

          Write-Host '>>> Full performance tuning applied.' -ForegroundColor Green

      # ---------------------------------------------------------------
      - name: 2. Enable RDP, Firewall, UDP & low-bandwidth RDP profile
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          try { [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12 } catch {}
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name 'fDenyTSConnections' -Value 0

          $rdpTcp = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
          Set-ItemProperty -Path $rdpTcp -Name 'UserAuthentication' -Value 0
          Set-ItemProperty -Path $rdpTcp -Name 'fCompressionEnabled' -Value 1
          Set-ItemProperty -Path $rdpTcp -Name 'fDisableAudioCapture' -Value 1
          Set-ItemProperty -Path $rdpTcp -Name 'fDisableCdm' -Value 1
          Set-ItemProperty -Path $rdpTcp -Name 'fDisableCcm' -Value 1
          Set-ItemProperty -Path $rdpTcp -Name 'fDisableLPT' -Value 1
          Set-ItemProperty -Path $rdpTcp -Name 'fDisableCpm' -Value 1
          Set-ItemProperty -Path $rdpTcp -Name 'fDisablePnPRedirection' -Value 1

          $tsPol = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          New-Item -Path $tsPol -Force | Out-Null
          Set-ItemProperty -Path $tsPol -Name 'SelectTransport'     -Value 1 -Type DWord -Force
          Set-ItemProperty -Path $tsPol -Name 'ColorDepth'          -Value 24 -Type DWord -Force
          Set-ItemProperty -Path $tsPol -Name 'fCompressionEnabled' -Value 1 -Type DWord -Force

          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop' -ErrorAction SilentlyContinue
          Enable-NetFirewallRule -Name 'RemoteDesktop-UserMode-In-UDP' -ErrorAction SilentlyContinue
          Enable-NetFirewallRule -Name 'RemoteDesktop-UserMode-In-TCP' -ErrorAction SilentlyContinue
          Write-Host '>>> RDP enabled (UDP, 24-bit, compression, low bandwidth).' -ForegroundColor Green

      # ---------------------------------------------------------------
      - name: 3. Create Admin Account
        shell: powershell
        run: |
          $pw = ConvertTo-SecureString 'Cynet@2026' -AsPlainText -Force
          try { New-LocalUser -Name 'CynetAdmin' -Password $pw -PasswordNeverExpires -ErrorAction Stop } catch {}
          try { Add-LocalGroupMember -Group 'Administrators' -Member 'CynetAdmin' -ErrorAction Stop } catch {}
          try { net user runneradmin Cynet@2026 | Out-Null } catch {}

      # ---------------------------------------------------------------
      #  FULL PC: install a broad toolset. Comment out what you don't want.
      #  winget is available on the windows-2025 image.
      # ---------------------------------------------------------------
      - name: 4. Install full app set (winget)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $ProgressPreference = 'SilentlyContinue'
          # List to taste --- each line is one app. Use --silent --accept-source-agreements.
          $apps = @(
            # Browsers
            'Google.Chrome'
            'Mozilla.Firefox'
            'Brave.Brave'
            # Editors / dev
            'Microsoft.VisualStudioCode'
            'Notepad++.Notepad++'
            'Git.Git'
            'Microsoft.PowerShell'
            'Python.Python.3.12'
            'EclipseAdoptium.Temurin.21.JDK'
            # Utils / media
            '7zip.7zip'
            'VideoLAN.VLC'
            'MPC-BE.MPC-BE'
            'Audacity.Audacity'
            'OBSProject.OBSStudio'
            # Remote / chat / misc
            'Microsoft.WindowsTerminal'
            'Discord.Discord'
            'Telegram.TelegramDesktop'
            'Bitwarden.Bitwarden'
            # Run something like a game client if you like:
            'Valve.Steam'
          )
          foreach ($a in $apps) {
            Write-Host ">>> Installing $a ..." -ForegroundColor Cyan
            winget install --id $a --silent --accept-package-agreements --accept-source-agreements --disable-interactivity 2>$null
          }
          Write-Host '>>> App install pass complete.' -ForegroundColor Green

      # ---------------------------------------------------------------
      #  Restore previous session profile (files, AppData, icons, settings)
      #  AFTER apps are installed so data lands on the right app folders.
      # ---------------------------------------------------------------
      - name: 5. Restore previous session data
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $7z = $(Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (-not $7z) { $p='C:\Program Files\7-Zip\7z.exe'; if (Test-Path $p) { $7z=$p } }
          if (-not $7z) { Write-Host '>>> 7-Zip missing - cannot restore.' -ForegroundColor Red; exit 0 }
          if (-not (Test-Path $env:BACKUP_FILE)) { Write-Host '>>> No previous profile backup - starting fresh.' -ForegroundColor Yellow; exit 0 }
          try {
            & $7z x $env:BACKUP_FILE '-oC:\Users\runneradmin' -aoa -bso0 -bsp0
            Write-Host '>>> Previous profile restored.' -ForegroundColor Green
          } catch { Write-Host ">>> Restore failed: $($_.Exception.Message)" -ForegroundColor Yellow }

      # ---------------------------------------------------------------
      #  ADVANCED TAILSCALE: login + tune + warm up DIRECT path.
      # ---------------------------------------------------------------
      - name: 6. Install & connect Tailscale (fast, direct-path warm-up)
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $ProgressPreference = 'SilentlyContinue'
          try { [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12 } catch {}
          if (-not (Test-Path 'C:\tailscale.msi')) {
            curl.exe -L --retry 3 --retry-delay 2 -o 'C:\tailscale.msi' 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi'
          }
          Start-Process msiexec -ArgumentList '/i C:\tailscale.msi /quiet /norestart' -Wait
          $ts = 'C:\Program Files\Tailscale\tailscale.exe'
          & $ts up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="$Env:TAILSCALE_NODE_NAME" --reset --ssh=false --accept-dns=false
          if ($LASTEXITCODE -ne 0) { Write-Host '>>> tailscale up FAILED - check TAILSCALE_AUTHKEY.' -ForegroundColor Red; throw 'Tailscale login failed.' }

          $ts_ip = $null
          for ($i = 1; $i -le 25; $i++) { $raw = (& $ts ip -4 2>$null | Select-Object -First 1); if ($raw) { $ts_ip = ([string]$raw).Trim(); break }; Start-Sleep -Milliseconds 750 }
          if (-not $ts_ip) { $stSelf = & $ts status --json 2>$null | ConvertFrom-Json; if ($stSelf.Self.TailscaleIPs) { $ts_ip = [string]$stSelf.Self.TailscaleIPs[0] } }

          $iface = Get-NetAdapter -IncludeHidden -ErrorAction SilentlyContinue | Where-Object { $_.InterfaceDescription -like '*Tailscale*' -or $_.Name -eq 'Tailscale' } | Select-Object -First 1
          if ($iface) {
            try { Set-NetConnectionProfile -InterfaceIndex $iface.ifIndex -NetworkCategory Private -ErrorAction Stop; Write-Host '>>> Tailscale NIC Private.' -ForegroundColor Green } catch { }
            try { netsh interface ipv4 set subinterface "$($iface.Name)" mtu=1280 store=persistent 2>$null; Write-Host '>>> MTU 1280 set.' -ForegroundColor Green } catch { }
          }

          $direct = $false; $derp = 'n/a'
          try {
            $st = & $ts status --json 2>$null | ConvertFrom-Json
            $peers = @($st.Peer.PSObject.Properties | ForEach-Object { $_.Value })
            $pingable = @($peers | Where-Object { $_.HostName -and $_.HostName -notlike "$Env:TAILSCALE_NODE_NAME*" })
            if ($pingable.Count -gt 0) { Write-Host ">>> Warming up $($pingable.Count) peer(s) ..." -ForegroundColor Cyan; foreach ($p in $pingable) { & $ts ping --c 4 --timeout 5s $p.HostName 2>$null | Out-Null } }
            $peer = $peers | Select-Object -First 1
            if ($peer) { $direct = [string]::IsNullOrEmpty([string]$peer.Relay); $derp = if ($peer.Relay) { $peer.Relay } else { 'direct (no relay)' } }
          } catch { }

          Write-Host ''
          Write-Host '==================================================' -ForegroundColor Green
          Write-Host '  >>> RDP SERVER IS READY! <<<' -ForegroundColor Cyan
          Write-Host "  Tailscale IP : $ts_ip"        -ForegroundColor Yellow
          Write-Host "  Username     : runneradmin"   -ForegroundColor Yellow
          Write-Host "  Alt user     : CynetAdmin"    -ForegroundColor Yellow
          Write-Host "  Password     : Cynet@2026"    -ForegroundColor Yellow
          Write-Host "  Connection   : $derp"         -ForegroundColor $(if ($direct) { 'Green' } else { 'Red' })
          Write-Host '  >> Open mstsc and connect to: ' -NoNewline -ForegroundColor Magenta
          Write-Host "$ts_ip"                           -ForegroundColor Magenta
          Write-Host '==================================================' -ForegroundColor Green
          if (-not $direct) {
            Write-Host ''
            Write-Host '>>> GET A DIRECT (FAST) CONNECTION <<<' -ForegroundColor Cyan
            Write-Host ' 1. Install Tailscale on YOUR PC too, same account.' -ForegroundColor Cyan
            Write-Host ' 2. Both machines must show "direct" in `tailscale status`.' -ForegroundColor Cyan
            Write-Host ' 3. Direct needs open UDP 41641 on BOTH ends.' -ForegroundColor Cyan
          }

      # ---------------------------------------------------------------
      #  Keep-alive + periodic profile snapshot so the session survives
      #  a later run coming back as the "same PC".
      # ---------------------------------------------------------------
      - name: 7. Keep Alive + periodic profile snapshot
        shell: powershell
        run: |
          $7z = $(Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (-not $7z) { $p='C:\Program Files\7-Zip\7z.exe'; if (Test-Path $p) { $7z=$p } }
          $total = [int]$env:KEEPALIVE_MINUTES
          $every = 30
          New-Item -ItemType Directory -Force -Path 'C:\_backup' | Out-Null
          for ($i = 1; $i -le $total; $i++) {
            Start-Sleep -Seconds 60
            if ($i % $every -eq 0 -or $i -eq $total) {
              if ($7z) {
                $tmp = 'C:\_backup\profile.tmp.7z'
                Remove-Item $tmp -Force -ErrorAction SilentlyContinue
                & $7z a -t7z -mx=1 -ssw -bso0 -bsp0 $tmp 'C:\Users\runneradmin\*' '-xr!AppData\Local\Temp' '-xr!*.log' '-xr!Cache' '-xr!cache' 2>$null
                if ($LASTEXITCODE -eq 0 -and (Test-Path $tmp)) { Move-Item $tmp $env:BACKUP_FILE -Force; Write-Host "[$i/$total] snapshot saved." -ForegroundColor DarkCyan }
              }
            } else { Write-Host "[$i/$total] Server running..." }
          }

      # ---------------------------------------------------------------
      - name: 8a. Verify profile backup
        if: always()
        shell: powershell
        run: |
          if (-not (Test-Path $env:BACKUP_FILE)) { Write-Error 'No profile backup created.'; exit 1 }

      - name: 8b. Save profile backup for next session
        if: always()
        uses: actions/cache/save@v4
        with:
          path: C:\_backup\profile.7z
          key: profile-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 8c. Save cached Tailscale MSI
        if: always()
        uses: actions/cache/save@v4
        with:
          path: C:\tailscale.msi
          key: tailscale-msi
