name: Windows Cloud RDP (via Cloudflare Tunnel)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Enable RDP + Firewall (TCP-only, no-NLA, permissive security)
        run: |
          # --- Turn RDP on ---
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" -Value 0

          # --- Firewall: TCP only. Do NOT enable the UDP rule — cloudflared is TCP-only
          # and leaving UDP on makes RDP waste seconds trying UDP before falling back. ---
          Enable-NetFirewallRule -Name "RemoteDesktop-UserMode-In-TCP" -ErrorAction SilentlyContinue
          Disable-NetFirewallRule -Name "RemoteDesktop-UserMode-In-UDP" -ErrorAction SilentlyContinue
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue

          # --- RDP listener config ---
          $rdpTcp = 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
          Set-ItemProperty -Path $rdpTcp -Name "UserAuthentication"       -Value 0 -Type DWord  # NLA off
          Set-ItemProperty -Path $rdpTcp -Name "SecurityLayer"            -Value 1 -Type DWord  # 1 = Negotiate (most compatible with proxies)
          Set-ItemProperty -Path $rdpTcp -Name "fAllowSecProtocolNegotiation" -Value 1 -Type DWord
          Set-ItemProperty -Path $rdpTcp -Name "MinEncryptionLevel"       -Value 1 -Type DWord  # 1 = Low (client-compatible)

          # --- Group policy overrides (TCP-only transport, 24-bit, compression) ---
          $tsPol = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          New-Item -Path $tsPol -Force | Out-Null
          Set-ItemProperty -Path $tsPol -Name "fDenyTSConnections"        -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $tsPol -Name "UserAuthentication"        -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $tsPol -Name "SelectTransport"           -Value 0 -Type DWord -Force  # 0 = TCP ONLY (critical)
          Set-ItemProperty -Path $tsPol -Name "ColorDepth"                -Value 24 -Type DWord -Force
          Set-ItemProperty -Path $tsPol -Name "fCompressionEnabled"       -Value 1 -Type DWord -Force
          Set-ItemProperty -Path $tsPol -Name "SecurityLayer"             -Value 1 -Type DWord -Force

          # --- Restart Terminal Services so new settings take effect ---
          Restart-Service TermService -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3

          # --- High Performance power plan ---
          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c 2>$null

          Write-Host ">>> RDP enabled: TCP-only, NLA off, SecurityLayer=Negotiate." -ForegroundColor Green

      - name: 2. Create Admin Account
        run: |
          $Password = ConvertTo-SecureString "Cynet@2026" -AsPlainText -Force
          New-LocalUser -Name "CynetAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "CynetAdmin" -ErrorAction SilentlyContinue
          net user runneradmin Cynet@2026 | Out-Null
          Write-Host ">>> Accounts ready (CynetAdmin / Cynet@2026)." -ForegroundColor Green

      - name: 3. Download cloudflared, start tunnel, keep alive
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $ErrorActionPreference = 'Continue'

          # ---- 3a. Verify RDP is listening on 3389 BEFORE we start the tunnel ----
          Write-Host ">>> Verifying RDP is listening on TCP/3389..." -ForegroundColor Cyan
          $listening = $false
          for ($i = 1; $i -le 30; $i++) {
            $tcp = Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue
            if ($tcp) { $listening = $true; Write-Host "    Confirmed: $($tcp.Count) listener(s) on :3389"; break }
            Start-Sleep -Seconds 1
          }
          if (-not $listening) {
            Write-Host ">>> RDP is NOT listening on 3389. NetStat output:" -ForegroundColor Red
            netstat -ano | Select-String ":3389"
            throw "RDP service failed to start listening."
          }

          # ---- 3b. Download / cache cloudflared ----
          if (-not (Test-Path "C:\cloudflared.exe")) {
            Write-Host ">>> Downloading cloudflared (latest stable)..." -ForegroundColor Cyan
            curl.exe -L --retry 3 --retry-delay 2 -o "C:\cloudflared.exe" `
              "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"
          } else {
            Write-Host ">>> Using cached C:\cloudflared.exe" -ForegroundColor Cyan
          }
          & "C:\cloudflared.exe" --version

          # ---- 3c. Launch cloudflared (detached Hidden window) ----
          $logOut = "C:\cloudflared.out.log"
          $logErr = "C:\cloudflared.err.log"
          foreach ($f in $logOut,$logErr) { if (Test-Path $f) { Remove-Item $f -Force } }

          $args = @(
            'tunnel',
            '--no-autoupdate',
            '--edge-ip-version', 'auto',
            '--retries', '50',
            '--protocol', 'auto',
            '--grace-period', '30s',
            '--url', 'tcp://localhost:3389'
          )

          $cfProc = Start-Process -FilePath "C:\cloudflared.exe" -ArgumentList $args `
            -RedirectStandardOutput $logOut -RedirectStandardError $logErr `
            -WindowStyle Hidden -PassThru

          Write-Host ">>> cloudflared launched (PID $($cfProc.Id)). Waiting for registration..." -ForegroundColor Cyan

          function Get-CfLogs {
            $out = if (Test-Path $logOut) { @(Get-Content $logOut -ErrorAction SilentlyContinue) } else { @() }
            $err = if (Test-Path $logErr) { @(Get-Content $logErr -ErrorAction SilentlyContinue) } else { @() }
            return @($out + $err)
          }

          # ---- 3d. Wait for the *.trycloudflare.com URL --------------------------
          $cfUrl = $null
          for ($i = 1; $i -le 120; $i++) {
            if ($cfProc.HasExited) {
              Write-Host ">>> cloudflared exited early (code $($cfProc.ExitCode))." -ForegroundColor Red
              Write-Host "--- stdout ---"; if (Test-Path $logOut) { Get-Content $logOut -Tail 60 }
              Write-Host "--- stderr ---"; if (Test-Path $logErr) { Get-Content $logErr -Tail 60 }
              throw "cloudflared failed at startup."
            }
            $blob = (Get-CfLogs) -join "`n"
            $m = [regex]::Match($blob, 'https://[a-z0-9][a-z0-9\-]*\.trycloudflare\.com')
            if ($m.Success) { $cfUrl = $m.Value; break }
            Start-Sleep -Seconds 1
          }
          if (-not $cfUrl) {
            Write-Host ">>> Timed out waiting for tunnel URL." -ForegroundColor Red
            Write-Host "--- stdout ---"; if (Test-Path $logOut) { Get-Content $logOut -Tail 80 }
            Write-Host "--- stderr ---"; if (Test-Path $logErr) { Get-Content $logErr -Tail 80 }
            throw "cloudflared did not register."
          }

          $cfHost = $cfUrl -replace '^https?://',''
          Write-Host ">>> Tunnel hostname: $cfHost" -ForegroundColor Green

          # ---- 3e. Wait for edge propagation + confirm tunnel is reachable ------
          # We do this by starting a SHORT cloudflared access tcp against our own
          # hostname and trying a raw TCP connection to localhost:3389 through it.
          # If that works, your PC will work too.
          Write-Host ">>> Waiting for Cloudflare edge propagation (up to 30 s)..." -ForegroundColor Cyan
          $ready = $false
          $probeLog = "C:\cloudflared-probe.log"
          for ($i = 1; $i -le 30; $i++) {
            # Wait for the "Registered tunnel connection" / "Connection registered"
            # lines in the log — that's the signal the tunnel is actually serving.
            $blob = (Get-CfLogs) -join "`n"
            if ($blob -match 'Registered tunnel connection|Connection .* registered') {
              $ready = $true
              break
            }
            Start-Sleep -Seconds 1
          }
          if (-not $ready) {
            Write-Host ">>> WARNING: Did not see 'Registered tunnel connection' log line yet, but proceeding..." -ForegroundColor Yellow
          } else {
            Write-Host ">>> Edge registered the tunnel." -ForegroundColor Green
          }

          # Extra grace period — trycloudflare DNS can lag registration by a few seconds
          Start-Sleep -Seconds 5

          # ---- 3f. Print connection banner --------------------------------------
          Write-Host ""
          Write-Host "==========================================================" -ForegroundColor Green
          Write-Host "  >>> RDP SERVER IS READY! (Cloudflare Quick Tunnel) <<<"   -ForegroundColor Cyan
          Write-Host "  Tunnel Host : $cfHost"                                    -ForegroundColor Yellow
          Write-Host "  Username    : CynetAdmin"                                 -ForegroundColor Yellow
          Write-Host "  Password    : Cynet@2026"                                 -ForegroundColor Yellow
          Write-Host "==========================================================" -ForegroundColor Green
          Write-Host ""
          Write-Host ">>> CONNECT INSTRUCTIONS (read carefully!)" -ForegroundColor Magenta
          Write-Host ""
          Write-Host "  1) Download cloudflared (single ~25 MB exe, no install):"
          Write-Host "     https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"
          Write-Host "     Save it somewhere on your PATH (e.g. C:\Windows\System32\cloudflared.exe)."
          Write-Host ""
          Write-Host "  2) OPEN A NEW POWERSHELL/CMD WINDOW and run:" -ForegroundColor White
          Write-Host "     cloudflared access tcp --hostname $cfHost --url localhost:3389" -ForegroundColor Yellow
          Write-Host ""
          Write-Host "     Wait until it prints a line like:" -ForegroundColor White
          Write-Host "       'INF Starting listener ... url=ws://127.0.0.1:3389'" -ForegroundColor DarkGray
          Write-Host "     KEEP THIS WINDOW OPEN the whole time you are connected."
          Write-Host ""
          Write-Host "  3) ONLY NOW open mstsc.exe and connect to:  localhost:3389" -ForegroundColor White
          Write-Host "     (NOT to $cfHost — NOT to any https:// URL)"
          Write-Host "     User: CynetAdmin   Password: Cynet@2026"
          Write-Host ""
          Write-Host "  4) If the proxy window shows errors (e.g. 'context canceled',"
          Write-Host "     'dial tcp', 'Unauthorized'), the tunnel wasn't ready yet —"
          Write-Host "     wait 30 s and re-run step 2 (Ctrl+C first)."
          Write-Host ""
          Write-Host "  5) If RDP still errors with 0x904: on YOUR PC also check that"
          Write-Host "     no other service is using port 3389 (e.g. you're already"
          Write-Host "     running RDP on the host). Use a different local port:"
          Write-Host "     cloudflared access tcp --hostname $cfHost --url localhost:3390"
          Write-Host "     then connect mstsc to localhost:3390" -ForegroundColor Yellow
          Write-Host ""
          Write-Host ">>> Keep-alive loop starting (max ~6 h). Log tail every 10 min." -ForegroundColor DarkGray

          # ---- 3g. Keep-alive + watchdog ---------------------------------------
          $maxMin = 355
          for ($i = 1; $i -le $maxMin; $i++) {
            Start-Sleep -Seconds 60

            if ($cfProc.HasExited) {
              Write-Host ">>> [$i/$maxMin] cloudflared (PID $($cfProc.Id)) DIED (exit $($cfProc.ExitCode))." -ForegroundColor Red
              Write-Host "--- stdout tail ---"; if (Test-Path $logOut) { Get-Content $logOut -Tail 60 }
              Write-Host "--- stderr tail ---"; if (Test-Path $logErr) { Get-Content $logErr -Tail 60 }
              throw "cloudflared died — tunnel is down."
            }

            if ($i % 10 -eq 0) {
              Write-Host "[$i/$maxMin] Alive — PID $($cfProc.Id), $($i) min uptime." -ForegroundColor Green
              $recentErr = @(Get-Content $logErr -Tail 5 -ErrorAction SilentlyContinue)
              $interesting = $recentErr | Where-Object { $_ -match 'error|ERR\b|fail|disconnect|reconnect|unable' }
              if ($interesting) {
                Write-Host "--- recent stderr (filtered) ---" -ForegroundColor Yellow
                $interesting | ForEach-Object { Write-Host "  $_" -ForegroundColor Yellow }
              }
            } else {
              Write-Host "[$i/$maxMin] tick"
            }
          }

          Write-Host ">>> Reached 6-hour cap. Exiting." -ForegroundColor Cyan
